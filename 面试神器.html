  ['mcu','为什么 MCU 程序常不用操作系统也能跑？','要点：裸机主循环+中断即可满足很多控制任务；RTOS 用于多任务/确定性调度更复杂场景。\n工程：简单执行器裸机足够；多外设/通信/人机用 RTOS 提升可维护性与实时。\n坑：裸机主循环被长任务阻塞丢实时；为“显得高级”硬上 RTOS 增复杂度。\n记忆：简单用裸机，复杂上 RTOS。'],
  ['mcu','如何估算 MCU 负载？','要点：统计各任务/中断占用时间占比(示波器打点/OS 统计/空闲任务计数)判断是否过载。\n工程：留 20~30% 余量；峰值时延满足死线；超负载要降频优化或换片。\n坑：只测平均忽略峰值，偶发超死线；没测中断占用低估负载。\n记忆：负载看峰值不是平均。'],
  ['mcu','什么是 EMC/ESD 与 MCU 侧对策？','要点：电磁兼容/静电放电：硬件滤波/屏蔽/去耦，软件看门狗/CRC/重传兜底。\n工程：汽车 EMC 严，IO 加 TVS/串阻；固件对异常帧重传不崩。\n坑：只靠硬件，软件无容错，干扰下偶发错；没留测试余量。\n记忆：EMC = “硬件抗扰+软件兜底”。'],
  ['mcu','代码/数据放哪：Flash/RAM/CCM/TCM？','要点：常量/代码放 Flash(慢但大)，变量放 SRAM，关键实时数据放 CCM/TCM(不经总线争用)。\n工程：中断向量、热函数放 TCM；大缓冲放普通 SRAM；DMA 缓冲避开 cache 区。\n坑：大数据塞 TCM 不够；热路径放 Flash 慢被总线拖。\n记忆：放哪取决于“快不快/争不争用”。'],
  ['mcu','怎么通过寄存器读芯片 ID/唯一序列号？','要点：多数 MCU 有出厂唯一 ID(UID)寄存器，用于设备标识/加密绑定。\n工程：BMS/网关用 UID 做身份；安全启动绑器件。\n坑：UID 地址随型号变，移植要改；当密钥用不够随机需加盐。\n记忆：UID = “芯片身份证号”。'],
  ['mcu','什么是“临界区”与怎么保护？','要点：一段不能被打断的共享数据操作；保护用关中断/调度锁/原子/自旋锁(多核)。\n工程：RTOS 用 `taskENTER_CRITICAL`；多核用自旋锁+屏障；越短越好。\n坑：临界区太长饿死任务/中断；忘了开中断永久关。\n记忆：临界区 = “这段时间谁都别打扰我”。'],
  ['mcu','SRAM 与 Flash 的速度/寿命/掉电差异？','要点：SRAM 快、无限次、掉电丢；Flash 慢、有限擦写、掉电保；程序跑在 Flash(或拷到 RAM 提速)。\n工程：变量在 SRAM、固件在 Flash、参数在 Flash/EEPROM 模拟；XIP 就地执行省 RAM。\n坑：Flash 擦写时不能取指同 Bank；误把运行数据放 Flash 写不进。\n记忆：SRAM 快易失，Flash 慢持久有限次。'],
  ['rtos','RTOS 任务上下文切换到底换了什么？','要点：保存当前任务寄存器(PC/LR/R0-3/R12/xPSR+FPU)到其栈，载入下一任务栈恢复；切 PSP。\n工程：切换在 PendSV 进行；切换耗时直接进任务响应预算；测切换时间定调度频率上限。\n坑：切换漏存浮点(FPU 任务)状态串味；栈不够压栈溢出踩数据。\n记忆：上下文切换 = “把当前进度存盘，载入下一个”。'],
  ['rtos','任务栈应该开多大？怎么测高水位？','要点：按函数调用深度+局部变量+中断嵌套估计；RTOS 提供 uxTaskGetStackHighWaterMark 看最小剩余。\n工程：量产后按高水位留 30% 余量；递归/大局部数组是溢出主因。\n坑：拍脑袋定栈，峰值时溢出踩堆/别任务；减小栈“够用”忽略中断嵌套。\n记忆：栈大小 = “实测峰值 + 余量”。'],
  ['rtos','什么是空闲任务(idle)与钩子？','要点：最低优先级任务，系统无事可做时跑；可做低功耗(WFI)、统计 CPU 占用、跑后台轻活。\n工程：空闲钩子放省电；用其运行时间反推 CPU 负载。\n坑：在 idle 钩子做阻塞调用(它不能阻塞)致断言；耗时活拖低功耗。\n记忆：idle = “没活干时兜底”，常用作“电表”。'],
  ['rtos','优先级反转与优先级继承/天花板？','要点：低优任务持锁被中优抢占、高优等锁→高优被中优间接阻塞(反转)；继承(持锁时临时升到等锁最高优)与天花板(锁定即升到固定上限)缓解。\n工程：FreeRTOS mutex 带优先级继承；AUTOSAR/OSEK 用优先级天花板；两者都要正确配上限。\n坑：用二值信号量当锁无继承，反转照旧；天花板上限配低仍可能反转。\n记忆：反转 = “高优被低优拖后腿”，继承/天花板抬腿。'],
  ['rtos','信号量 vs 互斥锁 vs 事件标志 vs 消息队列？','要点：互斥锁有所有权/优先级继承用于护资源；信号量做同步/计数(生产者消费者)；事件标志多事件组合触发；队列传数据。\n工程：保护共享用 mutex 非信号量；跨任务送数用 queue；等“任一/全部”事件用 event group。\n坑：中断里用阻塞 mutex 崩；用信号量护资源无继承致反转；队列满发送阻塞。\n记忆：护资源用 mutex，同步用 sem/event，传数用 queue。'],
  ['rtos','中断里能调哪些 RTOS API？','要点：只能调 “FromISR” 后缀版本(如 xQueueSendFromISR)，且不能阻塞；它们可能触发上下文切换需 `xHigherPriorityTaskWoken`。\n工程：中断里入队/给信号量唤醒任务，出中断后(pending PendSV)切任务。\n坑：中断里调非 FromISR 版本(含阻塞)致未定义；忘处理 HigherPriorityWoken 切换延迟。\n记忆：中断 API 都带 FromISR 且不阻塞。'],
  ['rtos','tickless idle(无节拍睡眠)是什么？','要点：空闲较长时关周期节拍，用低功耗定时器算下次唤醒，省去频繁 SysTick 中断省电。\n工程：电池设备靠它大幅降耗；唤醒后补计时间，延时 API 仍准。\n坑：低功耗定时器精度不够致时间漂移；外部事件唤醒未配致睡死。\n记忆：tickless = “长空闲就不敲秒表，睡更香”。'],
  ['rtos','时间片(round-robin)调度？','要点：同优先级多任务按时间片轮转；不同优先级仍抢占优先。\n工程：同优任务均分 CPU；实时任务应设不同优先级而非靠时间片。\n坑：时间片太短切换开销大；误用时间片替代优先级导致实时性模糊。\n记忆：时间片 = “同级别轮流坐庄”。'],
  ['rtos','怎么用 RTOS 做软实时保证？','要点：按死线设优先级/周期，留 CPU 余量，关无关中断，量化最坏响应；必要时用 RMS/EDF 分析。\n工程：控制环设高优周期任务；关键响应最坏时延要小于死线并留余量。\n坑：只测平均响应忽略最坏；低优长任务阻塞高优。\n记忆：软实时 = “绝大多数时候准时”。'],
  ['rtos','静态 vs 动态任务/队列创建？','要点：静态用用户给的内存(确定、无碎片)适合安全；动态用堆(灵活但有碎片/失败风险)。\n工程：安全/确定系统偏好静态分配；省去 heap_4/5 配置。\n坑：动态分配失败未判空崩；长期运行碎片。\n记忆：静态 = 预算定好，动态 = 用时申请。'],
  ['rtos','调度锁与临界区区别？','要点：调度锁只禁任务切换(中断仍跑)，临界区常连中断也禁；前者更短更轻。\n工程：只护任务间竞争用调度锁；涉中断用临界区/FromISR。\n坑：调度锁里调阻塞 API 未定义；误用临界区包长代码饿中断。\n记忆：调度锁挡任务，临界区挡一切。'],
  ['rtos','什么是“任务通知(task notification)”？','要点：FreeRTOS 每个任务内建一个轻量“通知”，替代队列/信号量做单对单同步，更快省内存。\n工程：简单同步/事件用通知替代单独建信号量；一对一场景利器。\n坑：只能一对一，多对一需队列；别当通用 IPC 滥用。\n记忆：任务通知 = “内建轻量信号量”。'],
  ['rtos','看门狗在 RTOS 里怎么喂才有效？','要点：独立看门狗任务定时喂；或让多个关键任务“各自喂”，任一卡死都不喂→复位。\n工程：多任务各置标志，监护任务汇总喂；比单任务喂能检出“某任务卡”。\n坑：单任务喂掩盖了别的任务死；中断喂掩盖任务死。\n记忆：喂狗要反映“大家都活着”。'],
  ['rtos','死锁在 RTOS 怎么产生与避免？','要点：两任务各持锁等对方锁(循环等待)死锁；按固定顺序取锁、用超时、用优先级天花板避免。\n工程：统一“锁顺序”编码规范；取锁带超时防永久等；少用多锁。\n坑：嵌套取锁顺序不一致必偶发死锁；死锁后系统假死难复现。\n记忆：死锁 = “互相等对方手里的钥匙”。'],
  ['rtos','消息队列阻塞发送/接收的坑？','要点：队列满发送阻塞、空接收阻塞；中断必须用 FromISR 且不能阻塞。\n工程：控制流用队列解耦生产消费；设合理长度与超时。\n坑：中断里阻塞发送崩；队列长度不够高频丢数据；接收不设超时致任务卡。\n记忆：队列 = “线程安全的邮筒”，满/空会等。'],
  ['rtos','RTOS 的 tick 精度与定时器精度？','要点：系统节拍(如 1ms)决定延时粒度；软件定时器基于 tick，精度受节拍限制；硬件定时器更准。\n工程：亚毫秒控制用硬件定时器而非 vTaskDelay；长延时用软件定时器。\n坑：用 1ms tick 做 100us 控制精度不够；节拍中断占 CPU。\n记忆：tick 是“粗秒表”，精确定时用硬件。'],
  ['rtos','多核 RTOS(SMP)与单核区别？','要点：SMP 多核跑同一 OS，任务可迁核，需自旋锁/原子保护共享；AMP 每核独立 OS 各管一段。\n工程：M7+M4 常 AMP；同构多核用 SMP；核间通信用共享内存+屏障。\n坑：SMP 共享内核数据无锁崩；任务迁移致缓存冷；AMP 资源争用。\n记忆：SMP 共享 OS 要锁，AMP 各管各。'],
  ['rtos','怎么定位 RTOS 下的“卡死/跑飞”？','要点：HardFault 解析器看栈帧 PC；用 trace/ITM 打任务切换；看门狗复位后读黑匣子记录最后任务。\n工程：预留“最后运行任务/函数”记录；断言失败打现场。\n坑：没留现场复位即清，查无对因；优化后 PC 难对应源码。\n记忆：跑飞要有“黑匣子”。'],
  ['rtos','为什么 RTOS 任务不能 return？','要点：任务函数返回后没有“下一句”，会跑飞；应死循环或删自己(`vTaskDelete`)。\n工程：任务体为 `for(;;){...}`；结束用删除或挂起。\n坑：函数体执行完 return 进 HardFault；误以为会自动退出。\n记忆：任务 = 不返回的循环。'],
  ['rtos','中断延迟与任务响应延迟分别怎么算？','要点：中断延迟=外部边沿到 ISR 首条指令(受当前指令/高优中断)；任务响应=中断到目标任务运行(再加 PendSV 切换)。\n工程：实时性预算要分别算；关中断/临界区时长直接进最坏响应。\n坑：只测中断延迟忽略任务切换时间；临界区过长拖响应。\n记忆：响应 = 中断延迟 + 切换 + 调度。'],
  ['rtos','FreeRTOS/RT-Thread/Zephyr 差异？','要点：FreeRTOS 轻量主流、生态广；RT-Thread 组件全(文件系统/网络)偏国产；Zephyr 器件树驱动模型现代、适合异构。\n工程：小控制用 FreeRTOS；要丰富中间件选 RT-Thread；新平台/异构选 Zephyr。\n坑：把某 OS 特有 API 当通用答；低估移植中间件成本。\n记忆：轻量 FreeRTOS，全栈 RT-Thread，现代 Zephyr。'],
  ['rtos','什么是“可剥夺/不可剥夺”内核？','要点：可剥夺(抢占)内核高优可打断低优；不可剥夺须等其主动让出(协作)。\n工程：硬实时用可剥夺+优先级；简单协作系统无抢占更可预测但响应差。\n坑：协作系统长任务饿死其它；抢占系统优先级配错致颠簸。\n记忆：剥夺 = 急事插队。'],
  ['rtos','软件定时器(software timer)的优缺点？','要点：基于 tick 在定时器任务里回调，省硬件定时器；但精度受 tick、回调在任务上下文(可阻塞)。\n工程：非精确周期用软件定时器；精确/高速用硬件定时器。\n坑：定时器回调里阻塞拖整个定时器任务；精度受 tick 限。\n记忆：软件定时器 = “借用节拍的闹钟”。'],
  ['rtos','任务间共享变量为什么不能直接裸用？','要点：读写可能被中断/切换打断致不完全更新，多核还涉缓存；需 mutex/原子/临界区。\n工程：简单标志用 task notification/原子；结构体用 mutex 护。\n坑：以为“一句赋值”原子，实际 32 位非对齐/多核不是；偶发错。\n记忆：共享 = 要保护，别裸用。'],
  ['rtos','怎么给 RTOS 做确定性测试？','要点：注入负载测最坏响应、用 trace 抓调度时序、压力跑看是否偶发超死线。\n工程：CI 跑调度压力；关键路径埋点量化 WCET。\n坑：只跑正常负载放行，峰值才暴露。\n记忆：确定性靠“最坏情况”验证，不是平均。'],
  ['rtos','RTOS 启动顺序？','要点：复位→C 初始化→OS 初始化(建 idle/定时器任务)→建应用任务→`vTaskStartScheduler` 切第一个任务。\n工程：启动前配置 tick 源与堆；调度器启动后不再返回 main。\n坑：调度器启动前调了需调度的 API 崩；堆没配足建任务失败。\n记忆：启动 = 初始化 OS→建任务→开调度。'],
  ['autosar','AUTOSAR 分层架构(CP)是什么？','要点：自上而下：应用层(SWC)→RTE→BSW(服务层/ECU 抽象/MCAL)→微控制器；各层接口标准化解耦。\n工程：应用只认 RTE 接口，换 MCU/总线只改下层；CP 用于经典嵌入式 ECU。\n坑：把应用直接揉 MCAL 破坏分层；误用 CP 模型做高性能计算。\n记忆：AUTOSAR = “应用-中间层-硬件”三层解耦。'],
  ['autosar','RTE 是干嘛的、怎么生成？','要点：RTE 是应用与 BSW 的唯一接口，把 SWC 的端口(数据/操作/事件)映射成调用/队列；由工具据 ARXML 自动生成。\n工程：应用开发者只写 SWC 接口，RTE 生成连接；改接口重生成 RTE。\n坑：手写改 RTE 与工具生成冲突；端口类型(S/R vs C/S)配错编译不过。\n记忆：RTE = “自动生成的胶水层”。'],
  ['autosar','SWC 与应用软件组件模型？','要点：SWC 是原子/组合组件，含 Runnable(被事件触发执行)、端口(Port：数据 S/R、操作 C/S)、内部行为。\n工程：一个 SWC 可含多个 Runnable，由 RTE 按周期/数据/操作事件调度。\n坑：Runnable 里做阻塞/长循环破坏调度；跨 SWC 数据不通过端口直接访问。\n记忆：SWC = “带接口和runnable的应用积木”。'],
  ['autosar','MCAL 是什么、含哪些驱动？','要点：微控制器抽象层，直接操作芯片外设的驱动集合：MCU/DIO/PORT/ADC/PWM/SPI/ICU/WDG/CAN/FLS/GPT 等。\n工程：MCAL 由芯片厂提供，应用经 ECU 抽象层访问；移植主要在 MCAL+OS。\n坑：直接调 MCAL 绕过上层破坏可移植；不同厂 MCAL 配置工具差异大。\n记忆：MCAL = “芯片外设的标准驱动”。'],
  ['autosar','PORT/DIO 模块职责？','要点：PORT 配置引脚复用/方向/上下拉(静态)；DIO 提供读写引脚电平的 API。\n工程：引脚规划在 PORT 统一配；应用读写在 DIO；AUTOSAR 下不直操寄存器。\n坑：PORT 未使能复用致外设无信号；DIO 读未配置输入脚得不确定。\n记忆：PORT 配角色，DIO 干读写。'],
  ['autosar','ADC 模块怎么用、与裸机区别？','要点：配 ADC 组(Group)与通道、触发源(软件/硬件定时器)、转换完通知；结果经 RTE 给应用。\n工程：多通道周期扫描建 Group；硬件触发同步控制环；结果用通知而非轮询。\n坑：Group 触发源配错不转换；通知里做重活拖实时。\n记忆：AUTOSAR ADC = “组+触发+通知”模型。'],
  ['autosar','PWM/ICU 模块？','要点：PWM 输出可调占空比/频率的波形(电机/灯)；ICU 捕获外部边沿测周期/占空比。\n工程：电机控制用 PWM 互补+死区；转速采集用 ICU；参数经配置工具定。\n坑：死区配错上下管直通；ICU 边沿选错测得互补量。\n记忆：PWM 出波，ICU 收波测。'],
  ['autosar','CAN 模块与 COM/PduR 关系？','要点：CAN 驱动收发包到上层；COM 做信号层(打包/拆包/字节序/缩放)；PduR 路由 PDU 到协议/接口。\n工程：应用经 COM 收发“信号”(带因子偏移)；CANIF/CANTP 在中间；跨总线靠 PduR 路由。\n坑：信号因子/字节序配错数据全错；PduR 路由漏导致信号到不了。\n记忆：CAN 驱→COM 信号→PduR 路由三层。'],
  ['autosar','NVM(NVRAM)管理怎么用？','要点：管理 EEPROM/Flash 模拟的持久数据，提供块(Block)读写、写周期、掉电保护、默认值。\n工程：标定/学习值存 NVM；用 NvM_WriteBlock 异步写，配磨损均衡。\n坑：频繁写同一块超寿命；同步写阻塞任务；掉电恰在擦写损坏。\n记忆：NVM = “持久数据的标准管家”。'],
  ['autosar','DCM/DEM 诊断模块？','要点：DCM 处理 UDS 诊断会话/服务(读 DID、清 DTC、例程)；DEM 管 DTC 存储/状态/老化/使能条件。\n工程：应用上报故障事件给 DEM，DCM 应 UDS 请求读；故障与快照绑定。\n坑：DEM 事件配错使能条件导致误报/漏报；DTC 状态位维护错。\n记忆：DCM 接诊断请求，DEM 存故障。'],
  ['autosar','EcuM 与 BswM 状态管理？','要点：EcuM 管 ECU 启动/休眠/下电大状态机；BswM 据模式仲裁(如通信开/关、限速)切 BSW 行为。\n工程：上下电流程由 EcuM 驱动；BswM 规则表达“某模式→某动作”。\n坑：模式仲裁规则漏导致外设未初始化；下电流程没保关键数据。\n记忆：EcuM 管生死，BswM 管模式切换。'],
  ['autosar','WdgM 看门狗管理？','要点：监控多个被管实体(SE)是否按时“喂”(Alive/逻辑/截止时间)，超则触发看门狗或安全反应。\n工程：每个任务/Runnable 向 WdgM 报活；WdgM 统一喂硬件狗，检出“某实体卡”。\n坑：SE 周期配错频繁误报；未接安全反应(如降级)仅靠复位。\n记忆：WdgM = “看门狗的管家，管谁活着”。'],
  ['autosar','OS(CP)任务/事件/报警器？','要点：AUTOSAR OS 任务分基本(BCC1/2 不挂起)与扩展(ECC1/2 可等待事件)；用 Alarm 周期触发、Event 同步。\n工程：周期控制用 Alarm 激活任务；任务间用 Event 等待；优先级静态配置。\n坑：基本类任务不能等事件/挂起；Alarm 周期与任务执行时间算错超死线。\n记忆：AUTOSAR OS = “静态优先级+Alarm/Event”。'],
  ['autosar','AUTOSAR 的 CP 与 AP 区别？','要点：CP(经典)用于深嵌入式 MCU，静态配置、确定性强；AP(自适应)用于高性能 SoC，POSIX/Linux、服务导向、动态。\n工程：车身/BMS 用 CP；智驾/域控用 AP；二者用 SOME/IP 通信。\n坑：把 CP 思维套 AP(如静态配置)不适用；混用通信模型错。\n记忆：CP 深嵌确定，AP 高性能动态。'],
  ['autosar','什么是 ARXML、为什么重要？','要点：AUTOSAR 的 XML 描述格式，承载所有配置/接口/拓扑；工具链据此生成 RTE/BSW 代码。\n工程：配置从 ARXML 来，改接口/参数改 ARXML 重生成；是“单一事实源”。\n坑：手动改生成代码被重生成覆盖；多版 ARXML 不一致。\n记忆：ARXML = “AUTOSAR 的蓝图文件”。'],
  ['autosar','接口类型 S/R 与 C/S 区别？','要点：Sender/Receiver 传数据(信号)，可一对多；Client/Server 是调用(请求-响应)，C 调 S 执行。\n工程：周期数据用 S/R；按需动作(如“执行标定”)用 C/S。\n坑：把 C/S 当周期数据用错模型；S/R 大数组广播拖带宽。\n记忆：S/R 送数据，C/S 调函数。'],
  ['autosar','COM 模块的字节序/因子偏移(缩放)？','要点：信号在总线上按约定字节序(Intel/Motorola)排，物理值=原始值*因子+偏移；COM 自动转。\n工程：DBC/ARXML 配好因子偏移，应用用物理值；跨厂对接要一致。\n坑：因子偏移配反物理值错；字节序(Motorola MSB)理解错解析乱。\n记忆：COM = “原始位↔物理值的翻译官”。'],
  ['autosar','模式管理(模式切换)怎么用？','要点：系统/通信/应用模式(如 Normal→Sleep)，BswM 据规则切换并通知应用做相应动作。\n工程：进 Sleep 模式关外设/喂狗策略变；应用订阅模式变化响应。\n坑：模式切换漏关关键外设致漏电；应用未响应模式变更行为不一致。\n记忆：模式 = “系统状态机的可见面”。'],
  ['autosar','IOC(跨核通信)是干嘛的？','要点：多核(分区)间通过 IOC 标准化传数据/事件，替代裸共享内存，保安全隔离。\n工程：MPU/TrustZone 分区下，核间通信用 IOC；配端口经 RTE。\n坑：用裸共享内存绕过 IOC 破坏隔离与安全论证。\n记忆：IOC = “核间的 RTE”。'],
  ['autosar','标定(Calibration)与 XCP/onXCP？','要点：XCP(原 CCP)协议经 CAN/ETH 在线读改标定变量；AUTOSAR 用 Xcp 模块接测量标定系统。\n工程：台架调 PID/阈值经 XCP 实时改 NVM 中的标定块；不改代码。\n坑：标定块没放可写区(Flash)无法在线改；标定值未存 NVM 复位丢失。\n记忆：XCP = “在线调参通道”。'],
  ['autosar','AUTOSAR 为什么对功能安全有利？','要点：标准化分层+看门狗管理(WdgM)+E2E 保护+确定性调度，便于做 ISO 26262 论证与复用。\n工程：用 E2E(端到端保护)保跨 ECU 信号完整；WdgM 监活。\n坑：以为用 AUTOSAR 自动安全，仍需按 ASIL 配与论证。\n记忆：AUTOSAR 提供“安全可论证的基础设施”。'],
  ['autosar','BSW 调度与 MainFunction？','要点：许多 BSW 模块有周期 `MainFunction` 由任务周期调用(如 Com_MainFunction、NvM)，非中断驱动。\n工程：把各 MainFunction 放进合适周期任务；周期配错致通信/存储滞后。\n坑：漏调某 MainFunction 该模块不工作；调用周期太慢通信超时。\n记忆：BSW = “靠 MainFunction 被周期叫醒”。'],
  ['autosar','DET(默认错误跟踪)是什么？','要点：开发期错误钩子，BSW 校验失败调 Det_ReportError，便于抓配置/调用错。\n工程：开发阶段开 DET 抓 API 误用；量产前关或转适配安全反应。\n坑：量产前留 DET 卡死；忽略 DET 报告掩盖配置错。\n记忆：DET = “开发期的报错广播”。'],
  ['autosar','多核(多分区)下 OS 怎么分？','要点：每核跑各自 OS 实例(或分区)，核间经 IOC；资源/外设按核划分或由主核代理。\n工程：M4 跑控制核、M7 跑通信核；协作经 IOC+共享内存。\n坑：外设被两核争用冲突；核间同步无屏障错。\n记忆：多核 = “各核 OS + IOC 协作”。'],
  ['autosar','什么是“可执行(Executable)与任务映射”？','要点：SWC 的 Runnable 映射到 OS 任务；多个 Runnable 可同任务(共享栈/不可并行)或分任务。\n工程：按实时性/耦合把 Runnable 分任务；同任务 Runnable 不必互斥。\n坑：把互斥需求 Runnable 放同任务反而串行慢；分太多任务栈耗尽。\n记忆：Runnable→Task 映射决定并行与实时。'],
  ['autosar','AUTOSAR 工具链(向量/DaVinci/ETAS)作用？','要点：配置工具编辑 ARXML、生成 RTE/BSW/OS 代码；是 AUTOSAR 开发必需(手写不现实)。\n工程：熟悉一种工具链即可迁移；配置质量决定生成代码正确。\n坑：手动改生成代码被覆盖；工具版与基础软件版不匹配。\n记忆：工具链 = “把蓝图变代码”。'],
  ['autosar','诊断事件与 DTC 状态位？','要点：DTC 有状态字节(测试失败/确认/老化/ Pending 等)，DEM 按事件条件更新；UDS 读之。\n工程：故障需“确认条件(如持续 N 个运行循环)”才置 confirmed；老化降误报。\n坑：确认阈值配太低误报；没配老化致历史故障久不清。\n记忆：DTC 状态 = “故障的履历章”。'],
  ['bms','BMS 的核心功能有哪些？','要点：采电压/温度/电流、估算 SOC/SOH/SOP、均衡、高压安全(绝缘/HVIL/预充)、充放电控制、通信(CAN)、故障诊断。\n工程：车规 BMS 还要满足功能安全(ASIL C/D)与强标(GB 38031)；分层主控+从控。\n坑：只做采压不做安全，过充热失控；低估均衡与热管理。\n记忆：BMS = “电池保姆+保镖”。'],
  ['bms','单体/模组/包的电压电流怎么采？','要点：从控(AFE)采每节电压(Σ-Δ ADC，精度 mV 级)、NTC 测温度；分流器/霍尔测总电流。\n工程：电压采样高阻抗防耗电；电流用霍尔(隔离)或分流(精度高但耗电)；多路同步采样。\n坑：采样不同步致 SOC 计算误差；NTC 位置不代表最热节。\n记忆：电压靠 AFE，电流靠分流/霍尔。'],
  ['bms','什么是被动均衡与主动均衡、怎么选？','要点：被动=电阻耗散多余电量(简单便宜、能量浪费)；主动=电容/电感/变压器把电从高节搬到低节(高效、复杂贵)。\n工程：小容量/成本敏用被动；大容量/长寿命用主动；按不一致性与成本权衡。\n坑：被动均衡电流太小(几十 mA)对大不一致无效；主动均衡拓扑控制复杂易坏。\n记忆：被动=耗，主动=搬。'],
  ['bms','SOC 估算有哪些方法、优劣？','要点：安时积分(简单但漂)、OCV-SOC 查表(需静置)、模型法(EKF/UKF 融合电流电压，准但吃算力)、神经网络(数据驱动)。\n工程：量产常用“安时积分+OCV 修正+温度补偿+模型滤波”组合；定期校准。\n坑：只安时积分长期漂；OCV 在动态行车不可用需静置。\n记忆：SOC = “积分打底+模型修正+定期校准”。'],
  ['bms','SOH 怎么估算？','要点：看容量衰减(满充可用容量 vs 初始)、内阻增长、ICA(dQ/dV)峰位漂移；综合得健康度%。\n工程：周期性满充校准容量；ICA 反映老化/析锂；SOH 驱动质保与功率限制。\n坑：容量只在满充才准，平时估不准；忽略温度对容量的影响。\n记忆：SOH = “容量掉多少+内阻涨多少”。'],
  ['bms','SOP/SOF(功率/能力)估算？','要点：SOP=当前最大充放电功率，受电压/电流/SOC/温度/老化限制；SOF 泛指可用能力。\n工程：整车能量管理据 SOP 限功率防过压/过流/过热；实时算最小约束。\n坑：只按电流限忽略电压近限导致过充触保；低温 SOP 骤降未提前限制。\n记忆：SOP = “此刻还能出多大劲”。'],
  ['bms','热管理为什么关键？','要点：锂电热失控有链式反应，温度均匀性与上限直接关系安全与寿命；需散热/加热/均温。\n工程：液冷/风冷控温；低温加热提升倍率；温差大加速不一致。\n坑：只测平均温度漏掉最热节；不加热低温充电析锂。\n记忆：热 = “安全和寿命的开关”。'],
  ['bms','绝缘检测怎么做、标准？','要点：电桥法在正负母线对车身地加检测电阻测漏电流/电压算绝缘电阻；阈值 >500Ω/V(强标)。\n工程：上电前先测绝缘，不足断高压；潮湿/整车干扰要算法抗扰。\n坑：高压回路有大 Y 电容致测量慢/误；忽略整车分布参数误报。\n记忆：绝缘 = “高压对车身的隔离度”。'],
  ['bms','HVIL(高压互锁)是什么？','要点：低压回路串在高压连接器里，连接器断开则低压断，BMS 立即断高压防触电。\n工程：维修/碰撞时 HVIL 断→安全断继电器；是高压安全硬保障。\n坑：HVIL 线被短接绕过失去保护；响应慢于断连致触电窗口。\n记忆：HVIL = “高压插头的应急绳”。'],
  ['bms','预充电路为什么需要？','要点：电容性负载(电机/充电机)上电瞬间冲击大，预充电阻限流 charging 后再闭合主继电器防粘连/打火。\n工程：先预充到母线电压 90%+ 再合主继；检测预充超时判故障。\n坑：预充电阻功率不够烧；没预充直接合继火花熔继电器。\n记忆：预充 = “先小口尝再大口喝”。'],
  ['bms','充电协议 GB/T 27930 流程？','要点：桩与 BMS 经 CAN 握手(BMS 辨识)→配置(电压电流)→充电参数(阶段性调)→充电中(实时校正)→结束；BMS 主导。\n工程：BMS 据电池状态给充电曲线；异常(过压/温)降流或停；兼容新旧桩。\n坑：握手阶段时序错桩不充；阶段切换电流跳变伤电池。\n记忆：GB/T 27930 = “桩听 BMS 的充电对话”。'],
  ['bms','BMS 的主从架构(主控+从控)？','要点：从控(每几节一组)采电压温度做均衡，主控汇总量算 SOC/安全/通信；经菊花链/_CAN/isoSPI 连。\n工程：主控强实时+安全，从控就近采；通信隔离抗扰。\n坑：菊花链一节断整链失联；主控算力不足算不过来。\n记忆：主从 = “手脚(从) + 大脑(主)”。'],
  ['bms','什么是电池不一致性、怎么来？','要点：电芯制造/老化/温度差异致容量内阻电压不一致；会放大(最差节决定整体)。\n工程：均衡缓解；分选配组降初始差；热管理降温度差。\n坑：只靠均衡不配组，均衡永远追不上；忽略自放电差异。\n记忆：不一致 = “木桶短板效应”。'],
  ['bms','过充/过放/过流/过温保护怎么实现？','要点：实时监电压/电流/温度，超阈值分级(告警→限功率→断继电器)；多级防单点失效。\n工程：硬件比较器做最后兜底(独立于 MCU)；软件做主判。\n坑：只软件保护 MCU 死则失效；阈值无滞回抖动频繁。\n记忆：保护 = “软硬双保险+分级”。'],
  ['bms','什么是继电器控制与粘连检测？','要点：高压回路由正/负主继电器通断；粘合检测(如预充前后压差)判断继电器是否焊死。\n工程：断高压前先确认无负载；粘连检测防“断不开”危险。\n坑：带载断继电器拉弧粘连；漏检粘连下次上电危险。\n记忆：继电器 = “高压总开关”，要能断开。'],
  ['bms','BMS 的 CAN 通信都发什么？','要点：上报总压/总流/SOC/温度/故障状态、接收充电机指令/整车请求；用自定义或国标帧。\n工程：报文周期与 DBC 定义一致；故障帧触发整车降功率。\n坑：报文周期错致整车看“旧值”；故障码不规范难诊断。\n记忆：BMS CAN = “电池对外汇报+听指挥”。'],
  ['bms','低温性能与加热策略？','要点：低温锂电热容降、内阻升、易析锂；需加热(液热/PTC)到适宜温再快充。\n工程：行车余热/充电加热；SOP 随温降；加热与充电协调。\n坑：低温强行快充析锂伤寿；加热功率不够充电慢。\n记忆：低温先暖身再快充。'],
  ['bms','BMS 怎么参与功能安全(ISO 26262)？','要点：BMS 涉高压安全常定 ASIL C/D；需安全机制(冗余采样/独立保护/诊断覆盖率)与 FMEA/FTA。\n工程：电压电流冗余测、过充硬件兜底、诊断覆盖率达标；安全概念文档化。\n坑：以为基本保护够，诊断覆盖率不达标通不过审核。\n记忆：BMS 安全 = “冗余+独立保护+论证”。'],
  ['bms','什么是“黑匣子/数据记录”？','要点：循环记录关键变量(电压/电流/温度/故障)到掉电保护区，事故后回读定位。\n工程：故障前窗口环形缓冲+重要事件快照；UDS 读或产线导出。\n坑：记录分辨率太低定位不到；没掉电保护断电即丢。\n记忆：黑匣子 = “电池的行车记录仪”。'],
  ['bms','BMS 标定都标什么？','要点：采样精度(增益/偏置)、SOC 曲线、均衡阈值、保护阈值、热模型参数；台架+实车标。\n工程：用 XCP 在线调；标完存 NVM；不同电芯型号重标。\n坑：采样偏置没标导致 SOC 整体漂；保护阈值照搬别型号不适用。\n记忆：标定 = “让模型贴合真实电池”。'],
  ['bms','什么是“电池包”与“电池系统”区别？','要点：包(Pack)=电芯+结构+热；系统=包+BMS+高压件+通信，是交付整车的功能单元。\n工程：BMS 是系统大脑；整车看系统接口；强标针对系统级。\n坑：只交付包不含 BMS 集成；忽略系统级安全强标。\n记忆：系统 = 包 + BMS + 高压集成。'],
  ['bms','BMS 的故障诊断与 DTC？','要点：监测采样/通信/均衡/绝缘/温度异常，按严重度置故障等级并上报；支持 UDS 读清。\n工程：分级(告警/降功率/断高压)；故障有确认条件防抖；快照辅助定位。\n坑：故障无确认条件频闪；严重故障没及时断高压。\n记忆：故障 = “分级响应+可诊断”。'],
  ['bms','为什么要“静置 SOC 校准”？','要点：行车中安时积分漂，静置时端压→OCV 对应 SOC 较准，是低成本高精度校正。\n工程：停车久置或满充时触发校准；结合温度补偿。\n坑：行车中强行 OCV 校准错；校准条件(电流近零)判断松。\n记忆：静置 = “让电池喘口气说真话”。'],
  ['bms','什么是梯次利用与回收？','要点：车载退役电池容量仍可用(储能/低速)，梯次利用；最终回收锂/钴/镍；BMS 数据助分级。\n工程：SOH 数据用于梯次分级；溯源利于回收。\n坑：梯次电池一致性差需重新配组；忽略历史热伤。\n记忆：梯次 = “退役不报废”。'],
  ['bms','BMS 的 MCU 选型关注什么？','要点：ADC 精度/路数、CAN/FlexRay、算力(SOC 模型)、功能安全等级、温度等级、隔离通信接口。\n工程：主控要高算力与多 CAN，从控重采样精度与均衡驱动。\n坑：算力不够 EKF 跑不过 1ms；CAN 路数不够扩展难。\n记忆：BMS MCU = “准采样+会算+能通信+够安全”。'],
  ['bmsadv','EKF(扩展卡尔曼)估 SOC 原理？','要点：用电池状态空间模型，预测→测电压残差→卡尔曼增益融合修正；处理非线性(雅可比)。\n工程：状态=[SOC, 内阻等]，输入电流，输出测电压；噪声协方差要调；实时跑。\n坑：模型不准增益错估偏；协方差初值敏感需整定；算力不够周期超。\n记忆：EKF = “用模型预测+实测纠偏”。'],
  ['bmsadv','UKF 与 EKF 区别、何时用？','要点：UKF 用无迹变换采样点逼近非线性，比 EKF 线性化更准(尤其强非线性)，但算力更高。\n工程：强非线性(大电流/宽温)用 UKF 提精度；算力够才上。\n坑：UKF 参数(α/β/κ)配错发散；算力不足无法实时。\n记忆：UKF = “不线性化、直接采样逼近”。'],
  ['bmsadv','等效电路模型(Rint/Thevenin/DP)怎么选？','要点：Rint 一阶(简单)、Thevenin 加极化 RC(常用)、DP 多 RC(更准更复杂)；阶数越高越准越难辩。\n工程：实时 SOC 用 Thevenin；SOH/动态用 DP；参数在线辨识跟踪老化。\n坑：模型过简动态误差大；过复杂参数辩不准反而不准。\n记忆：模型阶数 = 精度vs算力权衡。'],
  ['bmsadv','参数在线辨识怎么做？','要点：用 RL S 激励+递推最小二乘(RLS)/遗忘因子实时估内阻/容量/极化参数。\n工程：行车中持续辩，跟踪老化与温变；遗忘因子防旧数据权重过大。\n坑：激励不足(电流平)辩不出；RLS 协方差爆炸需限幅。\n记忆：在线辩 = “边用边学电池脾气”。'],
  ['bmsadv','ICA(dQ/dV)怎么用于 SOH/析锂？','要点：对电压做微分得峰位，峰随老化/析锂漂移；比对健康样本判 SOH 与析锂预警。\n工程：慢充小电流下算 ICA 稳；峰偏移量化老化；析锂峰异常报警。\n坑：电流大噪声大 ICA 失真；温变未补偿峰移误判。\n记忆：ICA = “电池的指纹图谱”。'],
  ['bmsadv','主动均衡拓扑(电容/电感/flyback)对比？','要点：电容式简单低速、电感式效率中速、变压器(flyback)隔离可跨节效率高但复杂；按功率/成本选。\n工程：大容量用变压器隔离均衡；小系统用电容够；控制策略定均衡启停。\n坑：均衡控制不当反复横跳耗能；隔离变压器漏感致效率降。\n记忆：主动均衡 = “选搬运工(电容/电感/变压器)”。'],
  ['bmsadv','热失控触发链与阻断？','要点：内短路→温升→SEI 分解→产气喷阀→链式；阻断靠隔热(气凝胶/云母)、泄压、及时断高压、温升率判。\n工程：单体温升率+压差联合判早期；阻隔防蔓延；GB 38031 强标。\n坑：只监测温度滞后(已到热失控)；没阻隔致整包。\n记忆：热失控 = “早识别+早隔离+早断电”。'],
  ['bmsadv','绝缘检测电桥法细节与抗扰？','要点：正负母线对车身加已知电阻网络，测分压算绝缘电阻；Y 电容致暂态，用切换/延时或交流法抗扰。\n工程：上电前测；整车大 Y 电容需算法稳定；阈值分级告警。\n坑：忽略 Y 电容测值漂移误报；潮湿整车分布参数未建模。\n记忆：绝缘测 = “加已知桥，解未知阻”。'],
  ['bmsadv','SOP 的约束最小集怎么算？','要点：取电压上限(不过充)、电压下限(不过放)、电流上限(不过流)、SOC 边界、温度边界、功率器件限中“最紧”的那个。\n工程：实时算各约束对应功率取最小；留安全余量；随温/老化变。\n坑：漏电压约束只看电流，近满充过压；余量不足偶发超。\n记忆：SOP = “所有上限里最紧的那个”。'],
  ['bmsadv','BMS 的 AFE(模拟前端)选型？','要点：LTC681x/MC3377x 等专用 IC 采数十节电压+温度，精度高、带均衡驱动、隔离通信(isoSPI/DSI3)。\n工程：级联菊花链；隔离防高压窜入 MCU；校验防通信错。\n坑：隔离器件 CMTI 不够高压侧干扰；菊花链终端电阻漏致反射。\n记忆：AFE = “多节电池的专用采集芯”。'],
  ['bmsadv','主动均衡的“均衡策略”怎么定？','要点：按单节与平均/最低的电压差或容量差触发；设定阈值与迟滞、限流、定时；避免抖动。\n工程：充电末/静置做均衡最有效；阈值随温/老化调；防过均衡。\n坑：阈值太低均衡不停耗能；只在行车均衡效率低。\n记忆：均衡策略 = “差多少、何时、到哪”。'],
  ['bmsadv','BMS 冗余采样(功能安全)怎么做？','要点：关键量(总压/总流/绝缘)双路独立采样比对，不一致报警；硬件比较器做独立于 MCU 的兜底保护。\n工程：双 MCU 或双 ADC 通道；比较结果进安全状态机；提诊断覆盖率。\n坑：冗余同失效源(同一电源)无真正冗余；比对阈值无滞回抖。\n记忆：冗余 = “两份独立+比对+兜底”。'],
  ['bmsadv','充电机与 BMS 的“阶段切换”细节？','要点：握手→配置(最大电压电流)→充电(分段调流，恒流→恒压)→结束；每阶段需双方确认超时处理。\n工程：CV 段电流自然降防过充；异常降流/停；兼容桩差异。\n坑：阶段切换电流跳变；超时未处理卡死。\n记忆：充电 = “恒流充，快满转恒压”。'],
  ['bmsadv','什么是电池“内短路”检测？','要点：微小内短路致自放电/微温升，难测；用压差一致性、自放电率、微温监测早期识别。\n工程：静置压差趋势+自放电统计；结合 ICA；早期预警防热失控。\n坑：小内短与正常不一致难分；等温升明显已晚。\n记忆：内短 = “慢漏气的轮胎”，靠趋势抓。'],
  ['bmsadv','BMS 软件架构(分层)？','要点：驱动层(AFE/CAN)→算法层(SOC/SOH/SOP)→应用层(保护/均衡/通信)→诊断；实时与功能安全分区。\n工程：算法高频任务高优；保护独立快速通道；诊断经 UDS。\n坑：算法与保护耦合致保护慢；安全相关走慢通道。\n记忆：BMS 软件 = “采→算→判→保→报”分层。'],
  ['bmsadv','什么是“电池数字孪生”？','要点：用模型实时镜像电池状态(电/热/老化)，用于预测维护、优化充放、梯次评估。\n工程：云端/本地跑模型，结合历史与实时；支撑 SOH 预测与 RUL。\n坑：模型不准孪生失真；数据不全预测偏差大。\n记忆：数字孪生 = “电池在云端的影子”。'],
  ['bmsadv','RUL(剩余寿命)预测方法？','要点：基于容量衰减模型/循环计数/特征(内阻 ICA)外推；数据驱动(机器学习)需大量样本。\n工程：结合 SOH 与工况统计预测；给整车质保/换电提示。\n坑：工况剧变模型外推失准；样本少机器学习过拟合。\n记忆：RUL = “还能健康用多久”。'],
  ['bmsadv','BMS 与整车的能量管理协同？','要点：BMS 给 SOP/SOH，VCU 据以限功率；回收制动功率受 SOP 限；热管理联动。\n工程：整车策略读 BMS 约束动态调；低温协同加热。\n坑：VCU 不读 SOP 过功率触保；热管理各自为政。\n记忆：协同 = “BMS 设上限，整车守上限”。'],
  ['bmsadv','高压互锁(HVIL)与维修开关(MSD)？','要点：HVIL 断连即断高压；MSD(手动维修开关)拔掉物理断高压回路，便于安全维修。\n工程：维修前拔 MSD；HVIL 监测连接器；二者都是安全工程措施。\n坑：MSD 未拔就修触电；HVIL 短接绕过失效。\n记忆：MSD = “人工保险拔销”。'],
  ['bmsadv','BMS 的 EMC 设计注意？','要点：高压大电流与通信同舱，AFE 采样线差分屏蔽、均衡电流环路小、CAN 终端/共模；软件 CRC 重传。\n工程：采样线双绞屏蔽单点地；均衡限流降干扰；通信隔离。\n坑：采样线不屏蔽被高压干扰漂；均衡环路大辐射超标。\n记忆：BMS EMC = “采样干净+均衡小环+通信隔离”。'],
  ['bmsadv','什么是 SOC 的“滞回/迟滞”处理？','要点：SOC 显示/动作加迟滞防在阈值附近频繁跳(如 20% 告警来回闪)；工程上常见。\n工程：告警/限功率阈值带迟滞；显示平滑防抖。\n坑：迟滞太大反应迟钝；太小仍抖。\n记忆：迟滞 = “别在边界反复横跳”。'],
  ['bmsadv','BMS 的产线/EOL 测试都测什么？','要点：采样精度、均衡功能、绝缘、通信、保护动作、标定参数；每台 EOL 测确保一致。\n工程：自动化台架测；不合格不下线；参数写 NVM/条码绑定。\n坑：EOL 漏测均衡致市场大批不一致；标定未绑定追溯难。\n记忆：EOL = “出厂前全身体检”。'],
  ['bmsadv','多包并联/串并联架构对 BMS 的影响？','要点：并联降内阻提容量但需均流；串并联管理复杂，采样与均衡按拓扑；不一致性在并联组更隐蔽。\n工程：模块化从控按物理拓扑；均流靠连接阻抗一致。\n坑：并联组内单节坏难定位；连接阻抗不均致不均流。\n记忆：拓扑决定 BMS 怎么采怎么均衡。'],
  ['bmsadv','BMS 的 OTA/标定升级？','要点：经 UDS/以太网 Bootloader 升级固件/标定；需签名校验防刷恶意固件、掉电保护防变砖。\n工程：A/B 备份分区升级；标定块独立可在线改；回滚机制。\n坑：升级中断电变砖；无签名校验被刷恶意。\n记忆：OTA = “安全升级+可回滚”。'],
  ['os','虚拟内存与 MMU 作用？','要点：给每进程独立地址空间，MMU 做 VA→PA 转换(页表)，隔离+按需调页+共享。\n工程：Linux 进程互不踩；嵌入式无 MMU(MCU)靠 MPU/静态分区；缺页由内核处理。\n坑：缺页频繁(抖动)性能崩；无 MMU 多进程隔离难。\n记忆：MMU = “地址翻译+隔离管家”。'],
  ['os','TLB 是什么、为什么快？','要点：转址旁路缓冲，缓存近期 VA→PA 映射，省每次查页表；切换进程需刷 TLB(或 ASID)。\n工程：TLB 命中纳秒级；上下文切换刷 TLB 有开销；大程序 TLB 未命中多。\n坑：切换进程不刷 TLB 读到别进程页；TLB 抖动(工作集大)慢。\n记忆：TLB = “地址翻译的缓存”。'],
  ['os','缺页中断(page fault)处理流程？','要点：访问未映射页→MMU 异常→内核查页表，合法则调页入内存建立映射，非法则段错误。\n工程：按需调页让程序用比物理内存大的空间；交换分区支撑。\n坑：内存不足频繁换页(抖动)；无效访问致崩溃(core dump)。\n记忆：缺页 = “要的页不在，去拿来”。'],
  ['os','进程间通信(IPC)有哪些？','要点：管道/消息队列/共享内存/信号量/信号/套接字/域套接字；各有速度与安全取舍。\n工程：大数据用共享内存(最快但需同步)；跨机用 socket；RTOS 用队列/事件。\n坑：共享内存无同步竞态；信号异步难处理资源释放。\n记忆：IPC = “进程间传话的方式”。'],
  ['os','线程同步原语对比？','要点：互斥锁(所有权/可重入)、读写锁(读共享写独)、条件变量(等条件)、信号量(计数同步)、自旋锁(忙等短临界)。\n工程：护短临界用自旋锁(多核)；长临界用 mutex；等条件用 condvar。\n坑：自旋锁持久占 CPU；condvar 需配 mutex 防丢唤醒。\n记忆：同步原语 = “按临界长度与场景选”。'],
  ['os','死锁必要条件与预防？','要点：四条件(互斥/占有且等待/不可剥夺/循环等待)同时成立才死锁；破坏任一即预防。\n工程：固定取锁顺序、超时、一次性申请、优先级天花板；数据库/OS 常用银行家算法避免。\n坑：只检测不预防仍会偶发；超时设太短误判。\n记忆：死锁 = “四条件齐备”，破一即解。'],
  ['os','银行家算法是什么？','要点：按“最大需求”判断是否分配后系统仍处安全态(存在完成序列)，是死锁避免(非检测)。\n工程：资源受限系统(如嵌入式)理论有用；实际因难知最大需求少用，多靠静态分析。\n坑：需预知最大需求不现实；开销大。\n记忆：银行家 = “借前先看还得起不”。'],
  ['os','调度算法大全(RMS/EDF/MLFQ/CFS)？','要点：RMS 静态按周期、EDF 动态按死线、MLFQ 多级反馈近似公平、CFS 红黑树公平(Linux)。\n工程：硬实时用 RMS/EDF；通用用 CFS/MLFQ；选算法看实时性需求。\n坑：RMS 假设独立任务，有资源阻塞不成立；EDF 抖动大需容限。\n记忆：调度 = “谁先跑”的策略集。'],
  ['os','什么是上下文切换开销？','要点：保存/恢复寄存器、刷 TLB/缓存、调度决策；频繁切换占 CPU 且破坏缓存局部性。\n工程：任务数多/切换频需量化开销；协程轻量切换省；实时系统算进预算。\n坑：任务过碎切换开销超计算；高估切换忽略缓存冷。\n记忆：切换 = “换人成本”。'],
  ['os','文件系统(VFS)层次？','要点：VFS 统一接口，下接具体 FS(FatFs/ext4)与块设备；缓冲(buffer)削峰、缓存(cache)加速读。\n工程：嵌入式用 FatFs(SD 卡)/LittleFS(Flash)；Linux 用 ext4；统一 open/read 接口。\n坑：突然掉电写未落盘损文件；Flash 直接挂 ext4 无磨损均衡易坏。\n记忆：VFS = “文件系统的统一门面”。'],
  ['os','inode 与目录项？','要点：inode 存文件元数据(权限/大小/块指针)不含名；目录项是名→inode 映射；硬链接共享 inode。\n工程：理解 ls/ln；删除是去目录项，引用为 0 才真释放。\n坑：硬链接跨文件系统不行；删大文件只删目录项释放滞后。\n记忆：inode = “文件的身份证”，目录项 = “名字贴”。'],
  ['os','什么是零拷贝(zero-copy)？','要点：数据不经用户态中转(如 sendfile 直接内核内页→网卡)，省拷贝与上下文切换，提吞吐。\n工程：高性能网络/日志用；嵌入式 DMA+描述符环同理。\n坑：以为 read+write 高效，实则多拷贝；小数据零拷贝收益小。\n记忆：零拷贝 = “数据不用来回倒手”。'],
  ['os','中断与异常的处理流程(通用)？','要点：硬件触发→保存现场→查向量表→执行 ISR→恢复现场返回；可能嵌套/抢占。\n工程：ISR 快进快出；重活任务做；RTOS 用 PendSV 切任务。\n坑：ISR 长阻塞；嵌套过深栈爆。\n记忆：中断 = “硬件敲门，内核接”。'],
  ['os','什么是“惊群”(thundering herd)？','要点：多等待者被同一事件同时唤醒，仅一个干活，其余白醒耗资源。\n工程：用条件变量单播/边缘触发(epoll ET)避免；accept 争用也惊群。\n坑：多进程 accept 同 socket 全醒；select 水平触发重复唤醒。\n记忆：惊群 = “一响铃全起床，只一人干活”。'],
  ['os','内存碎片(内部/外部)？','要点：内部=分配块内未用(对齐/管理开销)；外部=空闲不连续凑不出大块(长期 malloc/free)。\n工程：固件用静态分配避外部碎片；分配器用伙伴/SLAB 减碎片。\n坑：长期运行外部碎片致分配失败；频繁小对象内部碎片多。\n记忆：碎片 = “内存切成拼不回的碎”。'],
  ['os','用户态与内核态切换代价？','要点：特权级切换+上下文保存+可能的 TLB/缓存影响；系统调用频繁有开销。\n工程：批处理/零拷贝减切换；RTOS 多跑特权省切换(但要 MPU 隔离)。\n坑：高频小系统调用拖累；忽略切换进时延预算。\n记忆：态切换 = “进门登记的成本”。'],
  ['os','什么是协程(coroutine)？','要点：用户态轻量“线程”，主动 yield 切换，无内核开销，适合高并发 IO。\n工程：嵌入式可用协程简化状态机；比 RTOS 任务切换更轻。\n坑：协程间无抢占，某协程死循环饿死其它；不适硬实时。\n记忆：协程 = “自己让出 CPU 的轻线程”。'],
  ['os','缓冲区溢出与栈保护？','要点：写越界踩相邻内存/返回地址；保护用栈金丝雀(Canary)/NX/ASLR/地址校验。\n工程：固件开 -fstack-protector；关键系统防代码注入。\n坑：关了保护+有溢出被利用；Canary 被泄漏绕过。\n记忆：栈溢出 = “写超界踩塌楼”。'],
  ['os','什么是“实时性”与确定性？','要点：实时=在死线前完成(硬/软)；确定性=最坏情况可预测，非“平均快”。\n工程：硬实时用静态优先级+WCET 分析；软实时容忍偶发超。\n坑：把“平均延迟低”当实时；忽略最坏情况。\n记忆：实时 = “准时比快重要”。'],
  ['os','写时复制(Copy-on-Write)？','要点：fork 等先共享页面，任一方写才复制，省拷贝；经典优化。\n工程：进程创建快；嵌入式少用(多静态)。\n坑：大量写触发大量复制(写时反成负担)；安全上 COW 配只读页防改。\n记忆：COW = “不改不分家，改了才分”。'],
  ['os','什么是信号(signal)及可靠信号？','要点：软件中断通知进程(如 SIGSEGV)；早期不可靠(可能丢失)，POSIX 可靠信号(实时)排队。\n工程：嵌入式 Linux 用信号做退出/重载；异步处理要可重入。\n坑：信号处理里调非异步安全函数崩；默认行为(终止)未捕获。\n记忆：信号 = “内核拍你肩一下”。'],
  ['os','页表与多级页表？','要点：页表把 VA 分页映射到 PA；多级(如 2/3 级)省连续大表，ARM 用页表+TTBR。\n工程：嵌入式 MMU(Linux)用多级；上下文切换切 TTBR/ASID。\n坑：页表没刷致跨进程错；大地址空间二级表深。\n记忆：页表 = “地址翻译的目录”。'],
  ['os','自旋锁 vs 互斥锁(再深)？','要点：自旋锁忙等(不睡)适合多核极短临界，持锁禁抢占；互斥锁睡等适合长临界/单核。\n工程：多核共享数据短临界自旋；单核自旋无意义(占 CPU 且不可被抢)。\n坑：单核用自旋锁死循环；自旋锁里调阻塞 API 崩。\n记忆：自旋=转圈等(多核短临界)，互斥=去睡等(长临界)。'],
  ['os','什么是 RCU(读-复制-更新)？','要点：读侧无锁并发，更新侧复制新副本切换指针，旧副本等读者退出再回收；高读低写利器。\n工程：Linux 内核路由表/配置常用；嵌入式读多写少场景可借鉴思想。\n坑：写侧需等宽限期(GP)才能回收；不适用写频繁。\n记忆：RCU = “读者随便看，写者换副本”。'],
  ['os','I/O 模型：阻塞/非阻塞/IO多路/异步？','要点：阻塞等完成、非阻塞立即返、多路(select/epoll)等多路、异步(IOCP)完成后通知。\n工程：高并发服务用 epoll(ET)；嵌入式用事件循环；AIO 少。\n坑：阻塞模型每连接一线程资源爆；epoll LT 误用反复唤醒。\n记忆：I/O 模型 = “等多久、怎么等”。'],
  ['os','什么是“优先级天花板 vs 继承”深层？','要点：继承=持锁时升到等锁最高优先级(动态)；天花板=锁定即升到该锁固定上限(可静态分析、防反转+链式反转)。\n工程：安全关键多用天花板(确定)；普通用继承(灵活)；OSEK/AUTOSAR 用天花板。\n坑：天花板上限配低仍反转；继承有链式反转(多锁)风险。\n记忆：天花板确定，继承灵活但可能链反转。'],
  ['os','什么是地址空间布局随机化(ASLR)？','要点：每次加载随机化代码/库/栈地址，增攻击难度；配合 NX/PIE。\n工程：安全启动/联网设备开 ASLR；固件常因确定地址不开。\n坑：关 ASLR+有溢出易被利用；PIE 未编址随机无效。\n记忆：ASLR = “地址每次换地方”。'],
  ['os','什么是“可重入内核”与“可抢占内核”？','要点：可重入=内核代码可被自身中断安全重入；可抢占=高优可打断内核态低优。\n工程：SMP/实时内核需两者；单核非抢占简单但响应差。\n坑：非抢占内核长系统调用拖响应；可重入未保护共享崩。\n记忆：可重入=可再入，可抢占=可被插队。'],
  ['os','什么是 mmap 及其用途？','要点：把文件/设备/匿名内存映射到进程地址空间，直接读写；省拷贝，设备寄存器也用。\n工程：大文件处理/共享内存/IPC；嵌入式映射外设寄存器。\n坑：映射大文件占虚拟地址；写回时机(msync)忽略丢数据。\n记忆：mmap = “把东西直接挂进地址空间”。'],
  ['os','什么是“页缓存(page cache)”？','要点：内核缓存文件页，读命中免磁盘；写先缓存后回写；free 内存被其占(看似少用)。\n工程：顺序读提速；掉电未回写丢；嵌入式可用 Direct IO  bypass。\n坑：以为内存空实际被缓存；sync 不及时掉电损。\n记忆：页缓存 = “文件的内存副本”。'],
  ['os','什么是微内核与宏内核？','要点：宏(单体，如 Linux)功能在内核快但耦合；微(如 seL4)仅核心在外，服务在用户态，安全可验证但 IPC 多。\n工程：安全关键/认证用微内核(seL4 形式化验证)；通用用宏。\n坑：微内核 IPC 开销大；宏内核漏洞影响面大。\n记忆：微核小可信，宏核快但大。'],
  ['os','什么是“时间片轮转”的优缺点？','要点：公平分配 CPU 防饿死，但切换开销+缓存冷；实时靠优先级而非时间片。\n工程：同优先级任务均分；实时系统谨慎用。\n坑：时间片过短开销大；误当实时机制。\n记忆：时间片 = “轮流坐庄的公平”。'],
  ['os','什么是“僵尸进程/孤儿进程”？','要点：子进程退出父未 wait 成僵尸(占 PID/资源)；父先退子被 init 收养成孤儿。\n工程：父进程正确处理 SIGCHLD/wait；否则僵尸堆积。\n坑：忘了 wait 僵尸堆积致 PID 耗尽；忽略回收。\n记忆：僵尸=父不收尸，孤儿=父先走被收养。'],
  ['os','什么是“软中断(softirq)/tasklet”？','要点：Linux 下半部机制，软中断可并发于多核、tasklet 同类型串行；延后重活出硬中断。\n工程：网络收包走软中断；嵌入式 RTOS 用底半/任务替代。\n坑：软中断占 CPU 久似饿死；tasklet 长占仍拖。\n记忆：软中断 = “下半部的轻量执行”。'],
  ['safety','ISO 26262 是什么、适用范围？','要点：道路车辆功能安全标准，覆盖电子电气系统全生命周期(概念→退役)，定 ASIL A~D。\n工程：车规 ECU 必走；概念阶段做 HARA 定 ASIL；软硬件设计对应安全机制。\n坑：以为“用了 AUTOSAR 就安全”；忽略全生命周期文档。\n记忆：ISO 26262 = “汽车电子的安全法”。'],
  ['safety','ASIL A/B/C/D 区别？','要点：按严重度(S)/暴露概率(E)/可控性(C)定，A 最轻 D 最严；D 要求最高诊断覆盖率与冗余。\n工程：BMS 高压相关常 C/D；车身舒适常 A/B；不同 ASIL 开发成本差大。\n坑：ASIL 定低致安全不足；定高致成本浪费。\n记忆：ASIL = “出事多严重”分四档。'],
  ['safety','HARA(危害分析与风险评估)？','要点：识别功能危害→定严重度/暴露/可控性→定 ASIL 与安全目标(如“避免非预期加速”)。\n工程：概念阶段输出安全目标与 ASIL；是后续设计输入。\n坑：危害场景漏列致目标不全；可控性高估定低 ASIL。\n记忆：HARA = “找危险→打分→定等级”。'],
  ['safety','什么是安全目标与安全状态？','要点：安全目标是最高层安全需求(避免不合理风险)；安全状态是故障后系统应进入的可控状态(如限速/断高压)。\n工程：BMS 过充→安全状态断继电器；设计要能“稳稳落地”。\n坑：安全状态本身不可达(如断高压但无备份)无效；状态切换有风险。\n记忆：安全状态 = “出事了去哪才安全”。'],
  ['safety','FMEA 与 FTA 区别？','要点：FMEA 自底向上(每个部件怎么失效、影响)；FTA 自顶向下(某故障怎么由原因树导致)。\n工程：设计早期 FMEA 找单点故障；FTA 论证安全目标达成；二者互补。\n坑：只做其一不全；FMEA 没评探测度(D)漏关键。\n记忆：FMEA 自下，FTA 自上。'],
  ['safety','诊断覆盖率(DC)与 SPFM/LFM？','要点：DC=被诊断捕获的危险失效率占比；SPFM(单点)/LFM(潜在)是随机硬件失效指标，ASIL D 要求极高(如 SPFM≥99%)。\n工程：加冗余/监控提 DC；算失效率对照目标；安全机制要有效。\n坑：安全机制无效(同失效源)DC 虚高；忽略潜在故障(LFM)。\n记忆：DC = “危险故障被抓的比例”。'],
  ['safety','单点故障 vs 潜在故障？','要点：单点=一个故障直致违安全(需高 SPFM)；潜在=潜伏未被察、与另一故障组合才危险(需 LFM)。\n工程：双通道独立探测单点；周期自检/在线测捕获潜在。\n坑：只防单点漏潜在(双故障才爆)；自检周期太长潜在久藏。\n记忆：单点立竿见影，潜在潜伏组合。'],
  ['safety','什么是安全机制(safety mechanism)？','要点：检测/控制故障的手段：冗余采样、比较器、看门狗、E2E 保护、CRC、自检(如 ADC 自检)。\n工程：每个安全目标配机制并证其 DC；机制要独立于被监对象。\n坑：机制与被监同源(共因)无效；机制未验证 DC 不可信。\n记忆：安全机制 = “专门抓故障的保镖”。'],
  ['safety','E2E(端到端)保护？','要点：对跨 ECU 信号加 CRC/序列号/存活号，接收端校验，防通信错/丢/重/乱序；AUTOSAR 有 E2E 库。\n工程：安全相关信号必 E2E；防单点通信故障致误动作。\n坑：只 CRC 不防重放(需计数/时间戳)；E2E 配错两端不一致。\n记忆：E2E = “信号的全链路保镖”。'],
  ['safety','工具置信度(TCL/工具资格)？','要点：ISO 26262-8 §11 要求论证所用工具(编译器/建模)不会引入未检测错误；未认证需资质包或认证工具。\n工程：用 TÜV 认证编译器(GHS/TASKING)省事；GCC 需自建资质论证。\n坑：直接信未认证工具无论证通不过审核；资质包不全。\n记忆：工具也要“持证上岗”。'],
  ['safety','什么是 proven-in-use(经使用证明)？','要点：用大量现场运行证据(无相关失效)替代部分论证，降低开发负担；需充分数据与统计。\n工程：成熟部件/既有平台可用；新关键功能不适用。\n坑：数据不足/工况不同硬套；统计方法不达标。\n记忆：proven-in-use = “老员工免试用期”。'],
  ['safety','软件架构层面的安全(模块化/隔离)？','要点：按 ASIL 分解、互不干扰(FFI)、空间/时间隔离；低 ASIL 不拖高 ASIL。\n工程：MPU 隔离、时间分区；安全相关独立任务/核。\n坑：低 ASIL 模块故障波及高 ASIL(无 FFI)；时间分区没保。\n记忆：架构 = “高矮墙隔安全级”。'],
  ['safety','ASIL 分解(decomposition)？','要点：把高 ASIL 需求拆成两个低 ASIL 冗余(如 QM+QM 替 ASIL D)，靠独立冗余降单点要求。\n工程：用双路独立实现降开发成本；需证明独立(无共因)。\n坑：分解的两路共因失效则无效；独立性论证不足。\n记忆：分解 = “两路低配替一路高配”。'],
  ['safety','什么是 DIA(委托接口协议)？','要点：主机厂与供应商间界定安全活动责任(谁做概念/设计/验证)的协议。\n工程：Tier1 接 OEM 安全需求落地；责任边界写清防扯皮。\n坑：责任不清致安全活动漏做；接口需求传递错。\n记忆：DIA = “安全责任的分工合同”。'],
  ['safety','硬件失效率与 SN29500/ISO 26262 计算？','要点：用元件失效率(如 FIT)按架构算系统随机失效率，对照 SPFM/LFM 目标。\n工程：选件时看 FIT；冗余降失效率；早期算避免后期返工。\n坑：忽略温度/应力致失效率低估；共因未减。\n记忆：硬件安全 = “算失效率对照目标”。'],
  ['safety','什么是“安全相关”与“非安全相关”软件？','要点：参与实现安全目标的算安全相关，需按 ASIL 流程；无关的可 QM 但须不影响安全(FFI)。\n工程：清晰划边界；QM 模块故障不能波及安全模块。\n坑：边界模糊全按高 ASIL 成本爆炸；QM 拖安全。\n记忆：相关才严管，无关要隔离。'],
  ['safety','故障注入测试(fault injection)？','要点：人为注入故障(短路/改值/停任务)验证安全机制与状态正确；是安全验证手段。\n工程：HW 注故障测保护、SW 注错测诊断；覆盖安全机制。\n坑：只测正常不测故障；注入不达标却放行。\n记忆：故障注入 = “故意捣乱看它会不会兜底”。'],
  ['safety','什么是安全案例分析(safety case)？','要点：用证据链(分析+测试+论证)证明系统满足安全目标；审核核心交付。\n工程：贯穿全生命周期；文档化论证 ASIL 达成。\n坑：证据链断(某环节无论证)被否；只堆测试不论证。\n记忆：safety case = “我安全的有据可查”。'],
  ['safety','功能安全与 SOTIF(ISO 21448)区别？','要点：26262 管随机硬件/系统故障；SOTIF 管“预期功能不足/误用”导致的危险(如传感器局限、AI 误判)。\n工程：智驾/感知系统需 SOTIF；二者互补覆盖。\n坑：只做 26262 忽略感知局限(如雾天误识别)；SOTIF 难量化。\n记忆：26262 防故障，SOTIF 防“没故障也犯错”。'],
  ['safety','什么是“可控性(C)”在 ASIL 中？','要点：事故时驾驶员/外界能否避免危害；可控性高则 ASIL 可低(如缓慢失速可控)。\n工程：评估要真实(仿真/专家)；误判高可控定低 ASIL 危险。\n坑：乐观估可控致 ASIL 低；不同市场驾驶习惯不同。\n记忆：可控性 = “出事人能不能救”。'],
  ['safety','冗余设计的共因失效(CCF)？','要点：两路冗余若同源(同电源/同软件/同环境)仍可能同时失效，使冗余无意义。\n工程：冗余要异源(异芯片/异算法/异供电)；论证独立性。\n坑：两套相同代码/同编译器同源失效；共因未分析。\n记忆：冗余最怕“一起死”。'],
  ['safety','什么是“安全启动(safety boot)”与信任链？','要点：上电逐级验签名(ROM→Boot→App)，任一级失败不开机；防刷恶意固件。\n工程：车规需安全启动；密钥存安全区(TrustZone/OTP)。\n坑：校验被绕过(如调试口开)；密钥泄露。\n记忆：安全启动 = “开机先验身份证”。'],
  ['safety','ASPICE 与功能安全关系？','要点：ASPICE 是软件过程能力模型(过程质量)，26262 是安全；好过程利于安全落地，但过程好≠安全达标。\n工程：车规开发常两者并行；过程评级供审核。\n坑：以为 ASPICE 高就安全够；忽略安全专项论证。\n记忆：ASPICE 管过程，26262 管安全。'],
  ['safety','什么是“残余风险”与可接受？','要点：经所有措施后仍剩的风险，需评估在合理可行最低(ALARP)内可接受。\n工程：安全目标定“不合理风险”边界；残余要论证可接受。\n坑：残余风险未论证直接交付；过度设计成本爆炸。\n记忆：残余风险 = “剩下的、要证明能接受”。'],
  ['safety','诊断测试间隔与故障响应时间？','要点：故障从发生到被诊断+进入安全状态的总时间须小于危害可容忍时间；间隔太长则危险窗口大。\n工程：周期自检/监控要够快；安全状态切换要稳。\n坑：诊断周期长致危险窗口超容忍；响应慢于故障发展。\n记忆：检测+响应要快过“出事速度”。'],
  ['safety','什么是“免于干扰(FFI)”？','要点：不同 ASIL/安全相关间在空间(内存)与时间(调度)上互不干扰，低不影响高。\n工程：MPU 空间隔离+时间分区；安全相关独立核。\n坑：低 ASIL 写穿高 ASIL 内存；任务超时被高优。\n记忆：FFI = “各扫门前雪，互不踩”。'],
  ['safety','功能安全在 BMS 上的典型落地？','要点：过充/过流/绝缘/温度各定安全目标(常 C/D)，冗余采样+硬件比较+断高压安全状态+诊断覆盖率达标。\n工程：电压电流双路、绝缘电桥、热失控早期断高压；文档论证。\n坑：只软件保护 MCU 死失效；DC 不达标审核不过。\n记忆：BMS 安全 = “冗余采样+独立保护+可论证”。'],
  ['diag','UDS(ISO 14229)是啥、常用服务？','要点：统一诊断服务，基于 CAN/ETH；常用 $10 会话、$22 读 DID、$2E 写、$27 安全、$19 读 DTC、$14 清、$31 例程、$34/36/37 刷写。\n工程：BMS/ECU 诊断都走 UDS；DID 映射内部变量；安全等级防未授权写。\n坑：安全等级没配谁都能写标定；DTC 状态位维护错。\n记忆：UDS = “诊断的通用语”。'],
  ['diag','$27 安全访问怎么防非法？','要点：请求种子(seed)→算密钥(key)比对，匹配才开放写/例程；seed 随机防重放。\n工程：关键写(标定/刷写)前 $27；算法含密钥不泄露；尝试限次锁。\n坑：seed 固定可重放；算法在明处被逆向；无限尝试被暴力。\n记忆：$27 = “先对暗号再放行”。'],
  ['diag','DTC 与快照(snapshot)？','要点：DTC 记故障码+状态；快照冻结故障时刻相关信号(电压/温度)辅助定位；扩展数据记发生计数。\n工程：故障触发同时存快照；UDS $19 读；维修靠它。\n坑：快照变量选错定位不到； freezing 时机晚漏关键。\n记忆：DTC+快照 = “故障现场照片”。'],
  ['diag','Bootloader 刷写流程？','要点：进入扩展会话→$27 认证→$34 请求下载($36 传数据/$37 传完)→校验→$11 复位；带签名/CRC。\n工程：分块传+每块校验；A/B 备份防变砖；掉电保护。\n坑：传输中断电变砖；无签名被刷恶意；校验错未检。\n记忆：Bootloader = “安全换脑程序”。'],
  ['diag','$31 例程控制(routine)干嘛？','要点：启停 ECU 内部例程(如自检、标定学习、强制均衡)，用于诊断/产线/维护。\n工程：产线触发自检、BMS 触发均衡；需安全访问。\n坑：例程无权限控制被乱调；长例程阻塞诊断会话。\n记忆：$31 = “让 ECU 跑个指定程序”。'],
  ['diag','XCP 与 UDS 区别？','要点：XCP 用于测量标定(实时读改变量，台架调参)；UDS 用于诊断服务(读故障/刷写)。\n工程：标定用 XCP 在线改 NVM 标定块；诊断用 UDS；两者都需安全。\n坑：用 UDS 做高频标定慢；XCP 无权限控制被乱改。\n记忆：XCP 调参，UDS 诊病。'],
  ['diag','OBD(车载诊断)与 UDS 关系？','要点：OBD 是排放相关强制诊断(标准 PID)，UDS 是通用；汽车常两者并存，OBD 偏法规。\n工程：排放相关用 OBD PID；整车功能用 UDS；整车厂统一网关。\n坑：只做 UDS 忽略 OBD 法规不达标；PID 定义不清。\n记忆：OBD 管排放合规，UDS 管通用诊断。'],
  ['diag','诊断通信的“会话层”$10？','要点：默认会话(基础读)、扩展会话(允许写/例程)、编程会话(刷写)；不同会话开放不同服务。\n工程：写/刷写需切扩展/编程会话+$27；超时回默认防误留权限。\n坑：会话超时未回默认致权限残留；刷写中途回默认失败。\n记忆：$10 = “切换诊断模式门禁”。'],
  ['diag','CAN 诊断的 ISO-TP(传输协议)？','要点：CAN 单帧 8 字节，长 UDS 报文靠 ISO-TP 分包(首帧/流控/连续帧)重组；ISO 15765-2。\n工程：长 DID/刷写数据靠 TP；流控帧控节奏防溢出。\n坑：TP 参数(块大小/时隔)配错重组失败；超时未处理卡死。\n记忆：ISO-TP = “CAN 上的长报文拼装”。'],
  ['diag','什么是“DID(数据标识符)”？','要点：每个可读写内部变量分配一个 2 字节 ID，$22 读/$2E 写；是诊断与标定的接口表。\n工程：DID 表集中管理；敏感 DID 加 $27；与 NVM 映射。\n坑：DID 与变量映射错读到别的；敏感 DID 未保护。\n记忆：DID = “内部变量的门牌号”。'],
  ['diag','诊断故障的“确认/老化/去抖”？','要点：故障需持续/满足条件(如 N 个运行循环)才 confirmed；无故障老化计数降误报；去抖防偶发。\n工程：确认阈值按严重度；老化避免历史故障久驻；去抖防干扰。\n坑：确认太快误报；老化太长真实故障早清不掉。\n记忆：故障要“稳了才算数”。'],
  ['diag','刷写时的“签名校验”怎么做？','要点：固件带厂私钥签名，ECU 用公钥验(非对称)，验过才烧；防刷恶意/篡改。\n工程：安全启动+刷写都验签；密钥存安全区；回滚防旧版漏洞。\n坑：公钥硬编码可被替换(需安全区)；验签被绕过。\n记忆：签名 = “固件的防伪标签”。'],
  ['diag','什么是“标定数据区”与安全？','要点：标定(阈值/PID)存独立可写区(NVM)，XCP 在线改；需权限+校验+备份防乱改/损坏。\n工程：标定值与代码分离；改前备份可回滚；产线写绑定。\n坑：标定区与代码同区刷写误清；无备份改错难恢复。\n记忆：标定区 = “可在线调的参数仓库”。'],
  ['diag','诊断网关(Gateway)作用？','要点：整车多 ECU 经网关路由诊断(DoIP/网关)，诊断仪经一个口访问全车；隔离+安全。\n工程：以太网 DoIP 诊断(ISO 13400)；网关做路由/权限/防火墙。\n坑：网关路由漏致诊断不到某 ECU；无防火墙被远程入侵。\n记忆：网关 = “诊断的总闸+路由”。'],
  ['diag','$2F IO 控制(输入输出控制)？','要点：诊断强制控制某输入输出(替代真实信号)，产线/维修替换测试用。\n工程：强制灯亮/读强制值验证执行器；需安全访问+恢复。\n坑：未恢复强制态致车辆异常；无权限被乱控。\n记忆：$2F = “诊断强制接管某个脚”。'],
  ['diag','什么是“事件(Event)内存”与循环覆盖？','要点：故障/事件按 FIFO 或优先级存 NVM，满则覆盖最旧；保留最新与最严重。\n工程：黑匣子用环形缓冲；关键事件优先保；掉电保护。\n坑：缓冲太小早期关键被覆盖；没掉电保护断电丢。\n记忆：事件存 = “先入先出或保重要”。'],
  ['diag','UDS 的 negative response(负响应)？','要点：ECU 拒服务回 $7F+服务+错误码(NRC)，如条件不满足/无权/忙碌；诊断仪据此处理。\n工程：每个拒绝要有明确 NRC；便于定位为何失败。\n坑：一律回通用错误码难排查；NRC 与状态不一致。\n记忆：负响应 = “拒绝并说原因”。'],
  ['diag','DoIP(基于以太网的诊断)？','要点：诊断 over IP(ISO 13400)，用 TCP/UDP 传 UDS，支援大流量刷写/远程诊断。\n工程：现代产线/售后用以太网刷写快；需车辆发现+路由；安全(防火墙)。\n坑：IP 配置错连不上；大流量刷写无校验中断。\n记忆：DoIP = “以太网上的 UDS 快车”。'],
  ['diag','诊断“写参数”后如何生效/保存？','要点：写(DID/$2E)可临时生效或存 NVM 永久；是否立即生效看设计，常需复位/特定触发。\n工程：标定写存 NVM 重启生效；临时写用于试；区分 volatile/persist。\n坑：以为写了立即永久，实则掉电丢；永久写频繁耗 NVM 寿命。\n记忆：写分“试一下”和“存下来”。'],
  ['diag','产线 EOL 诊断都做什么？','要点：写 VIN/序列号、标定、自检、读 DTC 确认无故障、功能激活；自动化台架。\n工程：下线即全检；参数绑定追溯；不合格拦截。\n坑：漏写 VIN 追溯难；EOL 后仍有故障流出。\n记忆：EOL = “出厂前诊断体检”。'],
  ['diag','什么是“安全相关诊断”与“非安全”？','要点：影响功能安全的诊断(如绝缘/过充监控)需高 DC 与实时；普通(如灯故障)可宽松。\n工程：安全诊断进安全状态机；普通走常规 DTC。\n坑：安全诊断当普通慢处理致危险；混淆级别。\n记忆：安全诊断 = “跟安全绑定的快响应”。'],
  ['diag','DTC 状态字节各位含义？','要点：bit0 测试失败、bit1 测试失败(本循环)、bit3 pending、bit4 confirmed、bit5 未测完、bit6/7 老化/警告；组合表故障履历。\n工程：读取解析各 bit 判严重度；确认需 pending 持续。\n坑：bit 含义记错误判；confirmed 后未老化久驻。\n记忆：状态字节 = “故障的 8 个开关”。'],
  ['diag','刷写“依赖(前置条件)”检查？','要点：刷写前验 ECU 状态/电压/会话/其他 ECU 兼容性，避免刷一半失败或不兼容。\n工程：电压不足禁止刷(掉电变砖)；依赖 ECU 版本匹配。\n坑：电压不足仍刷中断电变砖；版本不兼容刷完不工作。\n记忆：刷前先查“能不能刷”。'],
  ['diag','诊断与功能安全怎么联动？','要点：诊断发现的故障经 DEM→安全状态机→降级/断高压；诊断是安全机制的数据源之一。\n工程：严重 DTC 触发安全反应；诊断覆盖率计入 DC。\n坑：诊断慢致安全反应迟；DTC 与安全措施脱节。\n记忆：诊断发现，安全兜底。'],
  ['diag','什么是“回滚(rollback)”刷写？','要点：保留旧版固件，新版本失败/异常可回退，防变砖；A/B 分区常见。\n工程：刷完校验成功才切活动区；失败重启回旧；需足够空间。\n坑：无回滚刷坏即砖；两区都损坏无救。\n记忆：回滚 = “留一手旧版保命”。'],
  ['diag','诊断日志/黑匣子与 UDS 读取？','要点：ECU 循环记关键事件到 NVM，UDS 读导出；事故/售后定位用。\n工程：故障前后窗口+快照；产线/售后读取；掉电保护。\n坑：日志分辨率低定位不到；没掉电保护断电丢。\n记忆：黑匣子 = “事后读行车记录”。'],
  ['mcal','MCAL 中 MCU 模块职责？','要点：芯片初始化(时钟树/复位/电源/低功耗)、提供时钟使能与模式切换接口；是其它模块基础。\n工程：启动先 Mcu_Init 配时钟；低功耗模式切换经 Mcu；AUTOSAR 移植核心。\n坑：时钟配错全系统不稳；低功耗恢复时钟未重配外设失配。\n记忆：MCU 模块 = “芯片的总开关与时钟”。'],
  ['mcal','PORT 模块怎么决定引脚功能？','要点：静态配置引脚方向/复用功能/上下拉/驱动强度；PORT 配错外设无信号。\n工程：引脚规划表集中 PORT 配；与硬件原理图一致；改引脚只改配置。\n坑：复用功能配错(GPIO 当 SPI)；上下拉与外接冲突。\n记忆：PORT = “给每个脚分配职业”。'],
  ['mcal','DIO 与 PORT 怎么配合？','要点：PORT 配角色(方向/复用)，DIO 提供读/写/翻转 API；应用读写在 DIO 层。\n工程：裸读写在 DIO；复杂外设走对应驱动(SPI/ADC)而非 DIO 模拟。\n坑：用 DIO 模拟高速 SPI 占 CPU；PORT 未配输入读不确定。\n记忆：PORT 定身份，DIO 干活。'],
  ['mcal','ADC 模块的“组/通道/触发”模型？','要点：Group 含若干 Channel，触发源(软件/硬件定时器)启动转换，完成通知应用；支持连续/单次。\n工程：多通道周期扫描建 Group；控制环用硬件触发同步；结果通知非轮询。\n坑：触发源配错不转；通知里重活拖实时；连续模式占带宽。\n记忆：MCAL ADC = “组+触发+通知”。'],
  ['mcal','PWM 模块的输出/对齐/死区？','要点：输出可调占空比/频率波形；边沿或中心对齐；互补输出带死区防直通；可触发 ADC。\n工程：电机用高级定时器互补+死区；控制周期触发 ADC 同步采样。\n坑：死区没配上下管直通炸；对齐错导致谐波/抖动。\n记忆：PWM = “波形发生器+死区保护”。'],
  ['mcal','SPI 模块的“异步/同步”与缓冲？','要点：SPI 可同步(阻塞)或异步(DMA+通知)；多从片选管理；帧长/时钟极性配齐。\n工程：屏/Flash 用异步 DMA；短命令同步即可；CS 时序满足从机。\n坑：时钟极性错收乱；异步未等完成就读旧数据。\n记忆：MCAL SPI = “主从时钟对齐+DMA”。'],
  ['mcal','ICU 模块(输入捕获)用途？','要点：捕获外部边沿时间戳测周期/占空比/脉宽；用于转速/编码器/超声波。\n工程：信号测量用 ICU；配边沿与预分频；结果通知或 DMA。\n坑：边沿选错测得互补量；溢出未拼接跨周期错。\n记忆：ICU = “给外部波形计时”。'],
  ['mcal','WDG(看门狗)模块？','要点：配独立/窗口看门狗参数，周期触发喂；与 WdgM 配合(应用喂 WdgM，WdgM 喂硬件)。\n工程：模式切换时喂策略变(低功耗停狗或慢喂)；安全相关必配。\n坑：低功耗没停狗醒来复位；喂时机错触发窗口狗。\n记忆：WDG = “硬件看门狗的接口”。'],
  ['mcal','CAN 模块的发送/接收与过滤？','要点：配波特率/掩码验收过滤；发送入 Tx 邮箱，接收经 FIFO/Rx 中断；与 CANIF 对接。\n工程：验收过滤只收相关帧省 CPU；错误被动态处理；波特率全节点一致。\n坑：过滤配错收全或收不到；波特率不一致满错误帧。\n记忆：MCAL CAN = “收发+过滤”。'],
  ['mcal','FLS(Flash 驱动)与 EEPROM 模拟？','要点：FLS 提供擦/写/读 Flash 接口；上层用其做 EEPROM 模拟(磨损均衡+掉电保护)。\n工程：参数存 Flash 经 FLS；擦写对齐与等待；运行中擦写阻塞取指同 Bank。\n坑：运行中擦同 Bank 卡；擦写次数超限坏。\n记忆：FLS = “Flash 的底层读写官”。'],
  ['mcal','GPT(通用定时器)驱动？','要点：提供定时/计数/输出比较/输入捕获基础；PWM/ICU 常建其上；提供时基。\n工程：用 GPT 做精确延时/周期触发；多通道独立。\n坑：重载值溢出周期错；多路争用同一计时器冲突。\n记忆：GPT = “通用计时基石”。'],
  ['mcal','MCAL 配置的“容器/参数”层级？','要点：每个模块配置由容器(Container)→参数(Parameter)层级，工具生成；改配置改容器。\n工程：熟悉配置工具改参数；配错编译/运行异常；版本管理 ARXML。\n坑：手动改生成代码被覆盖；参数越界未校验。\n记忆：MCAL 配置 = “容器树”。'],
  ['mcal','MCAL 与“直接寄存器操作”的区别与权衡？','要点：MCAL 标准化可移植但抽象开销；裸寄存器高效但不可移植、无标准接口。\n工程：量产/多平台用 MCAL；极简/极小资源可裸写但难维护。\n坑：混用 MCAL 与裸写致状态冲突；裸写散落全工程难移植。\n记忆：MCAL = “标准但稍慢”，裸写 = “快但绑死”。'],
  ['mcal','MCAL 的“通知(Notification)回调”机制？','要点：外设事件(转换完/收帧)调注册的通知函数，应用在其里取数/置标志；非阻塞。\n工程：用通知替代轮询；通知里轻量；重活在任务。\n坑：通知里调阻塞 API 崩；未注册通知收不到。\n记忆：Notification = “外设喊你一声”。'],
  ['mcal','MCAL 多核/分区下的 MCAL？','要点：某核/分区独占部分外设，MCAL 由该核驱动；跨核外设需代理/IOC。\n工程：分核规划外设；避免两核驱同外设冲突。\n坑：两核同驱一外设状态乱；跨核访问无同步。\n记忆：MCAL 也讲“谁的地盘谁管”。'],
  ['mcal','MCAL 配置错误怎么查？','要点：DET 报告 API 误用；逻辑分析仪抓波形(SPI/CAN 时序)；调试器看寄存器实际值。\n工程：开发开 DET；配完先验证单模块再联调；对照数据手册。\n坑：忽略 DET 掩盖配置错；只信配置不实测。\n记忆：MCAL 查错 = “DET+实测波形”。'],
  ['mcal','为什么 MCAL 要“按芯片选”？','要点：MCAL 直接绑芯片外设，不同厂/型号寄存器与特性不同，必须用语厂提供版本，不能跨芯片。\n工程：换 MCU 重配 MCAL；评估芯片时确认 MCAL 可用性。\n坑：盲目移植 MCAL 到别芯片编译/运行失败；忽略厂支持度。\n记忆：MCAL = “芯片专属驱动，换芯必换”。'],
  ['mcal','MCAL 的“时钟依赖”与使能顺序？','要点：外设时钟由 Mcu 使能后才能用；模块 Init 顺序(先 Mcu/Port 后外设)有依赖。\n工程：Init 顺序按依赖；漏使能时钟外设不动；低功耗恢复重使能。\n坑：外设先 Init 后开时钟配置无效；顺序错初始化失败。\n记忆：先通电(钟)再干活。'],
  ['mcal','MCAL 的中断配置(ISR 绑定)？','要点：中断源与 ISR 由配置/向量表绑定；优先级由 OS/MCU 定；使能后才进中断。\n工程：关键中断设合适优先级；ISR 轻量；多源仲裁按优先级。\n坑：中断未使能收不到；优先级错致关键延迟。\n记忆：MCAL 中断 = “开使能+绑 ISR+定优先级”。'],
  ['mcal','MCAL 与 AUTOSAR OS 的协作？','要点：MCAL 通知/中断触发 OS 事件或任务；BswM 据模式控制 MCAL(如关外设低功耗)。\n工程：驱动事件唤醒任务；模式切换经 BswM 管外设；配合调度。\n坑：通知触发不唤醒任务数据处理滞后；模式切换漏关外设漏电。\n记忆：MCAL 事件 → OS 任务。'],
  ['mcal','MCAL 的“版本兼容”问题？','要点：MCAL 版本与 AUTOSAR 版本(4.0/4.2/4.4)与工具链需匹配，否则接口/生成不兼容。\n工程：选型时固定版本组合；升级整体回归；ARXML 版本一致。\n坑：混版本编译错/行为异；只升 MCAL 不升工具。\n记忆：MCAL 版本要“全家桶一致”。'],
  ['mcal','MCAL 的“诊断/开发错误”钩子？','要点：DET 接开发错误，Dem 接运行时故障(如通信丢失)；二者让问题可见可追溯。\n工程：开发开 DET 抓配置错；运行 Dem 报硬件故障；量产前收敛。\n坑：量产前留 DET 卡死；忽略 Dem 故障掩盖硬件问题。\n记忆：MCAL 钩子 = “开发/运行报错出口”。'],
  ['mcal','MCAL 的“多通道/多实例”管理？','要点：如多路 ADC/SPI/CAN 各有独立通道/控制器，配置分别；应用按通道访问。\n工程：资源按通道规划；避免冲突；性能按通道负载。\n坑：多通道配置混；某通道过载拖整体。\n记忆：MCAL 多实例 = “各通道独立配”。'],
  ['mcal','MCAL 对功能安全的支持？','要点：安全相关 MCAL 需 ASIL 级(或配安全机制)；如 WDG 监控、ADC 自检、E2E；提供 DC。\n工程：安全 ECU 用 ASIL MCAL 或加机制；论证诊断覆盖。\n坑：用 QM MCAL 于安全相关未补机制；DC 不足。\n记忆：安全 MCAL = “带安全机制的驱动”。'],
  ['mcal','MCAL 的“回调 vs 轮询”取舍？','要点：中断/通知(回调)省 CPU 实时好，但需轻量；轮询简单但占 CPU/延迟高。\n工程：实时数据用回调；低频可用轮询；按场景选。\n坑：轮询高频占 CPU；回调重活拖中断。\n记忆：实时用回调，简单用轮询。'],
  ['build','编译四阶段与每阶段产物？','要点：预处理(展开宏/头→.i)→编译(到汇编.s)→汇编(.o)→链接(可执行)；-E/-S/-c 各停一阶段。\n工程：排查宏错用 -E；看汇编优化用 -S；增量靠 .o。\n坑：只看链接错不知源头；头重复包含膨胀。\n记忆：四阶段 = 展开→翻译→组装→拼接。'],
  ['build','链接脚本(ld)决定什么？','要点：各段(.text/.data/.bss/.rodata)落 Flash/RAM 的地址与顺序、栈/堆位置、入口；决定内存布局。\n工程：改布局/加段靠链接脚本；与启动配合；溢出看映射。\n坑：段重叠/越界；栈堆没留够；未初始段未清。\n记忆：链接脚本 = 内存施工图纸。'],
  ['build','.data/.bss/.text/.rodata 各去哪？','要点：.text 代码(Flash)、.rodata 只读(Flash)、.data 已初始全局(RAM，初值存 Flash 启动拷)、.bss 未初始(RAM 清0)。\n工程：启动代码拷 .data、清 .bss；RAM 占用看 .data+.bss+栈堆。\n坑：忘了拷 .data 全局初值错；.bss 未清初值随机。\n记忆：代码常量在 Flash，变量在 RAM。'],
  ['build','什么是重定位与符号解析？','要点：链接时把各 .o 符号引用绑到定义地址(重定位)，未定义/重复定义报错。\n工程：缺实现→undefined reference；重复→multiple definition；map 文件查地址。\n坑：C/C++ 名字改编不一致链接失败；弱符号被误覆盖。\n记忆：链接 = 把引用对上定义。'],
  ['build','map 文件怎么看、干什么？','要点：列出符号地址/大小、段占用、内存使用；查溢出/谁占空间大/函数落点。\n工程：Flash/RAM 将满看 map；定位大函数优化；查死代码。\n坑：不读 map 不知 RAM 将爆；忽略对齐填充致段大。\n记忆：map = 内存使用账单。'],
  ['build','强符号/弱符号？','要点：普通定义强，__attribute__((weak)) 弱；强冲突报错，强弱共存用强，多弱用任一。\n工程：默认中断向量/钩子用 weak 可被覆盖；库给默认实现。\n坑：误 weak 使关键默认被覆盖；强符号重复链接失败。\n记忆：弱 = 可被覆盖的默认。'],
  ['build','为什么有未定义引用？','要点：声明了函数/变量却没实现或没链进库；或 C/C++ 名字改编不一致；或链接顺序错。\n工程：实现文件没编译、库顺序(依赖在后)、extern C 缺失。\n坑：库顺序错(前向后依)失败；C++ 调 C 漏 extern C。\n记忆：undefined = 喊了人没来。'],
  ['build','死代码消除？','要点：链接时(--gc-sections)删未引用段，减固件；被函数指针/中断向量引用者不能删。\n工程：配合 -ffunction-sections 段级消除；固件常用省 Flash。\n坑：被指针引用却误删(需 KEEP)；删了关键初始化。\n记忆：死代码消除 = 没用就扔。'],
  ['build','位置无关代码(PIC)？','要点：代码用相对寻址(无绝对地址)，可加载任意地址运行；共享库/固件 XIP 升级常用。\n工程：-fPIC 生成；Bootloader 跳 App 常需非 PIC 或重定位；Linux 共享库必 PIC。\n坑：固件想重定位却没 PIC 跳错；PIC 略增开销。\n记忆：PIC = 到哪都能跑。'],
  ['build','ABI 与调用约定？','要点：ABI=二进制接口(参数/栈/寄存器/对齐)，调用约定(如 AAPCS)规定参数用 r0-3；不符跨库崩。\n工程：混合编译器/汇编要同 ABI；内联汇编遵守；跨芯片不同。\n坑：ABI 不一致链接通过运行崩；汇编破坏约定。\n记忆：ABI = 二进制如何握手。'],
  ['build','可复现构建(reproducible build)？','要点：同源码+同环境产出逐字节相同固件；排除时间戳/路径/随机数；车规审计要求。\n工程：固定工具链版本/选项、去 __DATE__/__TIME__、归一路径；哈希校验。\n坑：嵌时间戳致每次不同无法审计；路径进调试信息泄露。\n记忆：可复现 = 同输入必同输出。'],
  ['build','链接时优化 LTO 细节？','要点：编译留中间表示，链接时跨文件优化(内联/删死代码)；固件常用。\n工程：-flto 编译+链接同编译器同版本；固件更小更快；链接慢。\n坑：跨编译器 LTO 不兼容；链接期内存暴涨。\n记忆：LTO = 链接时才全量优化。'],
  ['build','分散加载(scatter)？','要点：ARM 链接器内存布局描述(类似 ld 脚本)，按执行域/加载域定义段落点；复杂启动用。\n工程：Bootloader+App 多镜像、XIP 用 scatter；与启动配对。\n坑：加载域≠执行域未拷数据；段重叠。\n记忆：scatter = ARM 的链接脚本。'],
  ['build','符号表/调试信息与发布？','要点：符号表(.symtab)与调试信息(dwarf)用于定位；发布固件常 strip 去符号/调信息减体积保密。\n工程：保留带符号版供 crash 解析；发布 strip；crash 用 addr2line 解。\n坑：发布带符号泄露源码结构；strip 后无法定位 crash。\n记忆：符号 = 崩溃定位的地图。'],
  ['build','交叉编译工具链？','要点：在主机编译目标机(如 x86 编 ARM)代码；含交叉编译器/链接器/库(sysroot)；前缀如 arm-none-eabi。\n工程：固件必交叉编译；sysroot 指目标系统头/库；不与主机混。\n坑：误用主机 gcc 编固件；sysroot 混宿主库。\n记忆：交叉编译 = 在 PC 上造 ARM 的固件。'],
  ['tools','常见嵌入式工具链？','要点：GCC(arm-none-eabi 免费通用)、Clang/LLVM、商业 GHS MULTI/TASKING(车规认证)、IAR；各有利弊。\n工程：车规认证选商业；开源用 GCC；LLVM 可插桩分析。\n坑：认证项目用 GCC 无资质包；混编译器行为差异。\n记忆：工具链 = 编译器+链接器+库全家桶。'],
  ['tools','构建系统与选型？','要点：把源码→固件的自动化流程；Make/CMake/商业 IDE；大项目要可复现/并行/跨平台。\n工程：简单用 Make，复杂用 CMake+Ninja；车规要可复现与审计。\n坑：手工编译不可复现；递归 Make 不可并行增量。\n记忆：构建系统 = 从源码到固件的流水线。'],
  ['tools','调试器(J-Link/ST-Link/PE)？','要点：J-Link 通用强快(SEGGER)、ST-Link 配 ST 芯片、PE 配 NXP；都走 SWD/JTAG。\n工程：选与芯片/IDE 兼容的；量产留测试点；安全芯片可锁调试。\n坑：调试器与芯片不兼容；量产没关 debug 泄固件。\n记忆：调试器 = 连芯片的线。'],
  ['tools','CI(持续集成)在固件？','要点：提交即自动编译/静态检查/单测/出固件；保证可构建与质量；车规加 ASPICE/静态分析门禁。\n工程：用 Jenkins/GitLab CI；加 -Werror/PC-lint/MISRA 门禁；出可复现固件。\n坑：CI 不卡警告漏低级错；无单测仅靠手工。\n记忆：CI = 每次提交自动验一遍。'],
  ['tools','静态分析(MISRA/PC-lint/Cppcheck)？','要点：不运行代码查违规(未初始化/溢出/违规 API)；MISRA C 车规强制；减少缺陷。\n工程：车规必过 MISRA；CI 跑 PC-lint/Cppcheck；误报配抑制。\n坑：MISRA 全开误报多需治理；忽略关键规则漏真 bug。\n记忆：静态分析 = 不跑也能找的 bug。'],
  ['tools','hex/bin/elf/s19 格式？','要点：elf 含调试信息(开发)、bin 纯二进制(烧录)、hex/s19 文本(烧录/产线)。\n工程：调试用 elf，烧录用 bin/hex；Bootloader 常收 bin+校验。\n坑：bin 无地址需 loader 知落点；hex 行超长截断。\n记忆：elf 开发，bin/hex 烧录。'],
  ['tools','跟踪(trace)与覆盖率？','要点：用 CoreSight/ETM 抓指令流，做覆盖率/性能/调度分析；验证测试充分性。\n工程：安全/高可靠需覆盖率(语句/分支/MC/DC)；ETM 出 trace 分析。\n坑：没引 trace 引脚只能软覆盖；覆盖率低测试不足。\n记忆：trace = 芯片跑过的录像。'],
  ['tools','栈分析/最坏执行时间 WCET？','要点：静态或测量法估函数最坏执行时间，实时系统必算；结合调度定能否达死线。\n工程：用 trace/CYCCNT 测+静态分析；留余量；关键路径必算。\n坑：只测平均忽略最坏；优化改变 WCET 未重算。\n记忆：WCET = 最慢要多久。'],
  ['tools','代码尺寸优化 vs 速度优化？','要点：-Os 体积优先(固件常选省 Flash)、-O2 速度；二者权衡；-Oz 更小。\n工程：MCU Flash 小用 -Os；性能热点局部 -O2/-O3；统一策略。\n坑：全 -O3 体积爆；全 -Os 性能不满足实时。\n记忆：体积 vs 速度，按资源选。'],
  ['tools','固件签名/加密工具？','要点：私钥签名固件(防篡改)、可选加密(防逆向)；产线/升级验签；密钥管理关键。\n工程：安全启动+OTA 验签；密钥存安全区；回滚防旧版。\n坑：密钥泄露全盘崩；验签被绕过。\n记忆：签名 = 固件防伪+防改。'],
  ['tools','单元/集成/系统测试分层？','要点：单元测函数、集成测模块接口、系统测整车；各层自动化；车规 ASPICE 要求。\n工程：CI 跑单测+静态；HIL 做集成；整车做系统；覆盖安全。\n坑：只系统测定位难；单测不隔离依赖难写。\n记忆：测试 = 由小到大三层。'],
  ['tools','HIL(硬件在环)测试？','要点：用实时仿真器模拟被控对象(电池/电机/环境)，ECU 接真硬件测；逼近实车。\n工程：BMS/VCU 用 HIL 跑故障/边界；安全验证；省实车成本。\n坑：模型不准测不出真实问题；HIL 贵难普及。\n记忆：HIL = 用仿真替真实环境测 ECU。'],
  ['make','Makefile 变量赋值(= := ?= +=)区别？','要点：= 递归展开(用时求值)、:= 立即展开(定值)、?= 未定义才设、+= 追加。\n工程：避免 = 的意外递归用 :=；条件默认用 ?=；列表用 +=。\n坑：= 导致变量被后定义影响；+= 跨行空格。\n记忆：:= 立即，= 延迟，?= 默认，+= 加。'],
  ['make','Make 的伪目标与特殊目标？','要点：.PHONY 声明非文件目标；.SECONDARY 防中间文件删；clean/all 常用 PHONY。\n工程：防同名文件误判；.SECONDARY 防删中间文件；多目标组织。\n坑：clean 没 PHONY 遇同名文件不执行；特殊目标配错。\n记忆：PHONY = 假的(非文件)目标。'],
  ['make','Make 自动变量全集？','要点：$@ 目标、$< 首依赖、$^ 全部依赖(去重)、$+ 全依赖(不去重)、$? 比目标新的依赖、$* 模式词干。\n工程：模式规则必用；配合自动化编译；避免重复写名。\n坑：混淆 $^ 与 $+ 去重与否；模式词干 $* 用错。\n记忆：自动变量 = 省写文件名的占位符。'],
  ['make','自动依赖生成(-MMD)细节？','要点：gcc -MMD -MP 编译同时出 .d(依赖头文件)，Makefile include 之，改头精准重编。\n工程：避免改头不重编的经典坑；配合 -MT 指定目标名。\n坑：忘了 include .d 仍全量或漏编；.d 路径错。\n记忆：-MMD = 让 Make 知道头文件依赖。'],
  ['make','递归 Make 的危害与替代？','要点：顶层 make 调子目录 make，顶层不知全局依赖，无法全局增量/并行，改一处可能漏编或全量。\n工程：大项目用非递归单 Makefile + include 子 Makefrag，依赖全局可见。\n坑：子 Make 依赖错漏编；并行递归竞态。\n记忆：递归 Make = 各扫门前雪，漏编风险。'],
  ['make','Make 的函数常用？','要点：wildcard(找文件)、patsubst(换后缀)、foreach(遍历)、filter(过滤)、shell(执行)、call(参数化)。\n工程：自动化源列表/路径转换；减少手写；call 抽公共规则。\n坑：wildcard 不含生成文件；函数嵌套难读。\n记忆：Make 函数 = 文本处理帮手。'],
  ['make','静态模式规则？','要点：`objs: %.o: %.c` 显式限定作用对象的一组模式规则，报错明确、可控。\n工程：大型项目用它精确控制哪些文件走规则；比隐式规则安全。\n坑：模式不匹配无声不编；作用对象写错。\n记忆：静态模式 = 圈定范围的模式规则。'],
  ['make','Make 并行(-j)的依赖正确性？','要点：-j 按依赖图并发，依赖写错竞态/错结果；输出交错用 -O；递归 Make 并行危险。\n工程：依赖图写全才敢 -j；大项目提速数倍；非递归结构佳。\n坑：假依赖导致并发错；order-only 误用。\n记忆：-j = 按图并发，图错就乱。'],
  ['make','order-only 依赖？','要点：只在目标不存在时建、不触发重编(如目录)，用 `|` 分隔；避免目录时间戳引发全量重编。\n工程：输出目录用 order-only；时间戳类依赖用普通。\n坑：误把目录当普通依赖每次重编；遗漏目录不存在失败。\n记忆：order-only = 在不在，不在才建。'],
  ['make','Make 的条件与包含？','要点：ifeq/ifdef 条件控制；include/-include 包含子 Makefile(.d 用 -include 容错)。\n工程：按平台/配置分支；子模块用 include 拼装。\n坑：-include 吞错误漏配；条件变量未定义。\n记忆：条件+包含 = Make 的 if 与 import。'],
  ['make','交叉编译 Makefile 完整要点？','要点：CC=$(CROSS)gcc、AR/RANLIB 对应、--sysroot 指目标库、LD 单独链接脚本、CFLAGS 加 -mcpu/-mfpu。\n工程：不碰主机库；路径全指目标；烧录用 elf/bin。\n坑：混主机头/库编出不能跑；FLAGS 与目标架构不符。\n记忆：交叉 Make = 全指向目标，不碰主机。'],
  ['make','目标特定变量？','要点：给某目标设局部变量(`target: var=val`)，该目标及规则内生效，不影响全局。\n工程：不同目标不同编译选项；局部覆盖。\n坑：误以为全局生效；作用域理解错。\n记忆：目标变量 = 此目标专属配置。'],
  ['make','干净构建 vs 增量构建？','要点：clean 全删重编(慢但稳)；增量只重编变更(快)；依赖不全会增量漏编。\n工程：发布前常 clean 验证；开发用增量；CI 可增量缓存。\n坑：依赖不全增量漏编致诡异；clean 太频繁慢。\n记忆：clean 稳，增量快，依赖要准。'],
  ['make','如何调试 Makefile(不重编)？','要点：`make -d` 看决策、`make -n` 干跑打印、`make -p` 看数据库；查时间戳/依赖。\n工程：不重编先查依赖是否真列出、时间戳；-n 验命令正确。\n坑：只看结果不查依赖；.d 没 include 致依赖不全。\n记忆：调 Make = -n 看命令，-d 看决策。'],
  ['compiler','-O0/-O1/-O2/-O3/-Os/-Oz 全解？','要点：O0 不优化(易调但慢大)、O1 基础、O2 性能(常用)、O3 激进(向量化)、Os 体积、Oz 更小。\n工程：调试 O0、量产 O2/Os；性能热点局部 O3；实时算 WCET。\n坑：O3 体积爆/UB 暴露；O0 体积大不能量产。\n记忆：O 级 = 优化力度档位。'],
  ['compiler','未定义行为被优化放大？','要点：有 UB 的代码在 -O2 下编译器按不会发生假设做激进优化，行为可能与直觉相反。\n工程：写标准合规代码；开 -fsanitize=undefined 查 UB；避免依赖测过没问题。\n坑：O0 正常 O2 炸，根因是 UB；难查。\n记忆：UB + 高优化 = 意外行为。'],
  ['compiler','严格别名与类型双关？','要点：C 禁止不同类型指针别名同对象(除 char)；类型双关用 memcpy/union 合法，强转指针读是 UB。\n工程：取 float 位用 memcpy；寄存器双关用 union；勿强转指针。\n坑：强转指针读被优化掉；跨端 union 解读异。\n记忆：双关用 memcpy/union，别强转指针。'],
  ['compiler','__attribute__ 常用全集？','要点：packed/aligned/section/weak/noreturn/noinline/always_inline/used/visibility；移植关键。\n工程：寄存器映射 packed+volatile；中断向量 weak；放指定段 section。\n坑：packed 非对齐访问 fault；weak 误覆盖。\n记忆：attribute = 给编译器的特殊指令。'],
  ['compiler','内联汇编(asm)用法与风险？','要点：asm volatile 写指令、含输出/输入/破坏列表(clobber)；用于特殊寄存器/barrier/原子。\n工程：WFI/DMB/读特殊寄存器；破坏列表漏写致编译器误优化。\n坑：clobber 漏列致错；跨编译器语法异难移植。\n记忆：内联汇编 = 在 C 里插机器指令。'],
  ['compiler','LTO 与 PGO 组合？','要点：LTO 跨文件优化、PGO 按真实热点重排；组合固件更小更快，但构建慢需两遍。\n工程：性能/体积敏感固件用；收集代表负载；可复现注意随机。\n坑：PGO 负载不具代表优化偏；构建时间翻倍。\n记忆：LTO+PGO = 全量+按实际优化。'],
  ['compiler','浮点选项(-mfloat-abi/-mfpu)？','要点：-mfloat-abi=soft/softfp/hard；-mfpu 指定 FPU 类型；有 FPU 用 hard 提速。\n工程：有 FPU 用 hard；库与目标须一致否则链接/运行错。\n坑：库硬浮点、应用软浮点混用崩；没 FPU 用 hard 炸。\n记忆：浮点 ABI = 用不用 FPU、怎么传参。'],
  ['compiler','栈保护(-fstack-protector)？','要点：函数栈放金丝雀，返回前校验防溢出覆盖返回地址；安全相关开。\n工程：固件开 -fstack-protector-strong；配合 NX/ASLR(若有)。\n坑：关保护+溢出被利用；strong 漏某些。\n记忆：栈保护 = 栈底的哨兵。'],
  ['compiler','符号可见性(-fvisibility)？','要点：默认符号全局可见，--fvisibility=hidden 默认隐藏只导出显式，减二进制/提速/降耦合。\n工程：库/固件用 hidden 减暴露；导出用 default；链接快。\n坑：误 hidden 致需要的符号不可见；跨模块调用失败。\n记忆：可见性 = 默认关门，按需开窗。'],
  ['compiler','编译器内建(__builtin_)？','要点：编译器内置高效实现：__builtin_expect(分支预测)、__builtin_popcount、__sync 原子、__builtin_trap。\n工程：likely/unlikely 用 __builtin_expect；原子用 __sync/__atomic；优化提示。\n坑：滥用 expect 反优化；原子语义理解错。\n记忆：内建 = 编译器的秘密武器。'],
  ['compiler','诊断与 -Werror 策略？','要点：-Wall -Wextra 开常用警，-Werror 警转错；量产常放宽防新版误伤，开发严。\n工程：CI 开发期 -Werror；发布可降；针对性 suppress。\n坑：全 -Werror 随编译器升级新警误伤；忽略关键警漏 bug。\n记忆：警告策略 = 开发严，发布稳。'],
  ['compiler','整型提升与 usual arithmetic conversion？','要点：小整型(<int)运算先提为 int；混合有/无符号按规则转，易生 UB/意外结果。\n工程：位运算注意提升；有符号无符号混用小心；避免依赖隐含转换。\n坑：uint8 运算提 int 后赋值截断；有/无符号比较反转。\n记忆：小类型先提 int，混符号要小心。'],
  ['compiler','GHS/TASKING 特有与 GCC 差异？','要点：GHS 用 #pragma ghs 系列(优化/段)、TASKING 用 LSL 链接；与 GCC 的 __attribute__/pragma 不完全对应。\n工程：移植要重写属性与链接脚本；MISRA/优化对齐；车规认证版。\n坑：直接搬 GCC attribute 商用编译器不认；链接脚本语法异。\n记忆：商用编译器 = 语法/链接都不同，要重写。'],
  ['compiler','车规为什么必须用认证编译器？','要点：ISO 26262 Part 8 §11 要求论证工具置信度(TCL)，未认证需自建资质包；GHS/TASKING 经 TÜV 认证到 ASIL D/SIL4。\n工程：直接用语认证版省资质论证；GCC 需资质包+大量验证证据。\n坑：以为 GCC 能直接上车规；资质包不全过不了审。\n记忆：认证编译器 = 持证上岗。'],
  ['cmake','现代 CMake 目标为中心？','要点：用 add_library/add_executable 建目标，target_* 绑属性，依赖自动传播；告别全局 include/flag。\n工程：库只暴露 PUBLIC 头；应用 link 库即得传递；可复现。\n坑：仍用 include_directories 全局污染；target 属性设错泄漏。\n记忆：现代 CMake = 以 target 为中心。'],
  ['cmake','PUBLIC/PRIVATE/INTERFACE 精解？','要点：PRIVATE 仅自己用、INTERFACE 仅使用方、PUBLIC 双方；控制依赖/头传播。\n工程：正确设避免头泄漏/耦合；库头用 PUBLIC 给使用方。\n坑：误 INTERFACE 致链接缺；误 PUBLIC 头泄漏。\n记忆：三词 = 谁看得见。'],
  ['cmake','生成器表达式($<...>)常见？','要点：生成期按配置/编译器求值：如 $<CONFIG:Debug>、$<CXX_COMPILER_ID:GNU>、条件源/flag。\n工程：多配置(Debug/Release)差异用；交叉编译条件选；避免 if 早求值错。\n坑：在 CMake 变量(非生成器)里用无效；语法错难查。\n记忆：生成器表达式 = 生成时才决定的值。'],
  ['cmake','find_package 的 CONFIG vs MODULE？','要点：CONFIG 找 <Pkg>Config.cmake(库自带)、MODULE 找 Find<pkg>.cmake；找不到报缺。\n工程：用 CONFIG 找现代库；自写 Find 模块找老库；REQUIRED 强依赖。\n坑：库没装 CONFIG 模式失败；大小写/路径错。\n记忆：find_package = 找库的两种方式。'],
  ['cmake','toolchain.cmake 与交叉编译？','要点：设 CMAKE_SYSTEM_NAME/CMAKE_C_COMPILER/sysroot，cmake -B --toolchain= 指定；不碰主机。\n工程：固件交叉编译标配；团队共享 toolchain 文件；与 build 分离。\n坑：toolchain 里设 CFLAGS 无效(应用 target)；sysroot 错。\n记忆：toolchain = 交叉编译的总开关。'],
  ['cmake','CMake Presets 是什么？','要点：CMakePresets.json 定义配置/工具链/选项，团队一键 `cmake --preset=`，减少手敲 -D。\n工程：多配置/多平台统一；CI 与本地一致；车规可复现。\n坑：Presets 版本与 CMake 不匹配；路径相对错。\n记忆：Presets = 团队共享的构建配方。'],
  ['cmake','FetchContent vs find_package vs add_subdirectory？','要点：FetchContent 配置期拉源码、find_package 找预装库、add_subdirectory 引本地子目录。\n工程：依赖源码用 FetchContent；系统库用 find_package；自有子模块 add_subdir。\n坑：FetchContent 拉不到(网络/版本)失败；版本锁不住。\n记忆：三种依赖引入方式。'],
  ['cmake','Ninja 与 Make 生成器对比？','要点：Ninja 构建图紧凑、增量/并行聪明、无递归开销；Make 通用但慢；大项目 Ninja 快。\n工程：CI/大项目用 Ninja；本地可 Make；配合 -j。\n坑：Ninja 报错不如 Make 直白；旧环境缺 Ninja。\n记忆：Ninja = 更快的生成器。'],
  ['cmake','CTest/CPack 是什么？','要点：CTest 跑测试(单测/集成)、CPack 打安装包/固件包；与 CMake 一体。\n工程：CI 用 CTest 跑测试；CPack 出发布包/OTA 包。\n坑：测试没 ADD_TEST 不被 CTest 发现；包内容漏文件。\n记忆：CTest 测，CPack 打包。'],
  ['cmake','install/export 与可复用库？','要点：install 装头/库/目标，export 导出 targets 文件供他项目 find_package 用；库交付标准。\n工程：发布 SDK 用 install+export；下游 find_package 用。\n坑：没 export 下游找不到 target；安装路径错。\n记忆：install/export = 把库交付出去。'],
  ['cmake','CMake 策略(cmake_policy)？','要点：策略控制新旧行为(如 CMP0xxx)，版本升高可能改默认；显式设避免警告/差异。\n工程：cmake_minimum_required 定基线；新行为用 cmake_policy。\n坑：版本升策略变行为异；不设置警告堆积。\n记忆：策略 = CMake 版本的兼容开关。'],
  ['cmake','对象库(object library)？','要点：add_library(x OBJECT ...) 仅编译不链接，供多处用源(如多目标共享源免重编)。\n工程：多可执行/测试共享同一源用 OBJECT；省重复编译。\n坑：OBJECT 库不能 install 直接；引用方式特殊。\n记忆：对象库 = 只编不链的源码集合。'],
  ['cmake','接口库(INTERFACE)？','要点：add_library(x INTERFACE) 无编译产物，只传属性(头/flag)，用于纯头库/配置。\n工程：header-only 库用 INTERFACE；统一编译选项经它传播。\n坑：误当普通库链接；属性设 PRIVATE 不传播。\n记忆：接口库 = 只传属性的空壳。'],
  ['cmake','add_custom_command/target 用途？','要点：在构建中插入自定义步骤(生成代码/拷贝/后处理)，如协议代码生成、bin 打包。\n工程：代码生成(协议/版本)、后处理(签名/hex)；依赖正确。\n坑：依赖列不全不重跑；输出未声明致并行错。\n记忆：custom = 构建里的自定义工序。'],
  ['cmake','CMake 常见反模式？','要点：用全局 include_directories/link_libraries、在 toolchain 设 CFLAGS、源列表 hardcode、依赖隐式。\n工程：一律 target 化、用生成器表达式、FetchContent/包管理；可维护。\n坑：全局变量污染致难移植；hardcode 路径不可复现。\n记忆：反模式 = 回到全局变量的老路。'],
  ['emake','eMake 冲突检测原理？','要点：分析每个任务的文件读/写集合，检测跨 agent 的读写冲突，串行化冲突任务保证等价于单机 make。\n工程：不丢正确性；大工程并行提速；history 文件加速调度。\n坑：冲突检测开销；history 失效时保守串行。\n记忆：eMake = 靠冲突分析保正确并行。'],
  ['emake','eMake 与 history 文件？','要点：记录上次构建任务依赖/ timing，加速本次调度与冲突判断；缓存式优化。\n工程：稳定构建靠 history 提速；clean 后历史失效慢。\n坑：history 损坏致错调度；跨机器 history 不适用。\n记忆：history = eMake 的经验缓存。'],
  ['emake','eMake 的注解(annotation)与可视化？','要点：生成构建注解(各任务耗时/依赖/agent)，可视化瓶颈；定位慢任务优化。\n工程：用注解找并行度低/慢点；调 Makefile 提升加速比。\n坑：不看注解盲目加 agent 不提速；瓶颈在单任务。\n记忆：注解 = 构建的性能录像。'],
  ['emake','eMake agent 与集群？','要点：多机 agent 并发执行任务，emake 调度；agent 数决定并行度；需网络/共享文件系统。\n工程：大单体用集群提速；agent 与构建机共享源码；CI 集成。\n坑：agent 不足加速比低；共享 FS 慢成瓶颈。\n记忆：agent = 分布式的工人。'],
  ['emake','eMake 与增量构建(分布式)？','要点：emake 基于依赖图做增量(只重编变更)，与单机一致；但分布式缓存/依赖跟踪要准。\n工程：日常开发增量快；CI 全量用集群；二者统一。\n坑：依赖不全增量漏编；分布式缓存一致性问题。\n记忆：分布式也讲增量。'],
  ['emake','eMake 与 distcc/ccache 组合？','要点：distcc 分发编译、ccache 缓存编译结果、eMake 分发整 Make 并仲裁；可叠加提速。\n工程：大工程 eMake+ccache 显著快；避免重复编译。\n坑：ccache 键不稳(路径/时间)命中低；组合配置复杂。\n记忆：三者 = 分发+缓存+仲裁组合拳。'],
  ['emake','eMake 加速比与限制？','要点：理想接近 agent 数，但受 Amdahl(串行部分/冲突)限；单任务/IO 瓶颈无法并行。\n工程：先用注解找瓶颈；并行度够才加 agent；小工程不值。\n坑：期望线性加速忽略串行部分；盲目堆 agent 浪费。\n记忆：加速比 = 受串行部分天花板限制。'],
  ['emake','eMake 与 CI/Jenkins 集成？','要点：CI 里调 emake 替代 make，集群提速；产物与单机一致可审计；适合频繁大构建。\n工程：车规/大项目 CI 用；可复现构建配合；日志注解。\n坑：CI 没配 agent 退化为单机；产物不一致审计失败。\n记忆：CI + eMake = 大构建流水线提速。'],
  ['emake','eMake 一致性怎么验证？','要点：与单机 make 结果逐字节比(可复现固件)；冲突检测保等价；CI 双跑校验。\n工程：车规可复现要求；定期比对；保证不引入非确定性。\n坑：不验证一致性误信并行结果；非确定构建无法比对。\n记忆：一致性 = 并行后结果不变。'],
  ['emake','eMake 适用与不适用边界？','要点：适用巨型单体(分钟级+)多文件 C/C++；不适用小项目/解释型/强依赖单机的任务。\n工程：按构建时长决；小项目单机快；评估 ROI。\n坑：小项目上 eMake 调度开销反慢；误用于非 Make 构建。\n记忆：eMake = 大构建才划算。'],
  ['power','MCU 低功耗模式有哪些？','要点：睡眠/停机/待机(不同芯片叫法略异)，核停、时钟关、外设选择性保留、RAM 保持与否；汽车常做休眠加唤醒。\n工程：BMS/车身控制器泊车后进低功耗，靠 RTC/唤醒脚/WKUP 唤醒。\n坑：忘了关未用外设时钟仍漏电；唤醒后时钟未重新配置跑飞。\n记忆：低功耗=关时钟+保关键+定唤醒。'],
  ['power','怎么测功耗与优化？','要点：电流分静态(休眠)与动态(运行)，用电源分析仪/万用表分段测。\n工程：降频、关未用外设、GPIO 不悬空、电源域分级。\n坑：只测平均电流漏掉峰值；悬空输入脚漏电。\n记忆：优化=降频+关闲+不悬空。'],
  ['power','唤醒源有哪些、怎么设计？','要点：外部中断脚、RTC 闹钟、看门狗、特定外设(LIN/CAN 唤醒)、掉电检测。\n工程：汽车要求任意合法事件唤醒，如 CAN/LIN 唤醒帧、按键。\n坑：唤醒源没使能导致唤不醒；唤醒后清标志否则反复唤醒。\n记忆：唤醒=源使能+标志清。'],
  ['power','低功耗与实时性矛盾怎么平衡？','要点：越深休眠唤醒越慢，硬实时事件需用浅睡加快速唤醒源。\n工程：安全相关保持部分时钟或快速唤醒外设。\n坑：为省电进深睡致安全事件响应超截止时间。\n记忆：休眠深度 vs 唤醒延迟 权衡。'],
  ['power','电池供电设备怎么延长续航？','要点：容量规划、峰值电流限制、休眠占比最大化、用高效 DCDC/LDO。\n工程：BMS 自身耗电要低，泊车数月不亏电。\n坑：只算平均功耗忽略冷启动峰值。\n记忆：续航=容量/平均，且峰值不超。'],
  ['power','GPIO 在低功耗里的坑？','要点：输出脚悬空或电平冲突会漏电；输入悬空易受扰且耗电。\n工程：休眠前把脚配为固定电平或模拟关断。\n坑：两芯片 IO 电平冲突互相灌电流。\n记忆：休眠前定好每根脚状态。'],
  ['power','电源域/多电源怎么管理？','要点：核/IO/外设分电源域，可独立关断；SBC/PMIC 管理上下电时序。\n工程：汽车 SBC 提供看门狗+稳压+唤醒一体。\n坑：上下电时序错导致 IO 闩锁或损坏。\n记忆：电源管理=时序+域控+监控。'],
  ['power','低功耗固件设计模式？','要点：事件驱动(休眠等中断)、Tickless 调度、外设用时才开。\n工程：RTOS 配 Tickless idle 自动进低功耗。\n坑：轮询忙等既耗电又占 CPU。\n记忆：事件驱动优于轮询。'],
  ['wdt','看门狗是什么、为什么需要？','要点：硬件定时器，超时未喂狗则复位 MCU，防程序跑飞卡死。\n工程：汽车 ECU 必带独立看门狗(独立时钟源)，防死机失控。\n坑：只在主循环喂狗，死在某中断或死锁仍被喂。\n记忆：看门狗=最后的安全网。'],
  ['wdt','独立看门狗 vs 窗口看门狗？','要点：独立 IWDG 自由计数超时就复位；窗口 WWDG 要求在窗口内喂，太早太晚都复位，防喂狗代码空转。\n工程：安全关键用 WWDG 或独立加窗口组合。\n坑：把 WWDG 当 IWDG 用，喂太早也复位。\n记忆：独立防卡死，窗口防假活。'],
  ['wdt','喂狗策略怎么设计才安全？','要点：喂狗前检查各关键任务与监控量健康(活着且数据合理)，而不是无脑喂。\n工程：多任务各自打卡，看门狗任务汇总健康才喂。\n坑：一个死循环喂狗掩盖其他任务挂掉。\n记忆：喂狗=综合健康确认。'],
  ['wdt','多核/多芯片怎么喂狗？','要点：主核汇总各核心跳与外设状态再喂；或各核独立看门狗。\n工程：汽车常 MCU+SBC 双看门狗，SBC 看 MCU、MCU 看 SBC 互监。\n坑：互监死锁(都等对方先喂)导致双复位。\n记忆：多狗=心跳汇总+互监。'],
  ['wdt','调试时看门狗很烦怎么处理？','要点：调试暂停时看门狗仍跑会复位，需在调试器连上时停狗或延长超时。\n工程：量产开狗、调试可配关；SBC 看门狗注意调试保持。\n坑：调试关狗忘开，出货后无保护。\n记忆：调试可关，出货必开。'],
  ['wdt','看门狗超时复位的后果与定位？','要点：复位丢失 RAM/状态，需能记录复位原因(复位标志寄存器)。\n工程：上电读复位源，区分上电/看门狗/低压；记录黑匣子定位死因。\n坑：没记复位原因反复复位无从查。\n记忆：复位原因寄存器是定位金钥匙。'],
  ['storage','MCU 存储类型有哪些？','要点：Flash(代码/常量，掉电不丢)、RAM(运行，掉电丢)、EEPROM/Data-Flash(小量参数)、备份域(电池保)。\n工程：标定参数存 Data-Flash/EEPROM，程序存主 Flash。\n坑：把参数存 RAM 掉电丢。\n记忆：存什么看是否要掉电保。'],
  ['storage','Flash 擦写特性与坑？','要点：Flash 按扇区擦(整片清为 0xFF)、按字或页写、写前必擦、有擦写寿命(1万到10万次)。\n工程：参数频繁改要磨损均衡或放 EEPROM。\n坑：跨扇区写打断导致扇区半新半旧；擦写中停电损坏。\n记忆：Flash=先擦后写+有寿命。'],
  ['storage','掉电保护怎么设计？','要点：关键写做双备份加校验和或 CRC，写新再失效旧；电容保电完成最后写。\n工程：BMS 重要计数用磨损均衡加掉电完成电路。\n坑：写到一半掉电数据结构损坏。\n记忆：掉电保护=备份+校验+保电。'],
  ['storage','磨损均衡是什么？','要点：把频繁更新的小数据分散到不同物理块，避免单块先坏。\n工程：日志/计数器/参数区常用；NVM 驱动内部做。\n坑：不做均衡某块先到寿命整片失效。\n记忆：均衡=分摊写入延寿命。'],
  ['storage','嵌入式文件系统 FatFs 怎么用？','要点：FatFs 把 SD/Flash 抽象成文件接口(open/read/write)，适合存日志/配置/升级包。\n工程：OTA 升级包、黑匣子日志落 SD 卡。\n坑：没卸载或掉电写损坏 FAT 表；长文件名与中文编码处理。\n记忆：文件系统=给裸存储加目录。'],
  ['storage','数据可靠性与校验？','要点：存关键数据加 CRC/校验和/版本号/镜像；读时校验防比特翻转。\n工程：标定参数、里程、故障码都加校验。\n坑：不校验读到翻转值当真值。\n记忆：可靠=写校验+读验证。'],
  ['storage','量产烧录与标定数据？','要点：产线把序列号/校准值/配置烧进指定区，与程序区分(不随升级擦)。\n工程：用独立 data 区或 OTP；校准值每包不同。\n坑：升级把校准区误擦导致全厂重校。\n记忆：程序与数据分区隔离。'],
  ['storage','读干扰/比特翻转/ECC？','要点：Flash 读频繁可能扰动邻位；RAM/Flash 可能单粒子翻转，关键用 ECC/奇偶。\n工程：安全数据走带 ECC 的存储；周期回读校验。\n坑：忽略翻转在极端环境积累出错。\n记忆：关键存储要 ECC/回读。'],
  ['realtime','什么是实时系统？','要点：不是快而是要在确定的期限内完成，结果正确加时间正确才算对。\n工程：汽车控制(制动/转向)是硬实时，错过截止时间出事故。\n坑：把跑得快当实时，其实是不确定。\n记忆：实时=时限内必完成。'],
  ['realtime','硬实时 vs 软实时？','要点：硬实时错过期限即失败(安全相关)；软实时偶尔错过可容忍(影音卡顿)。\n工程：ECU 控制回路硬实时，信息娱乐软实时。\n坑：把软实时需求当硬实时浪费资源或反之危险。\n记忆：硬=不可错过，软=可偶尔。'],
  ['realtime','中断延迟与响应时间？','要点：中断延迟=硬件识别+关中断时长+OS 介入；响应=延迟+ISR+可能的任务切换。\n工程：关键中断关中断时间要最短；用 OS 提供的最坏值评估。\n坑：临界区长导致中断饿死。\n记忆：延迟=硬件+关中断+OS。'],
  ['realtime','抖动(Jitter)是什么、怎么控？','要点：同一事件响应时间的不确定性就叫抖动；来源=中断抢占、调度、缓存、总线竞争。\n工程：用固定优先级加关无关中断加锁定缓存降抖。\n坑：忽略抖动把平均时间当最差。\n记忆：抖动=最坏减最好，要压最小。'],
  ['realtime','最坏执行时间 WCET？','要点：任务在最不利输入/最差路径/最热温度下的执行时间上界。\n工程：调度可行性用 WCET 而非平均；静态分析或实测取上界。\n坑：用平均时间排程，偶发超期错过死线。\n记忆：排程用 WCET 上界。'],
  ['realtime','实时调度怎么保障？','要点：固定优先级(如 RMS)、可抢占、关中断最小化、关键段用资源锁而非全局关中断。\n工程：OS 提供优先级天花板防反转；时间片给非关键。\n坑：低优先级长任务阻塞高优先级(反转)。\n记忆：实时=可抢占+优先级+短临界。'],
  ['realtime','缓存/总线对实时的影响？','要点：缓存命中与否执行时间差很大；总线被 DMA/其他核占导致不确定。\n工程：关键代码数据锁缓存(TCM/锁定)、时间触发总线。\n坑：开了缓存以为快，实际抖动更大。\n记忆：确定性大于平均性能。'],
  ['realtime','怎么验证实时性达标？','要点：示波器抓中断/任务时序、逻辑分析仪、OS 跟踪、压力测试加最差工况。\n工程：量产前跑满负载加极端温度验证死线。\n坑：空载测试通过就以为达标。\n记忆：验证要在最差工况测。'],
  ['cert','为什么车规要功能安全 ISO 26262？','要点：汽车失效可能伤人，标准按危害定 ASIL(A 到 D)等级，要求系统性加随机硬件失效可控。\n工程：BMS/转向/制动多 ASIL C/D。\n坑：以为不出错就行，其实是证明可控。\n记忆：功能安全=控失效到可接受。'],
  ['cert','ASIL 等级怎么定？','要点：严重度 S 乘暴露率 E 乘可控性 C 三维度评级，D 最严。\n工程：单点失效度量 SPFM/LPFM 有数值要求。\n坑：拍脑袋定等级导致过度设计或不足。\n记忆：ASIL=危害三维评估。'],
  ['cert','功能安全怎么落地到代码？','要点：安全机制(冗余采样、合理性校验、诊断覆盖)、安全状态(故障进安全态)、故障注入测试。\n工程：电压采样冗余加比较，故障断高压或限功率。\n坑：只做了机制没测覆盖率。\n记忆：安全=机制+覆盖+安全态。'],
  ['cert','工具置信度(TCL)/认证编译器？','要点：ISO 26262 Part 8 第 11 条要求论证工具(编译器/静态分析)置信度；未认证需自建资质包。\n工程：车规用 GHS/TASKING(经 TÜV 认证 ASIL D)。\n坑：用 GCC 不认证直接上车审计不过。\n记忆：工具也要持证上岗。'],
  ['cert','A-SPICE 是什么？','要点：汽车软件过程改进和能力评定，评估开发过程成熟度(从 0 到 3 级)。\n工程：主机厂对供应商有 ASPICE 等级要求。\n坑：只重产品不重过程，过不了审核。\n记忆：A-SPICE=过程能力认证。'],
  ['cert','IATF 16949 与 APQP/PPAP？','要点：16949 是汽车质量体系；APQP 先期产品质量策划、PPAP 生产件批准，保证量产一致。\n工程：零件量产前要 PPAP 批准。\n坑：把样件当量产，一致性没验证。\n记忆：16949=质量体系+先期策划。'],
  ['cert','认证不是一次性的？','要点：变更(软硬件/工具链/供应商)要重新评估影响，做变更管理。\n工程：需求/设计/测试追溯矩阵维护。\n坑：改一行代码没重评认证失效。\n记忆：认证随变更持续维护。'],
  ['cert','怎么向面试官讲清认证？','要点：说清自己项目 ASIL 等级、做了哪些安全机制、覆盖率怎么验证、用什么流程与工具。\n工程：用具体例子(如 BMS 电压冗余诊断)。\n坑：空谈懂功能安全拿不出证据。\n记忆：认证=等级+机制+证据。'],
  ['si','信号完整性是什么？','要点：信号在板上的传输质量——是否保形、按时到、不被干扰。\n工程：高速(以太网/时钟/SPI 高频)和高可靠(车规)都关心。\n坑：低速板不在乎，高速板翻车。\n记忆：SI=信号到对地方还是变形。'],
  ['si','阻抗匹配与反射？','要点：传输线特性阻抗(常 50Ω/差分 100Ω)，源或负载不匹配会在端点反射叠加畸变。\n工程：高速线做阻抗控制加端接电阻；CAN/以太网需终端电阻。\n坑：长线不端接信号振铃误触发。\n记忆：匹配阻抗防反射。'],
  ['si','串扰是什么？','要点：相邻走线间电容/电感耦合，一条跳变在邻线感应噪声。\n工程：3W 规则(线距大于等于 3 倍线宽)、差分对紧耦合、敏感线 guard。\n坑：时钟线挨数据线串出误码。\n记忆：串扰=线间耦合，拉开或屏蔽。'],
  ['si','地弹/电源噪声？','要点：多 IO 同时翻转引起地电位波动(地弹)，电源不干净导致逻辑错。\n工程：足够去耦电容、电源平面完整、分组供电。\n坑：省去耦电容高速时偶发复位。\n记忆：电源要稳，地要实。'],
  ['si','EMC 是什么、怎么过？','要点：电磁兼容=不干扰别人也不被干扰(EMI/EMS)。\n工程：滤波、屏蔽、布局、展频、限斜率；车规有严苛 EMC 标准。\n坑：只在样机测，量产地摊辐射超标。\n记忆：EMC=滤波屏蔽布局。'],
  ['si','高速走线规则？','要点：等长(差分对内/总线间)、参考平面连续、避免 stub、控制层数。\n工程：以太网/SPI 高频走线按规则；T1 需成对。\n坑：跨分割参考平面不连续信号劣化。\n记忆：高速=等长+完整参考。'],
  ['comms','总线选型总论？','要点：按节点数/距离/速率/抗扰/成本选——板内 SPI/I2C、车控 CAN、车身 LIN、安全 FlexRay、骨干以太网。\n工程：混合架构各司其职。\n坑：为统一硬上一种总线不划算。\n记忆：没有最好总线，只有最合适。'],
  ['comms','通信矩阵/信号约定？','要点：DBC/ARXML 描述信号在帧里的位置/缩放/偏移，是 ECU 间契约。\n工程：AUTOSAR 通信用 COM/PduR 按矩阵路由。\n坑：矩阵版本不一致两 ECU 解读错位。\n记忆：矩阵=ECU 间的通信合同。'],
  ['comms','通信安全 SecOC？','要点：给 CAN 等报文加 MAC(基于对称密钥)防重放/伪造，汽车入侵防护一环。\n工程：关键控制报文走 SecOC。\n坑：密钥管理不当形同虚设。\n记忆：SecOC=给报文上指纹。'],
  ['comms','诊断协议 UDS(ISO 14229)？','要点：统一诊断服务，读故障码/数据流/刷写/例程，通过 DID/SID 交互。\n工程：产线/售后/标定都靠 UDS；DoIP 跑在以太网。\n坑：服务子功能不理解错。\n记忆：UDS=诊断万能接口。'],
  ['comms','网络管理 NM？','要点：节点协同休眠唤醒(如 AUTOSAR NM 令牌环)，全网无通信需求才进休眠。\n工程：低功耗靠 NM 协调。\n坑：NM 配错某节点唤不醒或睡不着。\n记忆：NM=全网步调一致睡醒。'],
  ['comms','容错/冗余通信？','要点：关键链路双通道或双网冗余、超时重发、CRC 校验、失效切换。\n工程：安全相关用冗余加健康监控。\n坑：冗余链路不同步切换时丢帧。\n记忆：容错=冗余+校验+切换。'],
  ['comms','通信超时与故障处理？','要点：收不到心跳或 CRC 错或连续丢帧要进降级或安全态。\n工程：BMS 与 VCU 的 CAN 断链要限速或断高压。\n坑：一味重试占满总线。\n记忆：超时=降级而非死等。'],
  ['comms','帧率/负载率？','要点：总线负载率过高延迟增大、冲突多；要算最大负载留余量。\n工程：设计时评估峰值负载低于阈值(如 CAN 70%)。\n坑：只测空载，满负载掉链子。\n记忆：负载留余量防拥塞。'],
  ['local','为什么汽车电子要国产替代？','要点：供应链安全(断供风险)、成本、本土支持、政策驱动。\n工程：BMS/MCU/PMIC 大量转向国产芯。\n坑：为替代而替代忽略可靠性。\n记忆：替代=安全+成本驱动。'],
  ['local','国产替代难点？','要点：引脚/寄存器未必兼容、工具链/生态差异、长期可靠性与车规认证数据缺、文档质量。\n工程：做 pin-to-pin 兼容评估加重新认证。\n坑：假设完全一致直接换导致不工作。\n记忆：替代先验证再替换。'],
  ['local','替代过程的工程动作？','要点：引脚比对、外设差异、启动/时钟/电源时序核对、软件抽象层隔离、回归测试。\n工程：把芯片差异封在 MCAL/驱动层。\n坑：应用层直接揉寄存器导致难迁移。\n记忆：隔离差异在底层。'],
  ['local','工具链迁移坑？','要点：国产 MCU 多用 GCC 或自研 IDE，编译选项/链接脚本/启动文件不同。\n工程：重建工程模板加 CI；验证二进制行为一致。\n坑：浮点/对齐差异导致数值不同。\n记忆：工具链=重搭+验证一致。'],
  ['local','可靠性怎么证明？','要点：AEC-Q100 车规温度/寿命、长期路试、失效率数据、功能安全论证。\n工程：小批验证再放量。\n坑：没有路试数据直接上车。\n记忆：可靠性=认证+路试数据。'],
  ['local','供应链与选型策略？','要点：双供应商、关键料号备份、评估交期/一致性/技术支持。\n工程：BOM 设计预留替代位。\n坑：单一来源断供停产。\n记忆：供应链=备份+预案。'],
  ['collab','嵌入式工程师要和哪些角色协同？','要点：硬件(原理/引脚/时序)、测试(用例/复现)、系统/架构(需求分解)、客户/主机厂(规格)、生产(可制造)。\n工程：需求变更要走评审。\n坑：闷头写代码不沟通需求错。\n记忆：协同=对齐需求再动手。'],
  ['collab','需求对接常见坑？','要点：需求模糊/矛盾/变更频繁；要确认为什么和验收标准。\n工程：需求追溯矩阵(需求对应设计对应测试)。\n坑：按自己理解做，验收时对不上。\n记忆：需求=确认 why+验收。'],
  ['collab','与硬件协同调试？','要点：问题先定位软硬边界(示波器量信号)，不甩锅；联合复现。\n工程：定义清晰接口契约。\n坑：软硬互相猜，问题拖很久。\n记忆：软硬=用仪器分边界。'],
  ['collab','跨团队/远程协作？','要点：文档化、异步沟通、代码评审、共享问题单。\n工程：用 issue/需求管理工具跟踪。\n坑：口头需求无记录变了说不清。\n记忆：协作=文档+跟踪。'],
  ['collab','怎么推动卡住的问题？','要点：明确阻塞点/责任人/期限，升级机制，给选项而非只抛问题。\n工程：定期同步会加风险清单。\n坑：等问题自己消失，错过窗口。\n记忆：卡住=升级+给选项。'],
  ['collab','文档与知识沉淀？','要点：设计文档/接口说明/踩坑记要能传承；交接不留坑。\n工程：关键设计评审留档。\n坑：只有脑子里有，人走茶凉。\n记忆：沉淀=可传承的资产。'],
  ['test','嵌入式测试金字塔？','要点：单元测试(函数级)到集成测试(模块接口)到系统测试(整机)到路试；底层占比最高性价比好。\n工程：关键算法/驱动单测覆盖。\n坑：只做系统测，底层 bug 难定位。\n记忆：测试=底层多上层少。'],
  ['test','单元测试怎么落地？','要点：针对函数写用例(正常/边界/异常)，用框架(CppUTest/GoogleTest)自动化。\n工程：CI 每次提交跑单测加覆盖率。\n坑：只测 happy path 漏边界。\n记忆：单测=覆盖边界异常。'],
  ['test','硬件在环 HIL？','要点：用实时仿真器模拟被控对象/传感器，ECU 连真实件测闭环。\n工程：汽车 VCU/BMS 联调靠 HIL 批量回归。\n坑：HIL 模型不准测不出真实问题。\n记忆：HIL=用仿真替真实环境。'],
  ['test','静态分析/ MISRA？','要点：静态扫描规则(CWE/FP/MISRA C)防未定义行为/危险写法。\n工程：车规强制 MISRA C，CI 卡规则。\n坑：一堆 suppression 不修根因。\n记忆：静态分析=防危险写法。'],
  ['test','覆盖率怎么看？','要点：语句/分支/MC-DC 覆盖率，安全相关要求高(如 MC-DC)。\n工程：CI 出覆盖率报告，盯未覆盖分支。\n坑：追求 100% 忽略关键路径。\n记忆：覆盖率=查缺补漏指标。'],
  ['test','故障注入测试？','要点：人为注入故障(断线/超压/超时/位翻转)验证诊断与安全机制。\n工程：功能安全证据来源。\n坑：只测正常路径，故障无人验。\n记忆：故障注入=验安全机制。'],
  ['test','自动化与 CI？','要点：提交即跑编译加单测加静态分析加覆盖率，门禁卡质量。\n工程：车规项目 CI 必备。\n坑：CI 配了不维护变摆设。\n记忆：CI=质量门禁自动化。'],
  ['test','路试/实车验证？','要点：实验室测不出的温度/振动/EMC/工况在实车暴露。\n工程：量产前长里程路试加极端环境。\n坑：只台架通过就量产，路上翻车。\n记忆：路试=真实世界终极验证。'],
  ['project','面试官深挖项目想听什么？','要点：你做了什么(不是团队)、难点、怎么解决、量化结果、反思。\n工程：准备 1 到 2 个最熟项目讲透。\n坑：只背项目背景不动手细节。\n记忆：深挖=我做了+难在哪+结果。'],
  ['project','怎么讲清技术难点？','要点：先背景(为什么难)到分析(根因)到方案(对比取舍)到结果(数据)。\n工程：用 STAR 结构。\n坑：堆术语无逻辑。\n记忆：难点=背景+根因+取舍+数据。'],
  ['project','量化成果怎么准备？','要点：把提升/降低/节约用数字(如调度抖动从 X 降到 Y、故障率降 Z%)。\n工程：从简历提炼可量化点。\n坑：空说很大提升无数字。\n记忆：量化=有数字的成果。'],
  ['project','遇到的最大 bug/坑？','要点：讲真事——现象/定位过程/根因/修复/预防。\n工程：展示排查方法论。\n坑：编一个经不起追问的。\n记忆：坑=真实+方法论。'],
  ['project','项目里你的决策与取舍？','要点：为什么选 A 不选 B，权衡了什么(成本/时间/可靠性)。\n工程：体现工程判断力。\n坑：说都行显得没主见。\n记忆：取舍=有理由的选择。'],
  ['project','复盘与改进？','要点：做完回头看哪些可更好，下次怎么做。\n工程：体现成长性。\n坑：只夸不反思。\n记忆：复盘=持续改进意识。'],
  ['p_gpio','GPIO 是什么、用在哪？','要点：通用输入输出脚，MCU 与外设最简接口——输入读电平、输出驱动电平、还能复用为外设功能脚(AF)。\n工程：板上按键/LED/继电器/电平检测等板级低速控制都靠它；AUTOSAR 下由 Dio/Pwm/Spi/Adc/Icu 等 MCAL 封装，应用层不直接揉寄存器。\n坑：裸机忘了开 GPIO 时钟脚不响应；浮空输入易受扰；输出类型配错(推挽当开漏)拉不高。\n记忆：GPIO = 数字世界的“手和眼”，先配方向再读写。'],
  ['p_gpio','GPIO 关键寄存器/配置有哪些？','要点：方向寄存器(输入/输出)、输出类型(推挽/开漏)、上/下拉、翻转速度、复用功能选择器(AF)。\n工程：裸机直接配这些寄存器；带 OS 时走 MCAL，改引脚映射要同步改硬件连线与配置工具。\n坑：复用功能选错脚导致外设信号没出来；开漏忘了上拉一直低。\n记忆：寄存器 = 使能 + 方向 + 类型 + 数据 + 状态 四类。'],
  ['p_gpio','GPIO 中断怎么用？','要点：外部中断多挂在 GPIO 边沿检测(上升/下降/双沿)，进 EXTI 后再分发到具体线。\n工程：中断里只置标志/存数据，重活放任务上下文，避免中断饿死其他任务。\n坑：中断里调阻塞式 API(如裸等标志)会卡死调度；边沿抖动产生多次误触发要软件去抖。\n记忆：中断要“快进快出”，像快递柜取件不逗留。'],
  ['p_gpio','GPIO 怎么配合 DMA？','要点：GPIO 本身一般无 DMA，靠寄存器或 Bit-Banding 原子翻转；真正大数据量由对应外设的 DMA 承担。\n工程：如 SPI 屏刷、ADC 采样流走各自外设 DMA，GPIO 只负责片选/控制线。\n坑：误以为 GPIO 能 DMA 而浪费时间；多脚并行刷屏应改 SPI+DMA。\n记忆：DMA 由“带 FIFO/缓冲的外设”提供，纯 GPIO 通常不参与。'],
  ['p_gpio','GPIO 常见坑？','要点：开漏输出必须外加上拉才能拉高；按键输入必须去抖(硬件 RC 或软件滤波)；驱动大电流要加驱动级/MOS。\n工程：量产前用示波器/逻辑分析仪抓真实波形，协议分析仪只验“通不通”验不出时序余量。\n坑：只看能通信就交付，温漂/EMC 下偶发错帧；浮空输入读到的全是噪声。\n记忆：可靠性 = 电平正确 + 时序余量 + 错误处理，不是“能通”。'],
  ['p_gpio','GPIO 软模拟总线和硬件外设怎么选？','要点：用 GPIO 比特翻转软件模拟 I2C/SPI 叫 bit-bang，慢且占 CPU，仅调试或脚不够时用。\n工程：成本敏感选低速单端；带宽/距离/抗扰要求高选差分或上车规总线(CAN/LIN/以太网)。\n坑：为“统一架构”硬上复杂总线，BOM 与软件都贵；bit-bang 在中断里被打断就出时序错。\n记忆：没有最好总线，只有最合适的性价比。'],
  ['p_uart','UART 是什么、用在哪？','要点：异步串行，TX/RX 两线按波特率逐字节收发，帧=起始位+数据位+停止位+可选校验，无时钟线故双方波特率须一致。\n工程：最通用的调试 console、GPS/蓝牙模块、板间点对点链路，几乎所有 MCU 都带。\n坑：只背“两根线”不背帧格式，面试一问停止位/校验就卡。\n记忆：UART = 异步=无时钟，靠约定波特率对齐。'],
  ['p_uart','UART 关键寄存器/配置有哪些？','要点：BRR 波特率分频、数据帧格式(数据位/停止位/奇偶，8N1 最常见)、FIFO/硬件缓冲、中断使能、状态位(TXE 发空/RXNE 收到/ORE 溢出/FE 帧错/PE 校验错)。\n工程：裸机配 BRR 与格式；AUTOSAR 下由 Uart/Mcu MCAL 封装。\n坑：忘了开模块时钟外设读写无效；FIFO 阈值配错丢数据。\n记忆：配置 = 波特率 + 帧格式 + 中断 + FIFO。'],
  ['p_uart','UART 中断怎么用？','要点：TXE 触发装下一字节、RXNE 触发取数、错误中断(溢出/帧/校验)须清标志否则卡死。\n工程：中断里只置标志/入队，重活放任务；常用 RX DMA 环形缓冲接日志/AT 指令流。\n坑：中断里调阻塞 API 卡死调度；不处理 ORE 溢出会一直卡接收。\n记忆：中断“快进快出”，像快递柜取件不逗留。'],
  ['p_uart','UART 怎么配合 DMA？','要点：RX 用 DMA 环形缓冲收流，TX 用 DMA 批量发，省去每字节中断。\n工程：大数据量(日志流、模块通信)必上 DMA，CPU 只搬运描述符。\n坑：DMA 缓冲区未 cache 一致性处理(或忘了 invalidate)会读到旧数据。\n记忆：DMA 把“CPU 搬数据”变成“CPU 搬指针”。'],
  ['p_uart','UART 常见坑？','要点：波特率误差超 ±2% 会累积错位；RS232 电平 ±12V 不能直接接 3.3V MCU(需电平转换)；无硬件流控高速易丢。\n工程：量产前示波器量实际波特率偏差；长距离用 RS485 差分抗扰。\n坑：FIFO 未满就读导致乱序；溢出 ORE 不处理卡死接收。\n记忆：可靠性 = 波特率准 + 电平对 + 流控当用则用。'],
  ['p_uart','UART 和 CAN/LIN 怎么选？','要点：UART 点对点无地址无仲裁，两芯片最省；多节点用带 ID 仲裁的 CAN/LIN。\n工程：板内两芯片调试/模块用 UART；车身上位用 LIN、动力安全用 CAN。\n坑：把 UART 当多节点总线硬挂多个设备会冲突。\n记忆：节点数 + 距离 + 抗扰需求 决定选哪条总线。'],
  ['p_spi','SPI 是什么、用在哪？','要点：同步四线(CLK/MOSI/MISO/CS)全双工主从，速率高(可达数十 MHz)，无地址靠 CS 选从。\n工程：Flash、屏、ADC、数字传感器等板级高速器件首选。\n坑：只背“四根线”不背 CPOL/CPHA，面试一问模式就露怯。\n记忆：SPI = 同步=有 CLK，全双工，CS 选从。'],
  ['p_spi','SPI 关键寄存器/配置有哪些？','要点：CPOL/CPHA(4 种模式)、时钟分频、数据帧长(8/16 位)、CS 片选(每从一脚或共用+地址)、DMA 使能。\n工程：AUTOSAR 下由 Spi MCAL 封装(通道/作业/序列)，应用不直接揉寄存器。\n坑：裸机忘了开 SPI 时钟；分频过大速率不达标。\n记忆：配置 = 模式 + 速率 + 帧长 + 片选。'],
  ['p_spi','SPI 中断怎么用？','要点：收发完成/TXE/RXNE/溢出中断；小数据中断即可，大数据用 DMA 搬整块。\n工程：中断里只置标志，解析放任务上下文。\n坑：中断里调阻塞 API 卡死调度。\n记忆：中断“快进快出”。'],
  ['p_spi','SPI 怎么配合 DMA？','要点：Flash 读、屏刷全靠 SPI DMA，否则 CPU 占满。\n工程：DMA 描述符指向发送/接收缓冲，传输完成中断收尾。\n坑：DMA 缓冲区 cache 未处理收旧/发脏数据；MISO 缓冲未释放拖死总线。\n记忆：DMA 把“CPU 搬数据”变成“CPU 搬指针”。'],
  ['p_spi','SPI 常见坑？','要点：模式(CPOL/CPHA)主从必须一致否则收乱；CS 时序不满足从机建立时间会丢首字节；多从共用 CLK/MOSI 注意串扰与三态。\n工程：量产前逻辑分析仪抓真实波形，验证建立/保持时间余量。\n坑：只看能通信就交付，温漂/EMC 下偶发错帧。\n记忆：可靠性 = 时序余量 + 错误处理，不是“能通”。'],
  ['p_spi','SPI 和 I2C 怎么选？','要点：SPI 快但脚多(每从一片选)；I2C 两线带地址省脚但慢且半双工。\n工程：板内高速大数据选 SPI，十几个传感器省脚选 I2C。\n坑：为省脚硬上 I2C 导致带宽不够；为高速硬上 SPI 导致布线爆炸。\n记忆：速度 vs 引脚数 的权衡。'],
  ['p_i2c','I2C 是什么、用在哪？','要点：两线(SDA/SCL)开漏+上拉，多主多从带地址，半双工，速率低(标准 100k/快速 400k/Fast+ 1M)。\n工程：板上多传感器/EEPROM/PMIC 等省脚场景首选。\n坑：只背“两线”不背开漏与上拉，面试一问为什么需要上拉就卡。\n记忆：I2C = 开漏 + 上拉 + 地址寻址。'],
  ['p_i2c','I2C 关键寄存器/配置有哪些？','要点：自身从机地址、时钟(速率)、时钟延展(Clock Stretching)允许、10 位地址、SMBus 超时、中断/DMA 使能。\n工程：AUTOSAR 下由 I2c MCAL 封装；多主环境注意仲裁。\n坑：从机地址含读写位算错导致 NACK。\n记忆：配置 = 地址 + 速率 + 延展 + 超时。'],
  ['p_i2c','I2C 中断怎么用？','要点：地址匹配/收发/仲裁丢失/NACK 中断。\n工程：中断里置标志，重活放任务上下文；多主仲裁丢失后重发。\n坑：中断里调阻塞 API 卡死调度。\n记忆：中断“快进快出”。'],
  ['p_i2c','I2C 怎么配合 DMA？','要点：块读(如 EEPROM 页)才划算，小数据轮询/中断更省；多数 MCU I2C DMA 支持有限。\n工程：大块配置下发可用 DMA。\n坑：DMA 缓冲区 cache 未处理读到旧数据。\n记忆：I2C 速率低，DMA 收益有限。'],
  ['p_i2c','I2C 常见坑？','要点：上拉电阻太大升沿慢、太小功耗大(按总线电容算)；从机时钟延展使主超时；总线锁死(从机拉低 SCL)需发 9 个时钟恢复。\n工程：量产前示波器看上升沿与的建立/保持时间余量。\n坑：地址冲突导致两从机抢答。\n记忆：可靠性 = 上拉合适 + 时序余量 + 锁死恢复。'],
  ['p_i2c','I2C 和 SPI 怎么选？','要点：I2C 省脚慢半双工；SPI 快脚多全双工。\n工程：板上十几个传感器选 I2C，高速流数据选 SPI。\n坑：为省脚硬上 I2C 带宽不够；为高速硬上 SPI 布线爆炸。\n记忆：引脚数 vs 带宽 的权衡。'],
  ['p_adc','ADC 是什么、用在哪？','要点：模数转换，把温度/电流/电压等模拟量转数字，是 BMS 电压电流采样、温度采集、传感读取的核心。\n工程：电池包每节电压、总电流、模组温度都靠 ADC 采。\n坑：只背“采样”不背分辨率与参考电压，面试一问精度来源就卡。\n记忆：ADC = 模拟→数字，精度看位数与参考。'],
  ['p_adc','ADC 关键参数/配置有哪些？','要点：分辨率(12/16 位)、采样时间(与源内阻匹配)、通道扫描序列、对齐(左/右)、参考电压 Vref、触发源(软件/定时器/外部)、DMA。\n工程：AUTOSAR 下由 Adc MCAL 封装(组/通道/采样时间)；BMS 用专用 AFE 而非 MCU ADC 采高压。\n坑：采样时间太短、源内阻大误差大。\n记忆：配置 = 分辨率 + 采样时间 + 序列 + 参考。'],
  ['p_adc','ADC 中断怎么用？','要点：EOC(单通道完)/EOS(序列完)/过采样/看门狗越限中断。\n工程：多通道定时扫描常用 DMA 搬；看门狗越限可做快速保护。\n坑：中断里调阻塞 API 卡死调度。\n记忆：中断“快进快出”。'],
  ['p_adc','ADC 怎么配合 DMA？','要点：多通道定时器触发扫描用 DMA 环形缓冲，避免每样中断，CPU 只处理整帧。\n工程：BMS 电流同步采样、电机相电流采样都靠定时器触发+DMA。\n坑：DMA 缓冲区 cache 未处理读到旧数据；采样时序不固定导致相位错。\n记忆：DMA 把“CPU 搬数据”变成“CPU 搬指针”。'],
  ['p_adc','ADC 常见坑？','要点：采样时间太短、源内阻大误差大；参考电压不稳整链不准；输入超量程烧脚；未做零偏/增益校准。\n工程：前端加抗混叠滤波、运放驱动；软件做偏移与增益校准+平均滤波。\n坑：ADC 前端无滤波混叠；热噪声未平均。\n记忆：精度 = 参考稳 + 驱动够 + 校准到。'],
  ['p_adc','SAR 和 Σ-Δ ADC 怎么选？','要点：SAR 快中精度(采样前端常用)；Σ-Δ 高精度慢(电池电压/称重常用)。\n工程：BMS 单体电压常 Σ-Δ，电流用 SAR 或分流+运放；MCU 内多 SAR。\n坑：用 SAR 采高精度小信号达不到要求；用 Σ-Δ 采快变信号跟不上。\n记忆：速度 vs 精度 的权衡。'],
  ['p_pwm','PWM 是什么、用在哪？','要点：脉宽调制，用占空比表示模拟量/功率，输出方波调占空比/频率。\n工程：电机驱动、调光、舵机、蜂鸣器、DCDC 开关控制都用。\n坑：只背“调占空比”不背频率与死区，面试一问互补输出就卡。\n记忆：PWM = 数字方波模拟功率。'],
  ['p_pwm','PWM 关键寄存器/配置有哪些？','要点：预分频+自动重装载(决定频率)、比较值(决定占空比)、对齐(边沿/中心)、输出模式(推挽/互补/死区)、故障刹车 break。\n工程：AUTOSAR 下由 Pwm MCAL 封装；电机驱动用高级定时器互补+死区。\n坑：忘了配死区导致上下桥直通。\n记忆：配置 = 频率 + 占空比 + 对齐 + 死区。'],
  ['p_pwm','PWM 中断怎么用？','要点：更新事件(计满)、比较匹配、触发中断；高频一般不进中断，靠 DMA/触发外设。\n工程：用更新事件触发 ADC 同步采样。\n坑：高频进中断占满 CPU。\n记忆：PWM 多作“不产生中断的定时源”。'],
  ['p_pwm','PWM 怎么配合 DMA？','要点：用 DMA 改比较值做任意波形/多相调光。\n工程：高级定时器可触发 ADC 同步采样，构成电流环。\n坑：DMA 改比较值时机不对产生毛刺。\n记忆：定时器是“外设同步的指挥棒”。'],
  ['p_pwm','PWM 常见坑？','要点：互补输出忘了配死区导致上下桥直通炸管；频率太低可见闪烁/可闻噪；占空比极限 0/100% 边沿异常。\n工程：电机驱动必须硬件死区+故障刹车；DCDC 注意最小导通时间。\n坑：改占空比时机不对产生毛刺干扰其他电路。\n记忆：功率级先保“不直通”再谈精度。'],
  ['p_pwm','PWM 和 DAC 怎么选？','要点：PWM 数字调占空比(需滤波得模拟)，DAC 直接出模拟电压。\n工程：低速控制 PWM 省成本，真模拟小信号用 DAC。\n坑：用 PWM 滤不出干净模拟(纹波大)；用 DAC 驱动大电流不够。\n记忆：数字功率用 PWM，精确小信号用 DAC。'],
  ['p_icu','ICU(输入捕获)是什么、用在哪？','要点：输入捕获/定时器输入单元，测量外部信号边沿的时间/脉宽/频率/占空比，也做编码器计数。\n工程：汽车转速、频率计、PWM 解码、电机编码器用。\n坑：只背“测频率”不背计数器溢出处理，面试一问大量程就卡。\n记忆：ICU = 用定时器给信号“拍照时间戳”。'],
  ['p_icu','ICU 关键寄存器/配置有哪些？','要点：捕获边沿(上升/下降/双)、预分频、捕获比较寄存器、输入滤波、DMA/中断、从模式(复位/门控/触发)。\n工程：AUTOSAR 下由 Icu MCAL 封装(边沿/脉宽/周期测量)。\n坑：预分频不匹配量程。\n记忆：配置 = 边沿 + 分频 + 滤波。'],
  ['p_icu','ICU 中断怎么用？','要点：捕获到边沿进中断读计数值，两次差值算脉宽/周期。\n工程：高频用 DMA 搬捕获值，离线算频率/占空比。\n坑：中断里调阻塞 API 卡死调度。\n记忆：中断“快进快出”。'],
  ['p_icu','ICU 怎么配合 DMA？','要点：连续捕获用 DMA 环形缓冲存时间戳。\n工程：电机编码器高速计数用 DMA 减中断。\n坑：DMA 缓冲区 cache 未处理读到旧数据。\n记忆：DMA 把“CPU 搬数据”变成“CPU 搬指针”。'],
  ['p_icu','ICU 常见坑？','要点：计数器溢出未处理导致周期算错；预分频不匹配量程(太快溢出/太慢分辨率差)；输入抖动未滤波致多触发。\n工程：软件做溢出计数扩展；硬件数字滤波去抖。\n坑：边沿方向配反得到互补错误值。\n记忆：精度 = 分频合适 + 溢出扩展 + 滤波。'],
  ['p_icu','ICU 和 PWM 怎么选/配？','要点：ICU 测输入信号参数，PWM 产生输出波形，常成对用于电机反馈(ENC 模式)。\n工程：PWM 发驱动、ICU 读编码器构成闭环。\n坑：二者时序极性配反闭环发散。\n记忆：一个发一个收，配对成闭环。'],
  ['p_can','CAN 是什么、用在哪？','要点：车载主力总线，差分两线(CANH/CANL)，非破坏性位仲裁+错误闭环+ACK，强实时高可靠。\n工程：ECU 间通信标准，动力/底盘/车身控制全靠它。\n坑：只背“差分”不背仲裁与错误帧，面试一问采样点就露怯。\n记忆：CAN = 差分 + 仲裁 + 错误闭环。'],
  ['p_can','CAN 关键寄存器/配置有哪些？','要点：位定时(同步段/传播段/相位段1/2、SJW)、验收滤波(mask+id)、错误计数(TEC/REC)、波特率、FIFO/邮箱、中断。\n工程：AUTOSAR 下由 Can/CanIf/CanTrcv MCAL 封装；滤波配错收不到或收全。\n坑：忘了开 CAN 时钟/收发器供电。\n记忆：配置 = 波特率 + 滤波 + 错误管理。'],
  ['p_can','CAN 中断怎么用？','要点：RX 收帧/TX 完/错误被动或主动切换/唤醒中断。\n工程：中断里只取帧入队列，解析放任务上下文；RX FIFO 可配 DMA 搬。\n坑：中断里调阻塞 API 卡死调度；不处理错误被动会总线关闭。\n记忆：中断“快进快出”。'],
  ['p_can','CAN 怎么配合 DMA？','要点：CAN 帧级一般无逐字节 DMA，但 RX FIFO 可 DMA 搬运整帧到 RAM，减中断负载。\n工程：高负载网关用 DMA 搬帧。\n坑：DMA 缓冲区 cache 未处理读到旧数据。\n记忆：DMA 把“CPU 搬数据”变成“CPU 搬指针”。'],
  ['p_can','CAN 常见坑？','要点：采样点一般 75%~80% 且所有节点必须一致否则满屏错误帧；验收滤波配错收不到/收全；终端电阻 120Ω 缺则反射。\n工程：量产前示波器量位宽与采样点；每根线束两端各 120Ω。\n坑：波特率不一致节点对不上；错误被动不处理总线关闭。\n记忆：可靠性 = 采样点一致 + 终端匹配 + 错误处理。'],
  ['p_can','CAN 和 CAN FD 怎么选？','要点：FD 数据段提速(可达 8Mbps)、数据场扩到 64 字节；经典 CAN 仍主流。\n工程：标定/刷写大载荷用 FD；控制命令仍经典 CAN。\n坑：FD 与经典节点混部需网桥；FD 接线要求更高。\n记忆：带宽需求决定上 FD。'],
  ['p_lin','LIN 是什么、用在哪？','要点：低成本单线(12V 开漏)串口总线，主从结构，速率低(最高 20kbps)，用于车窗/雨刮/座椅等车身非安全节点。\n工程：CAN 的下位补充，极省成本。\n坑：只背“单线”不背主从调度，面试一问为什么无仲裁就卡。\n记忆：LIN = 单线 + 主从 + 低速车身。'],
  ['p_lin','LIN 关键寄存器/配置有哪些？','要点：波特率(主节点调度表驱动)、校验(经典/增强校验和)、帧格式(同步间隔+同步字节+PID+数据+校验)、从节点无仲裁。\n工程：AUTOSAR 下由 Lin/LinIf MCAL 封装；从节点睡/唤醒由主命令。\n坑：校验和方式主从必须一致。\n记忆：配置 = 调度表 + 校验和 + 帧格式。'],
  ['p_lin','LIN 中断怎么用？','要点：接收完帧/校验错中断；从节点睡唤醒由主节点命令触发。\n工程：中断里置标志，解析放任务。\n坑：中断里调阻塞 API 卡死调度。\n记忆：中断“快进快出”。'],
  ['p_lin','LIN 怎么配合 DMA？','要点：低速小数据一般中断/轮询即可，DMA 意义不大。\n工程：主节点调度表驱动发送即可。\n坑：误用 DMA 增加复杂度无收益。\n记忆：LIN 速率低，DMA 不划算。'],
  ['p_lin','LIN 常见坑？','要点：单线电平与 MCU 3.3V 需收发器(如 TJA102x)；校验和方式主从必须一致否则丢帧；调度表时序错导致从机不应答。\n工程：供电与唤醒电路要设计好；无仲裁故主节点必须守时。\n坑：从节点不自主动发，等错主调度就失联。\n记忆：可靠性 = 收发器 + 校验一致 + 主守时。'],
  ['p_lin','LIN 和 CAN 怎么选？','要点：LIN 单线极便宜但慢、无仲裁、仅主从；CAN 差分快可靠带仲裁。\n工程：非安全车身用 LIN，动力/安全用 CAN。\n坑：把 LIN 用于安全关键节点不满足 ASIL。\n记忆：成本 vs 安全 的权衡。'],
  ['p_eth','车载以太网是什么、用在哪？','要点：以太网(车载常用 100/1000BASE-T1 单对双绞线)，IP 化通信，带宽远高于 CAN。\n工程：中央网关/智驾/刷写/诊断(DoIP)用；以太网骨干 + CAN 节点的混合架构。\n坑：只背“网线”不背 T1 与标准以太差异，面试一问为什么用 T1 就卡。\n记忆：车载以太网 = T1 单对线 + IP。'],
  ['p_eth','以太网关键配置有哪些？','要点：MAC(速率/双工/过滤/校验卸载)、MII/RMII 接口、PHY 寄存器(MDIO 配)、DMA 描述符环(收发)、中断/唤醒。\n工程：AUTOSAR 下由 Eth/EthIf MCAL 封装；PHY 通过 MDIO 配置自协商。\n坑：RMII 时钟抖动致丢包。\n记忆：配置 = MAC + PHY + 描述符环。'],
  ['p_eth','以太网中断怎么用？','要点：RX 收帧/TX 完/错误中断；现代用 DMA 描述符环+软中断收包，中断里只通知。\n工程：协议栈在软中断/任务里处理，避免中断里跑协议栈。\n坑：中断里跑重协议栈卡死其他。\n记忆：中断只“收通知”，处理放后台。'],
  ['p_eth','以太网怎么配合 DMA？','要点：收发靠 DMA 描述符环把帧直接搬进/出 RAM，零拷贝关键路径。\n工程：描述符需 cache 一致性(invalidate 收 / clean 发)。\n坑：cache 未处理收旧数据/发脏数据；描述环越界踩内存。\n记忆：DMA 把“CPU 搬数据”变成“CPU 搬指针”。'],
  ['p_eth','车载以太网常见坑？','要点：RMII 50MHz 时钟抖动致丢包；PHY 未复位/自协商失败链路起不来；描述符 cache 未处理收旧/发脏。\n工程：T1 需成对 PHY 且终端匹配；链路状态机要等自协商完成。\n坑：把标准 RJ45 直接当 T1 用(物理层不兼容)。\n记忆：可靠性 = 时钟稳 + 自协商 + cache 一致。'],
  ['p_eth','以太网和 CAN 怎么选？','要点：以太网带宽高、IP 生态丰富、适合大数流传感/刷写；CAN 确定性实时、简单可靠，适合控制命令。\n工程：车载常两者并存(以太网骨干 + CAN 节点)，各自发挥。\n坑：用 CAN 传摄像头数据带宽不够；用以太网做硬实时控制抖动大。\n记忆：带宽 vs 确定性 的权衡。'],
  ['p_flexray','FlexRay 是什么、用在哪？','要点：车载确定性高实时总线，双通道、时分多址(TDMA)+事件时隙，微秒级确定延迟。\n工程：线控底盘(转向/制动)等安全关键场景；比 CAN 更确定。\n坑：只背“双通道”不背 TDMA 调度，面试一问为什么确定就卡。\n记忆：FlexRay = TDMA + 双通道 + 确定性。'],
  ['p_flexray','FlexRay 关键配置有哪些？','要点：宏节拍/计时节拍(静态/动态段)、通道 A/B、通信周期、节点时序参数(偏移/复用)、接收滤波、错误/唤醒。\n工程：AUTOSAR 下由 Fr/FrIf MCAL 封装；参数由系统设计工具生成。\n坑：时序参数各节点必须一致。\n记忆：配置 = 周期 + 时隙 + 通道。'],
  ['p_flexray','FlexRay 中断怎么用？','要点：时隙启动/帧收/错误/唤醒中断；严格按通信调度表。\n工程：时序偏差超窗即报错；中断里只入队。\n坑：中断里调阻塞 API 卡死调度。\n记忆：中断“快进快出”。'],
  ['p_flexray','FlexRay 怎么配合 DMA？','要点：帧数据可用 DMA 搬，但时序由 CC(通信控制器)硬件保证。\n工程：软件只填发送缓冲区，硬件按时隙发。\n坑：缓冲区未 cache 一致读到旧数据。\n记忆：时序靠硬件，软件填数。'],
  ['p_flexray','FlexRay 常见坑？','要点：启动同步(冷启动节点)失败全簇不起；时序参数配错导致冲突；双通道冗余配错失冗余意义。\n工程：比 CAN 复杂成本高，非安全关键不值得；需专用设计工具。\n坑：把 CAN 思维套 FlexRay 导致调度混乱。\n记忆：可靠性 = 同步 + 时序准 + 冗余真。'],
  ['p_flexray','FlexRay 和 CAN 怎么选？','要点：FlexRay 确定实时+冗余适合线控安全；CAN/CAN FD 成本低生态广，普通控制足够。\n工程：量产车线控用 FlexRay，主流控制仍 CAN。\n坑：为“先进”硬上 FlexRay 成本爆炸。\n记忆：安全确定性 vs 成本 的权衡。'],
  ['p_sent','SENT 是什么、用在哪？','要点：SENT(单沿嵌套时序，SAE J2716)汽车传感器单向单线数字协议，用下降沿间时间编码，抗扰好成本低。\n工程：曲轴/凸轮/压力/温控传感器到 ECU 常用。\n坑：只背“单线”不背 nibble 时间编码，面试一问怎么传数就卡。\n记忆：SENT = 单线 + 时间编码 + 单向。'],
  ['p_sent','SENT 关键配置有哪些？','要点：定时器捕获下降沿时间戳、计算 nibble 时长、校验(CRC)、帧结构(同步+状态+数据 nibbles+暂停脉冲)。\n工程：多数 MCU 有 SENT 外设或 ICU 模拟；AUTOSAR 下由 Senti MCAL 封装。\n坑：时间戳分辨率不足致 nibble 误判。\n记忆：配置 = 捕获 + 解码 + CRC。'],
  ['p_sent','SENT 中断怎么用？','要点：每帧结束/校验错中断；或用 ICU 捕获边沿时间戳离线算 nibble。\n工程：中断里置标志，解码放任务。\n坑：中断里调阻塞 API 卡死调度。\n记忆：中断“快进快出”。'],
  ['p_sent','SENT 怎么配合 DMA？','要点：边沿时间戳可用 DMA 缓冲，减中断；但解码仍需软件/定时器。\n工程：高速传感器用 DMA 存时间戳流。\n坑：DMA 缓冲区 cache 未处理读到旧数据。\n记忆：DMA 存时间戳，软件解码。'],
  ['p_sent','SENT 常见坑？','要点：时间戳分辨率不足致 nibble 误判；长帧(慢通道/串行数据)时序要算准；校验错未处理致数据丢弃。\n工程：单线抗扰但仍需滤波；主节点按时隙读。\n坑：把 SENT 当双向用(它单向)。\n记忆：可靠性 = 分辨率够 + CRC 校验。'],
  ['p_sent','SENT 和 PWM/模拟怎么选？','要点：SENT 比 PWM/模拟更抗扰、带校验、信息量大，且单线省脚；缺点单向、速率有限。\n工程：发动机传感器升级常用 SENT 替代模拟。\n坑：需要回传时用不了 SENT(单向)。\n记忆：抗扰单向传感首选 SENT。'],
  ['p_dsi3','DSI3/isoSPI 是什么、用在哪？','要点：DSI3 是汽车电池监控菊花链常用标准，配合 isoSPI/电容或变压器隔离，把 AFE(如 LTC681x/MC3377x)采集的数十节电芯电压温度上报 BMS MCU。\n工程：高压电池包内跨模块通信，抗共模干扰。\n坑：只背“菊花链”不背隔离与冗余，面试一问断链怎么办就卡。\n记忆：DSI3 = 隔离菊花链 + 电池监控。'],
  ['p_dsi3','DSI3 关键配置有哪些？','要点：链路波特率、节点地址、环回/转发模式、CRC、isoSPI 电气配置。\n工程：由 BMS 软件或专用桥片驱动，MCU 不直接揉每一位；AUTOSAR 下 BswM 调度。\n坑：隔离器件参数不对通信不稳。\n记忆：配置 = 波特率 + 地址 + 环回 + CRC。'],
  ['p_dsi3','DSI3 中断怎么用？','要点：帧收完/CRC 错/超时中断；环形链路断链需诊断上报。\n工程：中断里置标志，解析放任务。\n坑：中断里调阻塞 API 卡死调度。\n记忆：中断“快进快出”。'],
  ['p_dsi3','DSI3 怎么配合 DMA？','要点：成帧数据可用 DMA 搬，但链路层由硬件/专用逻辑处理。\n工程：MCU 侧 DMA 收 AFE 上报的数据帧。\n坑：DMA 缓冲区 cache 未处理读到旧数据。\n记忆：DMA 搬帧，链路靠硬件。'],
  ['p_dsi3','DSI3 常见坑？','要点：菊花链断一环整链失联，须做环回冗余(两端都连回 MCU)；CRC/超时未处理致误采。\n工程：隔离变压器/电容参数要匹配；采样同步性影响均衡判断。\n坑：只连单向链无冗余，一节 AFE 死全盘丢数据。\n记忆：可靠性 = 环回冗余 + CRC + 同步采样。'],
  ['p_dsi3','DSI3 和板内 SPI 怎么选？','要点：DSI3/isoSPI 用差分隔离菊花链，抗扰远胜板内 SPI，适合高压电池包跨模块。\n工程：板内短距仍可用普通 SPI 连 AFE。\n坑：把板内 SPI 直接拉到高压侧会击穿。\n记忆：隔离距离决定用 isoSPI 还是 SPI。'],
  ['p_psi5','PSI5 是什么、用在哪？','要点：PSI5(外围传感器接口 5)两线制(供电+通信合一)传感器总线，曼彻斯特编码、抗扰强，常用于安全相关传感器(气囊加速度、压力)。\n工程：主节点按调度触发从节点发送。\n坑：只背“两线”不背曼彻斯特与供电叠加，面试一问怎么供通信合一就卡。\n记忆：PSI5 = 两线合一 + 曼彻斯特 + 安全传感。'],
  ['p_psi5','PSI5 关键配置有哪些？','要点：电流调制收发、曼彻斯特解码、节点地址/时隙、CRC、唤醒。\n工程：由 MCU 的 PSI5 外设或收发器+定时器实现。\n坑：时隙配错丢帧。\n记忆：配置 = 调制 + 解码 + 时隙 + CRC。'],
  ['p_psi5','PSI5 中断怎么用？','要点：帧收完/CRC 错/超时中断；主节点按调度触发。\n工程：中断里置标志，解码放任务。\n坑：中断里调阻塞 API 卡死调度。\n记忆：中断“快进快出”。'],
  ['p_psi5','PSI5 怎么配合 DMA？','要点：帧数据可 DMA 搬；解码靠硬件曼彻斯特单元。\n工程：高速安全传感用 DMA 存帧。\n坑：DMA 缓冲区 cache 未处理读到旧数据。\n记忆：DMA 搬帧，硬件解码。'],
  ['p_psi5','PSI5 常见坑？','要点：两线供电与信号叠加，电源噪声须隔离；曼彻斯特解码错需校验；时序时隙配错丢帧。\n工程：安全相关须诊断覆盖率达标。\n坑：把供电噪声当数据导致误触发。\n记忆：可靠性 = 电源隔离 + 曼彻斯特 + CRC。'],
  ['p_psi5','PSI5 和 SENT 怎么选？','要点：PSI5 两线供电通信一体、曼彻斯特抗扰、常用于安全传感器；SENT 单线纯信号、更简。\n工程：气囊/安全传感选 PSI5，普通发动机传感选 SENT。\n坑：把 PSI5 当单向纯信号用会漏供电设计。\n记忆：安全供电合一选 PSI5，纯信号选 SENT。'],
  ['c','【C基础·编译】一个 C 程序从源码到可执行文件经历哪几步？','要点：标准四阶段：预处理(preprocess)->编译(compilation)->汇编(assembly)->链接(linking)。\n工程：gcc main.c 默认一步到底；想看中间产物用 gcc -E main.c -o main.i（预处理）、gcc -S main.i -o main.s（汇编级代码）、gcc -c main.s -o main.o（目标文件）、最后 ld 或 gcc 把多个 .o 链成 a.out。\n坑：以为 gcc 直接把 .c 变成机器码——其实中间有四步，很多“奇怪报错”要分清是预处理错、编译错还是链接错。\n记忆：预处(E)→编(S)→汇(c)→链(ld)，字母顺序 E-S-c-ld 刚好记成 “ESC ld”。“'],
  ['c','【C基础·编译】预处理阶段到底做了什么？#include 和 #define 此时如何处理？','要点：预处理只做文本替换，不解释语义：展开 #include（把头文件整份贴进来）、替换宏、处理条件编译 #if/#ifdef、删除注释、添加行号标记。\n工程：#include <stdio.h> 在预处理后消失，变成几百行 stdio 的声明；你可以用 gcc -E 看到“膨胀后”的单文件，用来排查“宏展开成啥样”。\n坑：宏是纯文本替换，不是函数，参数里的副作用会被求值多次（见宏陷阱节）。\n记忆：预处理=“抄写+替换”，不产生一句机器码。'],
  ['c','【C基础·编译】编译、汇编、链接各自产出什么文件（.i/.s/.o/可执行）？','要点：.i 是预处理后的 C 文本；.s 是汇编语言；.o/.obj 是机器码目标文件（含符号表、重定位信息，尚未定址）；最后链接器把多个 .o + 库拼成可执行。\n工程：改一个 .c 只重编它自己生成 .o，再重新链接，这就是“增量编译”快的原因；Makefile 就是按此依赖关系干活。\n坑：链接阶段才报 “undefined reference”，因为此时才去别的 .o 里找函数定义。\n记忆：i(文本)→s(汇编)→o(机器码,未定址)→exe(定址完成)。'],
  ['c','【C基础·编译】main 函数的标准形式？argc/argv 是什么？嵌入式没有 OS 时 main 怎么被调用？','要点：最常见 int main(void) 或 int main(int argc, char *argv[])；返回值是退出码，0 表示正常。argv 是命令行参数字符串数组，argv[0] 是程序名。\n工程：裸机/RTOS 里没有“命令行”，通常是启动文件(startup.s)做好栈和 .data/.bss 初始化后，直接 bl main；main 里一般是个死循环 while(1){...}，不会 return。\n坑：写 int main() 旧式声明表示“参数未声明”，不是“无参”，应写 int main(void)；在 MCU 上若 main return 了，启动代码往往进一个死循环或复位。\n记忆：有 OS 时 main 是“被内核调用的普通函数”，裸机时 main 是“复位后最终落点”。'],
  ['c','【C基础·编译】声明(declaration)和定义(definition)的区别？为什么头文件里通常只放声明？','要点：声明告诉编译器“有这么个名字、是这个类型”（不分配空间）；定义真正分配空间或给出函数体。变量定义 int a; 同时也是声明；extern int a; 只是声明。\n工程：头文件里放函数原型 void foo(int); 和 extern int g_cnt;（声明），在唯一一个 .c 里写 int g_cnt; 和 void foo(int){...}（定义），这样所有包含头文件的 .c 看到的是同一份声明。\n坑：头文件里写 int g_cnt; 会被每个包含它的 .c 各定义一次，链接报 multiple definition。\n记忆：声明=“报户口”，定义=“盖房子”；头文件只报户口。'],
  ['c','【C基础·编译】头文件(.h)里放什么、.c 里放什么？为什么不能把函数体放头文件（除非 inline/static）？','要点：.h 放对外接口：函数原型、extern 变量声明、宏、typedef、结构体定义、enum；.c 放实现细节和 static 内部函数/变量。\n工程：把函数体直接写进 .h，每个包含它的 .c 都编译出一份函数体，多个 .o 里同名符号冲突（除非加 static 或 inline 让其内部链接/内联）。\n坑：以为“头文件只能放声明”，其实放结构体/宏/inline 都没问题，只是别放“会生成独立符号的定义”。\n记忆：.h=接口契约，.c=实现；契约可多读，实现只应有一份。'],
  ['c','【C基础·编译】链接时报 “undefined reference” 和 “multiple definition” 分别是什么意思？','要点：undefined reference=用了某个函数/变量但链接器在所有 .o 和库里都找不到它的定义（声明了没实现，或忘了加 .c/库）。multiple definition=同一个符号被定义了两次（头文件里放了非 static 的变量/函数体）。\n工程：前者查“是不是忘了把那个 .c 加进工程/Makefile”；后者查“是不是把变量定义写进头文件了，改成 extern 声明 + 单处定义”。\n坑：两者都是链接错不是编译错，单文件编译可能全过，最后一步才炸。\n记忆：undefined=“我要的你没给”；multiple=“你给了两份一模一样的”。'],
  ['c','【C基础·编译】什么是翻译单元(translation unit)？','要点：一个翻译单元 = 一个 .c 文件经过预处理后、所有 #include 被展开得到的那份巨大文本；编译器一次只编译一个翻译单元，生成对应 .o。\n工程：这也是为什么“跨文件”的 static 函数互相看不见——static 只在当前翻译单元可见；想跨文件共享就别加 static 或用 extern。\n坑：头文件里的 static 函数会在每个包含它的翻译单元各生成一份副本，体积悄悄变大。\n记忆：一个 .c + 它吃进去的所有头 = 一个翻译单元 = 一个 .o。'],
