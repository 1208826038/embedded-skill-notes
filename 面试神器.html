  ['c','【C基础·编译】为什么 C 项目常常“一个功能一个 .c 一个 .h”？','要点：职责单一、编译解耦、接口清晰。改一个模块只重编一个 .c，别人只需 #include 它的 .h 而不用看实现。\n工程：bms_adc.c 配 bms_adc.h，对外只暴露 BmsAdc_Read() 等少量函数；内部状态用 static 藏起来，避免全局变量满天飞。\n坑：把所有函数都塞进一个 main.c，既难维护又每次全量重编。\n记忆：一功能一文件，对外收口到 .h。'],
  ['c','【C基础·编译】静态库(.a/.lib)和动态库(.so/.dll)的区别？嵌入式为什么多用静态链接？','要点：静态库在链接时被“拷贝”进可执行文件，运行时不依赖库文件；动态库在运行时由加载器映射，多个程序共享一份。\n工程：MCU 固件没有动态加载器、没有文件系统去找 .so，所以几乎都用静态链接，所有代码最终都在一个 .bin 里。PC 端为了省内存/热更新才用动态库。\n坑：静态库只是 .o 的归档(ar)，链接时“用到的才链进来”，没被引用的目标文件不会进镜像。\n记忆：静态=链接时拷进镜像（嵌入式主流）；动态=运行时再加载（PC 主流）。'],
  ['c','【C基础·类型】C 有哪些基本整数类型？各自典型宽度？为什么“典型”不保证？','要点：char/short/int/long/long long，以及对应的 unsigned。典型宽度 8/16/32/32/64 位，但标准只规定“最小宽度”和“相对大小”，不保证具体位数。\n工程：int 在 16 位单片机上可能是 16 位、在 PC 上是 32 位；要精确位数必须用 <stdint.h> 的 int16_t/uint32_t。\n坑：写 int val=0x12345678; 在 16 位 int 上直接截断，跨平台 bug。\n记忆：只信stdint的精确宽度，别信 int 是多少位。'],
  ['c','【C基础·类型】char 到底是有符号还是无符号？为什么嵌入式要显式用 int8_t/uint8_t？','要点：C 标准规定 char 的“有/无符号由实现决定”，有的编译器 char 是 signed（范围 -128~127），有的是 unsigned（0~255）。\n工程：读一个 uint8_t 寄存器值赋给 char 再当索引/比较，符号差异会让你得到 -1 而不是 255；所以涉及字节一律用 uint8_t/int8_t 明确表态。\n坑：if(c == 0xFF) 当 c 是 signed char 且值为 255 时永远为假（它变成 -1）。\n记忆：char 的符号是“编译器说了算”，关键字节用 int8_t/uint8_t 锁死。'],
  ['c','【C基础·类型】short/int/long/long long 的最小宽度保证是多少？','要点：标准下限：sizeof(char)=1 字节；short≥16 位；int≥16 位且≥short；long≥32 位且≥int；long long≥64 位（C99 起）。关系只保证“不小于”，不保证相等。\n工程：要“至少 32 位”可用 long（但 LP64 下 long 在 64 位 Linux 是 64 位）；要“恰好 32 位”必须用 int32_t。\n坑：以为 long 一定是 32 位——Windows LLP64 下 long 仍是 32 位，Linux LP64 下是 64 位，可移植代码别假设。\n记忆：下限递增 char<short≤int≤long≤long long。'],
  ['c','【C基础·类型】为什么不能直接假设 int 是 32 位？写出可移植写法。','要点：int 宽度随平台变（16/32/64 位都有），依赖它等于 32 位会在别的平台溢出或截断。\n工程：用 uint32_t 存“协议里的 32 位字段”、用 size_t 存“对象大小”、用 int 只做“不求精确位数的循环计数”。跨平台数据结构一律固定宽度类型。\n坑：for(int i=0;i<buf_len;i++) 若 buf_len 是 size_t 且很大，i 在 16 位 int 上会回绕成死循环。\n记忆：位宽敏感处用 stdint，计数可用 int，长度用 size_t。'],
  ['c','【C基础·类型】浮点类型 float/double/long double 的区别与精度？','要点：float 通常 32 位（约 6~7 位有效十进制），double 通常 64 位（约 15~16 位），long double 实现相关（80/128 位）。\n工程：BMS 里电压电流用 float 够用但累积误差要警惕；SOC 估算常改用定点或 double 离线标定。无 FPU 的 MCU 上 double 和 float 都要软件模拟，很慢。\n坑：两个 float 直接 == 比较常失败（精度误差），要用 fabs(a-b)<eps。\n记忆：float 快但糙，double 准但慢（无 FPU 时更慢）。'],
  ['c','【C基础·类型】各整数类型的取值范围怎么算？limits.h 的 INT8_MIN 等有什么用？','要点：N 位有符号补码范围 [-2^(N-1), 2^(N-1)-1]，无符号 [0, 2^N-1]。limits.h 提供 INT8_MIN/INT8_MAX/UINT16_MAX 等宏，按当前平台给出准确边界。\n工程：做饱和运算时 if(x>INT16_MAX) x=INT16_MAX; 用宏而非手写 32767，跨平台自动正确。\n坑：手写 0x7FFF 当 INT16_MAX 在别的实现上可能错；用 limits.h 才稳。\n记忆：范围用 limits.h，别背魔数。'],
  ['c','【C基础·类型】有符号数怎么表示负数（补码）？0x80 作为有符号 char 是多少？','要点：现代 CPU 用补码：正数原样，负数 = 取反加一；补码下 0x80 作为 int8_t 是 -128（不是 128，因为它超过了有符号范围）。\n工程：读传感器 8 位补码数据(如某温度芯片)时，直接按 int8_t 接收，0x80 自动成 -128，不用自己换算。\n坑：把 0x80 当 unsigned 得出 128，当 signed 是 -128，读硬件寄存器前必须确认芯片给的是补码还是有符号。\n记忆：补码：取反+1；int8_t 的 0x80 = -128。'],
  ['c','【C基础·类型】为什么嵌入式强烈建议用 <stdint.h> 的 int8_t/uint16_t/int32_t/uint32_t？','要点：stdint.h 提供“精确宽度”类型，跨编译器/平台位数一致，写协议、寄存器映射、算法时行为可预测。\n工程：CAN 报文里一个信号占 12 位无符号，用 uint16_t 收；Flash 里存 uint32_t 序列号；这样在 16 位和 32 位 MCU 上layout 完全一致。\n坑：用 int 存协议字段，换平台后字段宽度变，解析错位。\n记忆：硬件/协议/存储涉及位宽，一律 stdint 精确类型。'],
  ['c','【C基础·类型】什么是整数提升(integer promotion)？char 参与运算为什么先变 int？','要点：C 规定：小于 int 的整数类型（char/short/位域）在表达式求值时先提升为 int（或 unsigned int），再做运算。这就是整数提升。\n工程：uint8_t a=200,b=100; int x=a+b; 这里 a,b 先提升成 int 再相加得 300，不会溢出；但若结果再赋回 uint8_t 才截断。\n坑：以为 uint8_t 运算永不溢出——提升成 int 只是中间过程，写回 uint8_t 仍可能截断。\n记忆：小整型先“长大”成 int 再算。'],
  ['c','【C基础·类型】什么是“常用算术转换”(usual arithmetic conversion)？int 和 unsigned int 相加结果类型？','要点：两个操作数类型不同时，先各自整数提升，再按规则统一成“较宽/较能表示”的类型（有符号+无符号时，若 unsigned 能覆盖有符号范围，则结果变 unsigned）。\n工程：int a=-1; unsigned b=1; if(a<b) 结果是假，因为 a 被转成很大的 unsigned（0xFFFFFFFF），比 1 大。这是经典坑。\n坑：有符号与无符号混算，结果悄悄变成无符号，负数比较/减法翻车。\n记忆：int+unsigned → unsigned，符号别忘了。'],
  ['c','【C基础·变量】变量声明、定义、初始化的区别？int a; 和 extern int a; 区别？','要点：int a; 在文件作用域是“定义”（分配空间，默认初值0）；extern int a; 是“声明”（不分配，指向前面的定义）；int a=5; 是定义并初始化。\n工程：a.c 写 int g_state;，b.c 写 extern int g_state; 即可共用同一变量；若两边都写 int g_state; 则 multiple definition。\n坑：在头文件写 int g_state; 被多 .c 包含→重复定义；应改成 extern 声明。\n记忆：extern=借用别人的，int a;=自己造一个。'],
  ['c','【C基础·变量】局部变量和全局变量的默认初值？未初始化变量读到什么？','要点：全局/static 变量若没显式初始化，编译器放 .bss 段，运行时统一清零；局部(auto)变量不初始化，其初值是栈上遗留的“垃圾值”，读它是未定义行为。\n工程：int sum; 在函数里直接 += 累加，若忘了 =0，结果 = 随机数 + 累加，极难查；务必 int sum=0;。\n坑：以为“局部变量默认是 0”——只有全局/static 才是，局部绝不是。\n记忆：全局/static=0，局部=垃圾，用前务必赋值。'],
  ['c','【C基础·变量】const 修饰变量究竟意味着什么？const int* / int* const / const int* const 区别？','要点：const 表示“不能通过这个名字改写”，但对象本身不一定真只读（可能被别人改）。const int *p：指向的内容不可改，p 可指向别处；int *const p：p 不可改指向，内容可改；const int *const p：都不可改。\n工程：函数参数用 const uint8_t *buf 表示“我只读不碰你的数据”，调用方放心传；const 还能帮编译器做优化和抓误写。\n坑：const int *p 仍可通过别的非常量指针改掉它指向的内容；const 是“编译期约定”不是“硬件只读”。\n记忆：const 靠近谁，谁不可改（左定值/右定向，记“左数右指”）。'],
  ['c','【C基础·变量】const 全局数组存在哪个段（只读）？能不能改？','要点：const 全局变量通常放 .rodata（只读数据段），链接进镜像的只读区；试图写它会触发硬件异常/段错误（取决于 MPU/MMU 是否把该区设为不可写）。\n工程：把查表用的常量数组 const uint16_t kTable[]={...}; 放 rodata，省 RAM；裸机里若没开 MPU，写它未必立刻崩，但行为是 UB。\n坑：把大常量表标 const 却想运行时改——放错段了，应去掉 const 或用 RAM 副本。\n记忆：const 全局→.rodata 只读，改它=找崩。'],
  ['c','【C基础·变量】#define 常量、const 常量、枚举常量各有什么区别？','要点：#define 是预处理文本替换，无类型无地址；const 有类型有地址（可能占存储）；enum 常量有类型(int)、编译期常量、可进调试器符号。\n工程：状态机 STATE_IDLE/STATE_RUN 用 enum 最合适（有类型、可枚举、调试可见）；数组长度宏用 #define N 100；想被取地址的只读参数用 const。\n坑：#define 宏没有类型检查，#define MAX 100+1 在 a/MAX 里展开成 a/100+1 是经典括号坑。\n记忆：宏=无类型替换，const=有类型变量，enum=有类型常量组。'],
  ['c','【C基础·变量】枚举 enum 的底层类型是什么？为什么枚举比 #define 更适合状态机？','要点：C 里枚举底层类型是 int（实现可定更宽，但至少是能容纳所有值的整型）；枚举值是命名整型常量。\n工程：typedef enum{BMS_IDLE,BMS_CHARGE,BMS_DISCHARGE} BmsState_t; 比一堆 #define 清晰，且调试器能显示名字；switch 里忘了处理某个枚举值，编译器还能警告。\n坑：enum 值可强制赋任意 int，甚至越界；不要假设它只占 1 字节（除非用 _Bool/位域或底层类型扩展）。\n记忆：枚举=带名字的 int，状态机首选。'],
  ['c','【C基础·变量】作用域有哪几种？链接属性(linkage)有哪几种？','要点：作用域(scope)：块作用域、函数原型作用域、文件作用域。链接：external（跨翻译单元可见）、internal（static 限本文件）、none（局部变量，无链接）。\n工程：函数内 int x 是块作用域无链接；文件顶 static int y 是文件作用域内部链接；普通 int z 是文件作用域外部链接（别的文件 extern 可用）。\n坑：以为“static 全局变量”不能访问——它只是“别的文件访问不到”，本文件照常用。\n记忆：作用域=在哪看得见，链接=能不能跨文件看得见。'],
  ['c','【C基础·变量】存储期(storage duration)有哪几种？','要点：自动(au­to，局部变量进出作用域生灭)、静态(static，程序全程存在)、动态分配(alloc，malloc 到 free)、线程(Thread Local，C11 _Thread_local)。\n工程：函数里想“记住上次的值”用 static int cnt=0;（静态存储期，只初始化一次）；临时缓冲用 auto；跨模块共享用外部链接静态期变量。\n坑：返回指向局部 auto 变量的指针——变量已销毁，指针悬垂。\n记忆：自动=随作用域，静态=随程序，动态=随 malloc/free。'],
  ['c','【C基础·变量】static 用在全局变量/函数/局部变量上分别是什么效果？','要点：static 全局变量/函数=内部链接，仅本 .c 可见（隐藏符号，防冲突）；static 局部变量=静态存储期，只初始化一次，函数退出后值保留。\n工程：模块内部计数 static uint32_t s_err_cnt; 其它文件改不到；helper 函数 static bool CalcCrc(...) 不暴露给外部。\n坑：以为 static 局部变量“每次进函数都重置”——它只第一次初始化，后续沿用上次值。\n记忆：static 对外=藏起来，对内局部=留得住。'],
  ['c','【C基础·变量】extern 是干嘛的？怎么跨文件用一个变量/函数？','要点：extern 声明“这个符号在别处定义”，让当前翻译单元能引用它而不自己分配空间。\n工程：a.c 定义 int g_tick;，b.c 用 extern int g_tick; 引用；函数更简单——函数声明本来默认 extern，头文件里 void foo(void); 即可被别的 .c 调用。\n坑：extern int g; 却从没在任何 .c 里定义它→链接 undefined reference。\n记忆：extern=“去别的文件找这个符号”。'],
  ['c','【C基础·运算】C 运算符优先级和结合性是什么？为什么 if(a&b==c) 是经典坑？','要点：优先级决定先算谁，结合性决定同级时从左到右还是右到左。== 优先级高于 &，所以 a&b==c 被解析成 a & (b==c)，几乎从不是本意。\n工程：位运算和条件混用时务必加括号：if((a & b) == c)。写宏和复杂条件时括号宁可多不可少。\n坑：记不住优先级就靠括号；尤其是 位运算&| 与 比较==!= 与 逻辑&&|| 之间。\n记忆：记不住优先级→全加括号，最稳。'],
  ['c','【C基础·运算】自增 ++i 和 i++ 的区别？在复杂表达式里用 i++ 有什么坑？','要点：++i 先加后用（返回加后的值），i++ 先用后加（返回加前的值，旧值）。单独成句时两者效果相同。\n工程：for(i=0;i<n;i++) 用哪个都行；但 a = arr[i++] 是“先取 arr[i] 再 i++”，很常用也清晰。\n坑：在同一条表达式里多处改 i，如 x = i++ + i++; 这是未定义行为（同一点多次修改无序列点）；结果随编译器变。\n记忆：单独用随便，同一表达式里别让 i 改两次。'],
  ['c','【C基础·运算】逻辑运算符 && || ! 的短路求值是什么？怎么利用短路避免空指针解引用？','要点：&& 左边为假就不算右边；|| 左边为真就不算右边；! 取反。这就是短路(short-circuit)。\n工程：if(p != NULL && p->len > 0) 安全——p 为 NULL 时右边不执行，不会崩；if(p==NULL || p->x==0) 同理。这是 C 里最常用的防御写法。\n坑：依赖短路里“右侧有副作用”（如 fun() 只在条件成立才调用），别把它和普通 if 混为一谈导致逻辑错。\n记忆：短路=“前面定了，后面不看了”，用来挡空指针。'],
  ['c','【C基础·运算】位运算符 & | ^ ~ << >> 各做什么？嵌入式怎么用它们操作寄存器？','要点：& 与、| 或、^ 异或、~ 取反、<< 左移、>> 右移。寄存器操作典型：置位 reg |= (1u<<3); 清位 reg &= ~(1u<<3); 取某位 (reg>>3)&1; 翻转 reg ^= (1u<<3);。\n工程：配置 GPIO 方向寄存器，用 |= / &= ~ 改单个位而不动其它位；读状态用 & 掩码。务必用无符号 1u 移位，避免符号位问题。\n坑：reg |= 1<<31 当 1 是 int（有符号）时左移进符号位是 UB；写成 1u<<31。\n记忆：置位|、清位&~、取位&、翻转^。'],
  ['c','【C基础·运算】条件运算符 ?: 怎么用？和 if/else 的区别与坑？','要点：cond ? a : b 是表达式（有值），可赋值给变量；两条分支类型要兼容（寻常算术转换统一）。\n工程：int v = (x>0) ? x : -x; 取绝对值；宏里常用 ?: 写紧凑逻辑。\n坑：两分支类型不一致会被强行转换（可能丢精度）；嵌套 ?: 可读性差，多用 if/else。\n记忆：?: 是“能出值的 if”，两分支类型要一致。'],
  ['c','【C基础·运算】逗号运算符是什么？for 循环里 (i++,j++) 用的就是它吗？','要点：逗号运算符顺序求值每个子表达式，整体结果是最后一个的值。for 的 init/update 里用逗号可并列多条语句：for(i=0,j=n; i<j; i++,j--)。\n工程：在一句里做完多件事并返回最后一个：x = (f(), g(), h()); 等价于依次调用后 x=h()。\n坑：函数参数里的逗号不是逗号运算符，是分隔符，不存在“顺序求值保证”（参数求值顺序未指定）。\n记忆：逗号运算符=“都算，取最后”；只有 for 里那类是它。'],
  ['c','【C基础·运算】赋值运算符连续赋值 a=b=c 怎么结合？','要点：赋值右结合，a=b=c 解析为 a=(b=c)，先把 c 赋给 b，表达式值再赋给 a；三者类型需兼容。\n工程：a=b=c=0; 一条语句清零多个变量，常见且清晰。\n坑：if((x=5)==y) 把赋值写进比较容易看成 ==，建议分开写避免误读（有的编译器会警告）。\n记忆：赋值右结合，a=b=c 即 a=(b=c)。'],
  ['c','【C基础·运算】取地址 & 和解引用 * 运算符？&*p 和 *&a 等于什么？','要点：& 取对象地址，* 通过地址访问对象；&*p 先解引用再取地址= p 本身；*&a 先取地址再解引用= a 本身。\n工程：传参时 foo(&x) 让函数改外部 x；函数内 *p 读写该地址。理解 &* 和 *& 互抵是读复杂声明的地基。\n坑：对“不是左值”的东西取地址（如 &(a+b)）非法；对 NULL 解引用必崩。\n记忆：&* 抵消，*& 抵消（在指针合法时）。'],
  ['c','【C基础·运算】下标 a[i] 本质是什么？为什么 a[i] 与 i[a] 等价？','要点：a[i] 本质是 *(a+i)，即“首地址 + i 个元素”再解引用；因为加法交换律，*(a+i)==*(i+a)，所以 i[a] 也合法（只是别这么写）。\n工程：理解这点后指针和数组的关系就通了：p[i] 和 *(p+i) 完全一样。\n坑：a[-1] 或越界 a[100] 编译不报错，运行才炸；它不是“数组边界检查”，C 不做边界检查。\n记忆：a[i] == *(a+i)，下标就是指针加法。'],
  ['c','【C基础·运算】成员访问 . 和 -> 区别？p->x 与 (*p).x 等价？','要点：. 用于“对象本身”取成员（obj.x）；-> 用于“指向对象的指针”取成员（p->x）。p->x 完全等价于 (*p).x。\n工程：结构体变量用 .；拿到结构体指针用 ->，少写一层括号更清晰。\n坑：对普通结构体用 -> 或对指针用 . 都会编译错；先分清手上是“值”还是“指针”。\n记忆：值用.，指针用->；p->x == (*p).x。'],
  ['c','【C基础·运算】隐式类型转换规则？赋值时的“向左值类型转换”？','要点：赋值时右值先转换成左值类型（可能截断/精度丢失）；表达式里按整数提升和寻常算术转换统一类型。\n工程：double d = 1/2; 结果是 0.0（因为 1/2 是整数除法先得 0 再转 double）；要 d = 1.0/2 或 1/(double)2。\n坑：整数除法先截断再赋给 double，新手以为会得到 0.5。\n记忆：赋值看左边类型；除法先按操作数类型算再转。'],
  ['c','【C基础·运算】什么是符号扩展(sign extension)？把 int8_t 的 -1 赋给 int32_t 得到什么？','要点：把窄有符号类型拓宽成宽类型时，高位用“符号位”填满，保证数值不变，这叫符号扩展。int8_t -1(0xFF) 扩成 int32_t 得 0xFFFFFFFF（仍是 -1）。\n工程：读 SPI 来的 int8_t 温度直接赋给 int32_t 变量，符号自动扩展成正确负数，不用手算。\n坑：把 uint8_t 0xFF（255）赋给 int32_t 得 255，不是符号扩展——无符号是零扩展。混用有/无符号时结果不同。\n记忆：有符号扩=补符号位，无符号扩=补 0。'],
  ['c','【C基础·运算】强制类型转换 (type) 做什么？什么时候该用、什么时候危险？','要点：强制转换显式改变表达式的类型解释，编译期动作，不产生运行时代码（除浮点↔整型）。\n工程：把 void* 转回具体类型 (uint8_t*)buf；把寄存器地址转成 volatile 指针 (volatile uint32_t*)0x40021000。\n坑：用强制转换“压住编译器警告”却掩盖真 bug（如把 const 强转掉去改只读区）；把 int* 强转 double* 做类型双关违反严格别名规则。\n记忆：强转是“告诉编译器相信我”，别用来掩盖错误。'],
  ['c','【C基础·运算】整型提升对 uint8_t a=200; uint8_t b=a+1; 这种表达式的影响？','要点：a+1 中 a 先提升成 int（值 200），加 1 得 int 201，再赋回 uint8_t 截断（此处不溢出仍 201）；但 a+b 若超 255 写回 uint8_t 会回绕。\n工程：计数超过 255 的字节累加要先用 uint16_t 接：uint16_t s = (uint16_t)a + b; 否则中间过程虽是 int，结果写回仍截断。\n坑：误以为“uint8_t 运算在 8 位里进行”——其实中间是 int，只有最终写回才按目标类型截。\n记忆：中间是 int，落回 uint8_t 才截。'],
  ['c','【C基础·运算】有符号与无符号混用比较的坑（-1 < 0U）？','要点：有符号与无符号比较时，有符号先转成无符号；-1 变成极大的正数 0xFFFFFFFF...，于是 -1 < 0U 为假。\n工程：for(int i=get_len()-1; i>=0; i--) 当 get_len 返回 size_t 且为 0 时，i 被转成很大的无符号，循环不终止；应把循环变量也设成 size_t 或用倒序写法。\n坑：任何“有符号可能为负”的值和 size_t/unsigned 比较，都可能翻车。\n记忆：负的有符号一比无符号就变大，循环小心。'],
  ['c','【C基础·控制】if/else 的悬空 else(dangling else) 问题？怎么避免？','要点：else 总是匹配“最近未配对的 if”，缩进骗不了编译器，导致逻辑不符预期。\n工程：if(a) if(b) f(); else g(); 中 else 配的是 if(b) 不是 if(a)；要绑 if(a) 就加花括号 if(a){ if(b) f(); } else g();。\n坑：靠缩进判断 else 归属——编译器不看缩进，只看配对。\n记忆：else 跟最近 if，有歧义就加 {}。'],
  ['c','【C基础·控制】switch 为什么只能整数/枚举？case 必须是常量？fall-through 是什么、怎么处理？','要点：switch 的判别表达式必须是整数或枚举类型，case 标签必须是编译期整型常量。C 的 case 执行完不会自动跳出，会“穿过”到下一个 case，这叫 fall-through。\n工程：多值共用一段处理可故意贯穿：case 1: case 2: do_xy(); break;；其它情况每个 case 末尾显式 break；用 /* fall through */ 注释标出故意贯穿。\n坑：忘了写 break 导致意外贯穿，是 C 最常见逻辑 bug 之一。\n记忆：switch 只吃整数，case 要常量，break 防贯穿。'],
  ['c','【C基础·控制】for 循环的执行顺序？for(;;) 是什么？','要点：for(init;cond;update) 顺序：先 init 一次→判 cond→真则执行体→update→再判 cond…；三个都可省略。for(;;) 即“无初值无条件无更新”= 永久循环。\n工程：裸机 main 里 while(1) 或 for(;;) 做主循环；for(int i=0;i<N;i++) 是最常用计数循环。\n坑：在 cond 里写赋值（for(;x=f();)）容易看成比较，建议分开。\n记忆：for=一次初值+每轮判+每轮更新；for(;;)=死循环。'],
  ['c','【C基础·控制】while 和 do-while 的区别？至少执行一次的场景？','要点：while 先判后执行（可能一次不执行）；do-while 先执行后判（至少执行一次）。\n工程：菜单“至少显示一次再问是否继续”用 do{ show(); }while(again());；读传感器至少采一次再判有效用 do-while。\n坑：把 while 当 do-while 用，条件初始就不满足时少执行一次，逻辑漏。\n记忆：while 可能零次，do-while 至少一次。'],
  ['c','【C基础·控制】break 和 continue 在循环里的作用？在 switch 里 break 干嘛？','要点：break 立即结束整个循环/switch；continue 跳过本次剩余、进入下一轮（对 while 是重判条件，对 for 是先 update 再判条件）。\n工程：找满足条件的元素找到就 break；跳过非法项用 continue（如 for 里 if(bad) continue;）。switch 里 break 是跳出 switch，不是循环。\n坑：在 switch 里用 continue 非法（continue 只用于循环）；在嵌套循环里 break 只破最内层。\n记忆：break=全停，continue=跳这次；switch 里 break 破 switch。'],
  ['c','【C基础·控制】goto 真的不能用吗？什么时候（错误处理统一释放）可以用？','要点：goto 不禁止，但易乱；唯一被广泛接受的用法是“多层退出时统一清理资源”：函数尾部放 cleanup: 标签，出错处 goto cleanup; 释放后 return。\n工程：打开三个资源，任一步失败要按顺序释放前面的——用 goto fail; 跳到对应释放点，比层层 if/else 干净。Linux 内核大量用这种写法。\n坑：用 goto 在逻辑里乱跳、向前跳形成循环，极难维护；正常流程别用。\n记忆：goto 只推荐“错误统一清理”一处用。'],
  ['c','【C基础·控制】三目运算符的求值顺序与类型？为什么两分支类型要一致？','要点：cond 为真算 a 否则算 b，整体类型是 a/b 经寻常算术转换后的公共类型；两分支都得是可求值表达式。\n工程：return (err)? -1 : 0; 简洁返回；但分支一边是指针一边是 0（NULL）也行，类型要匹配。\n坑：两分支类型差太多（如 int 与 double）会统一成 double，可能非预期；且 ?: 里两分支都“会被求值其中一个”，不像 if 只走一条。\n记忆：?: 二选一有公共类型，类型别差太远。'],
  ['c','【C基础·函数】函数声明(原型)和定义的区别？为什么先声明后使用？','要点：原型只写“返回类型 名字(参数类型)”，无函数体；定义带函数体。编译器遇到调用时要有可见的原型，才知道参数怎么传、返回值怎么收。\n工程：把原型放 .h，调用方 #include 后即可在定义之前调用；若没原型，老式编译器会猜参数（危险），现代编译器直接报错。\n坑：原型参数类型写错（如少 const、类型不符）和定义不一致，链接或运行期出问题。\n记忆：原型=签名，定义=实现；调用前要有签名。'],
  ['c','【C基础·函数】C 的函数参数是“值传递”还是“引用传递”？怎么通过指针模拟“改外部变量”？','要点：C 全部是值传递——调用时把实参的值拷一份给形参；函数里改形参不影响外部。要改外部变量，传它的地址（指针），在函数里通过 *p 改。\n工程：void swap(int*a,int*b){int t=*a;*a=*b;*b=t;} 调用 swap(&x,&y); 才能真交换；否则只是交换副本。\n坑：以为“传数组名就是引用”——其实传的是首地址的值（指针拷贝），靠它改数组元素是有效的（因为指向同一块内存）。\n记忆：C 全是值传递；想改外部就传地址。'],
  ['c','【C基础·函数】函数返回一个大结构体，开销如何？返回指针/改传入指针更好？','要点：返回结构体默认按成员整体拷贝（可能压栈、复制多字节）；结构体很大时开销明显。更优：传指针进函数让调用方提供缓冲区，或返回指针（但别返回局部变量地址）。\n工程：void Bms_GetCell(BmsCell_t*out, int idx); 比 BmsCell_t Bms_GetCell(int idx); 省一次大拷贝，也避免返回栈对象。\n坑：返回指向局部 struct 的指针——函数退出后栈失效，悬垂。\n记忆：大结构体传指针出参，别 return 局部地址。'],
  ['c','【C基础·函数】递归函数的代价？嵌入式为什么慎用递归？','要点：每次递归调用都新建栈帧（参数+返回地址+局部变量），深度大时栈空间线性增长，且 C 一般无尾递归优化。\n工程：遍历树/快排等用递归简洁，但 MCU 栈只有几 KB，深度不可控的递归极易栈溢出；嵌入式常用“显式栈+循环”或限定深度改写。\n坑：递归出口写错→无限递归→栈溢出复位，现场难复现。\n记忆：递归优雅但吃栈，MCU 上深度要可控。'],
  ['c','【C基础·函数】多文件项目里函数怎么声明？.h 放原型，.c 放定义？','要点：在 .h 写函数原型（extern 默认），在恰好一个 .c 写定义；谁要用就 #include 该 .h。\n工程：math_util.h 声明 int clamp(int v,int lo,int hi);，math_util.c 实现它；main.c 包含头文件即可调用。\n坑：两个 .c 都写了同一函数的非 static 定义→multiple definition。\n记忆：原型进 .h，实现进一个 .c。'],
  ['c','【C基础·函数】inline 函数是什么？和宏比有什么优势？','要点：inline 建议编译器把函数体“就地展开”免函数调用开销；它有类型检查和作用域，不像宏那样纯文本替换，无多次求值副作用。\n工程：static inline uint16_t swap16(uint16_t x){return (x<<8)|(x>>8);} 替代宏，安全又高效，常放头文件。\n坑：inline 只是“建议”，编译器可忽略；且 inline 函数若取地址或太复杂就不展开，仍生成一份定义（故常配 static 防 multiple definition）。\n记忆：inline=有类型的宏，没副作用，常配 static。'],
  ['c','【C基础·函数】函数指针基础：怎么声明、赋值、调用？回调(callback)是什么？','要点：返回类型 (*名字)(参数表) 声明函数指针；赋值时名字=函数名（函数名即地址）；调用 (*p)(args) 或 p(args)。回调=把函数指针当参数传给别的函数，让它在合适时机“回头调用你”。\n工程：void Timer_SetCb(void(*cb)(void)) 注册中断回调；状态机表 const StateFn_t tbl[]={s_idle,s_run}; 用函数指针数组跳转。\n坑：函数指针类型（参数、返回）必须完全匹配，否则调用崩溃；先判空再调防 NULL。\n记忆：函数指针=“能当变量传的函数”，回调靠它实现。'],
  ['c','【C基础·函数】变参函数（printf 类）怎么实现？va_list/va_start/va_arg/va_end？风险？','要点：用 <stdarg.h>：va_list 遍历参数；va_start 定位到第一个可变参数；va_arg 按指定类型逐个取；va_end 收尾。printf 靠格式串里的 % 知道类型和个数。\n工程：自己写 log_printf(const char*fmt, ...) 时，必须让调用方通过格式串告知类型，否则 va_arg 读错类型会崩。\n坑：实参数/类型与格式串不符（如 %d 却传 float）是未定义行为；变参函数无类型检查，极易出错。\n记忆：变参靠格式串自报类型，对不上就崩。'],
  ['c','【C基础·函数】函数原型里 void foo(void) 和 void foo() 的区别？','要点：void foo(void) 明确“无参数”；void foo() 是旧式“参数未声明”（不检查参数），不是“无参”，C++ 里才等价。\n工程：写无参函数务必用 (void)，避免误传参数编译期不报错。\n坑：foo() 在 C 里不阻止 foo(123) 这种误调用，混入参数隐患。\n记忆：无参写 (void)，不是 ()。'],
  ['c','【C基础·函数】静态函数 static int helper() 有什么用？','要点：static 函数具内部链接，仅本 .c 可见，不进全局符号表，避免和其它文件的同名函数冲突。\n工程：模块私有的小工具函数加 static，既是封装也能让链接器内联/裁剪它，减小镜像。\n坑：以为 static 函数“性能更快”——主要价值是封装和避免符号冲突，不是速度。\n记忆：模块内部helper加static，对外不可见。'],
  ['c','【C基础·数组】一维数组怎么定义、初始化？int a[5]={1,2} 剩下元素是什么？','要点：int a[5]; 定义 5 个 int；初始化列表不足时，剩余元素自动置 0（这一点和局部变量不同，是初始化规则给的）。\n工程：uint8_t buf[64]={0}; 是全清零的安全写法；int tbl[4]={1,2} 得 {1,2,0,0}。\n坑：int a[5]={1,2}; 没初始化的部分“是 0”仅因为给了初始化列表；若写 int a[5]; 没列表，局部数组是垃圾。\n记忆：有初始化列表，缺的自动补 0；没列表局部是垃圾。'],
  ['c','【C基础·数组】数组名在大多数情况下退化为指针，哪些情况不退化？','要点：数组名在 sizeof(arr)、取地址 &arr、以及用字符串字面量初始化字符数组这三种情况不退化，仍代表“整个数组”。\n工程：size_t n = sizeof(arr)/sizeof(arr[0]); 靠 sizeof(arr) 拿到真实字节数；&arr 类型是“指向数组的指针”，+1 跳整个数组。\n坑：把数组当参数传进函数后 arr 已退化成指针，sizeof(形参) 拿的是指针大小(4/8)不是数组长度。\n记忆：sizeof/&/初始化 三处数组名不退化。'],
  ['c','【C基础·数组】数组下标 a[i] 与指针 *(a+i) 关系？指针算术单位？','要点：a[i] 即 *(a+i)；指针算术按“指向类型的大小”为单位，p+1 移动 sizeof(*p) 字节，不是 1 字节。\n工程：遍历 int a[10]：for(p=a;p<a+10;p++) *p 处理每个元素；理解单位后才能正确做指针运算。\n坑：对 char* 和 int* 做 p+1 移动的字节数不同，混用会错位。\n记忆：指针+1 = 跳一个元素(类型宽)，不是一字节。'],
  ['c','【C基础·数组】多维数组 int a[2][3] 在内存怎么排（行主序）？a[i][j] 地址怎么算？','要点：C 数组行主序(row-major)，a[2][3] 在内存是 a[0][0],a[0][1],a[0][2],a[1][0]...；a[i][j] 地址 = 基址 + (i*3+j)*sizeof(int)。\n工程：把二维数组当一维 buf 传给 DMA 时，行主序保证连续可用；算偏移用 i*COL+j。\n坑：以为 C 是列主序（像 Fortran）——错，C 是行主序，跨语言传矩阵要转置。\n记忆：C 行主序：先变最右下标。'],
  ['c','【C基础·数组】数组作为函数参数为什么退化成指针？怎么把数组长度传给函数？','要点：C 不允许“传整个数组”，实参数组名退化为首元素指针，函数拿到的只是指针，丢了长度信息。\n工程：惯例显式传长度：void foo(const uint8_t*buf, size_t len); 调用 foo(buf, sizeof(buf));（注意调用处 buf 还是数组，sizeof 才对）。\n坑：在函数内用 sizeof(buf) 当长度得指针大小，循环越界；长度必须另传。\n记忆：数组传参变指针，长度要单独给。'],
  ['c','【C基础·数组】变长数组 VLA（C99）是什么？嵌入式为什么谨慎用？','要点：C99 允许 int a[n]; 用运行时变量定长，叫变长数组，存在栈上。C11 起 VLA 是可选特性。\n工程：处理不定长帧偶尔方便，但栈大小固定，n 大或不可信时会栈溢出——嵌入式多禁用或限制。\n坑：VLA 长度来自外部输入且很大→直接爆栈复位；且 VLA 不能用在文件作用域或 static。\n记忆：VLA 占栈、长度不可控，嵌入式慎用。'],
  ['c','【C基础·数组】数组越界访问的后果？为什么有时“恰好能跑”更危险？','要点：C 不做边界检查，越界读写的是相邻内存（别的变量/返回地址），行为是 UB，可能立即崩也可能悄悄改坏数据。\n工程：循环条件写成 i<=N 而非 i<N 是经典 off-by-one；访问前先确认下标范围。\n坑：“测试时没崩”不代表对了——越界可能踩到无关变量，问题在别处诡异出现，最难查。\n记忆：越界是 UB，不崩≠没错，最阴险。'],
  ['c','【C基础·指针】指针变量存的是什么？地址、值、类型三者关系？','要点：指针变量存的是“另一个对象的地址”；通过地址能访问那个对象的值；指针的“类型”决定解引用时怎么解释那段内存、以及 +1 跳多远。\n工程：uint8_t *p=&reg; 存 reg 的地址；*p 读出 reg；p+1 指向下一个字节。类型让编译器知道读几个字节、怎么解释。\n坑：把 int* 强转成 float* 解引用可能读错字节数/对齐违规（且违反严格别名）。\n记忆：指针=地址+类型，类型决定读法。'],
  ['c','【C基础·指针】& 取地址和 * 解引用？int *p=&a; *p 是什么？','要点：&a 取 a 的地址；int *p=&a; 让 p 指向 a；*p 是“p 所指向的对象”，即 a 本身，读写 *p 等价于读写 a。\n工程：函数里要改外部变量，传 &a，内部用 *p 改；*p=10 等价于 a=10。\n坑：未初始化指针 p 里是随机地址，*p 立即野指针崩溃；指针定义后要先指向合法对象再用。\n记忆：& 拿地址，* 取内容；*p 就是 a。'],
  ['c','【C基础·指针】指针的类型决定什么？p+1 移动几个字节？','要点：指针类型决定解引用读/写几个字节、以及指针算术的步长。int *p; p+1 移动 sizeof(int) 字节（通常 4），char *q; q+1 移动 1 字节。\n工程：遍历字节缓冲用 uint8_t*，遍历 16 位样本用 uint16_t*；步长自动按类型走。\n坑：对 void* 做 p+1 不合法（void 无大小），要先转成具体类型指针再算。\n记忆：类型定步长，int* +1 跳 4 字节。'],
  ['c','【C基础·指针】空指针 NULL 是什么？解引用 NULL 会怎样？','要点：NULL 是值为 0 的指针常量（C23 起有 nullptr），表示“不指向任何对象”；解引用 NULL（*p 或 p->x）是 UB，几乎必然崩溃/硬件异常。\n工程：指针不用时置 NULL；使用前 if(p!=NULL) 防御；很多 API 用返回 NULL 表示失败。\n坑：NULL 不是“空对象”，解引用它不会“得到空”，而是直接崩。\n记忆：NULL=啥也不指，解它必崩，用前判空。'],
  ['c','【C基础·指针】野指针和悬垂指针是什么？怎么产生、怎么避免？','要点：野指针=未初始化、值随机的指针；悬垂指针=曾指向合法对象、但对象已销毁/释放，指针还留着旧地址。两者解引用都 UB。\n工程：free(p) 后立刻 p=NULL 把悬垂变“可判空”；返回局部变量地址得到的就是悬垂指针。\n坑：以为 free 后 p 自动变 NULL——不会，p 还是旧地址，二次使用或二次 free 都崩。\n记忆：free 后手动置 NULL，别留悬垂。'],
  ['c','【C基础·指针】指针常量(const pointer)与常量指针(pointer to const)区别？','要点：const int *p（或 int const *p）=指向常量的指针，内容不可改、p 可改指向；int *const p=指向变量的常量指针，p 不可改指向、内容可改；const int *const p 都不可改。\n工程：函数只读参数用 const uint8_t *buf；想锁死指针本身（如指向固定寄存器）用 uint32_t *const reg=&GPIO。\n坑：const 在 * 左边还是右边决定锁内容还是锁指针，记混就写反。\n记忆：const 在 * 左锁内容，在 * 右锁指针。'],
  ['c','【C基础·指针】指针数组(array of pointers)和数组指针(pointer to array)声明区别？','要点：int *p[10]; 是“10 个 int* 的数组”（[] 优先级高）；int (*p)[10]; 是“指向含 10 个 int 的数组的指针”。\n工程：字符串表 char *names[]={"a","b"}; 是指针数组；遍历二维数组行用 int (*row)[3]=a; row++ 跳一行。\n坑：漏写括号 int *p[10] 变成指针数组而非数组指针，类型完全不同。\n记忆：先有 [] 是指针数组，先有 (*p) 是数组指针。'],
  ['c','【C基础·指针】多级指针 int **pp 什么时候用？','要点：int **pp 是“指向 int 指针的指针”；典型场景：指针数组（char **argv）、需要在函数里修改一个“指针变量”本身（传指针的地址）。\n工程：void alloc_buf(uint8_t **out, size_t n){ *out=malloc(n); } 调用 alloc_buf(&p,n); 让函数把新地址写回 p。\n坑：多级指针一层层解引用，弄错层级直接踩错地址；想清楚“我要改的是值、指针、还是指针的指针”。\n记忆：想在函数里改“指针本身”才用二级指针。'],
  ['c','【C基础·指针】void* 是什么？malloc 返回 void*，泛型指针怎么用？','要点：void* 是“无类型指针”，可指向任何对象，但不能直接解引用或做指针算术（不知大小）；C 里 void* 可隐式转成任意对象指针（C++ 需强转）。\n工程：malloc 返回 void*，用法 uint8_t *p=malloc(n); 赋给具体类型即可；qsort 的比较函数参数也是 void* 通用。\n坑：对 void* 直接 *p 或 p+1 编译错——要先 (uint8_t*)p 转类型。\n记忆：void*=通用指针，用时先转具体类型。'],
  ['c','【C基础·指针】函数指针怎么声明与 typedef？用 typedef 简化函数指针类型？','要点：返回类型 (*名)(参数)；难读，用 typedef 起别名：typedef void (*TimerCb_t)(void); 之后 TimerCb_t cb; 即可声明变量。\n工程：把“指向函数的指针”类型化后，回调表、状态机跳转都清爽：const TimerCb_t cbs[3]={t1,t2,t3};。\n坑：函数指针声明的括号极易写错（*名 必须括起来），用 typedef 是最稳写法。\n记忆：函数指针先 typedef，别手写裸声明。'],
  ['c','【C基础·指针】返回局部变量的指针为什么错？栈帧销毁后地址失效？','要点：局部变量在函数栈帧里，函数返回后栈帧被回收，返回的地址指向已无效的内存；解引用得到垃圾或崩溃。\n工程：要返回数据就用 static（有局限）、malloc（调用方负责 free）、或让调用方传缓冲区指针出参。\n坑：返回 &local 或返回局部数组名，第一次可能“还能读到旧值”（没被覆盖），第二次就乱——典型的“时灵时不灵”bug。\n记忆：别 return 局部地址，栈帧一退就失效。'],
  ['c','【C基础·指针】指针算术：p++、p+n、p-q（得元素个数）、p>q 比较？','要点：p++ 移到下一元素；p+n 指第 n 个；同类型指针相减 p-q 得“中间隔了几个元素”（不是字节数）；同数组内的指针才可比较大小。\n工程：buf+n 定位第 n 字节；end-p 算剩余长度；这些是指针遍历的基石。\n坑：不同数组的指针相减/比较是 UB；p-q 结果是元素个数不是字节数（字节要再乘 sizeof）。\n记忆：指针相减得“元素个数”，不是字节。'],
  ['c','【C基础·指针】指针和数组名到底是不是一回事？','要点：不是。数组名是“数组首地址的常量”，不可 p++、不可被赋值、sizeof 得整个数组；指针是“存地址的变量”，可改指向、sizeof 得指针大小。\n工程：int a[10]; int *p=a; 此时 p 和 a 都指向首元素，但 a 是常量、p 是变量；p++ 合法，a++ 不合法。\n坑：以为“数组就是指针”——数组退化成指针只在作为表达式/参数时，数组本身不是指针对象。\n记忆：数组名=地址常量，指针=地址变量，二者不等价。'],
  ['c','【C基础·字符串】C 字符串是什么？以 \'\\0\' 结尾的字符数组？','要点：C 没有原生字符串类型，字符串是“以空字符 \'\\0\'(值为0)结尾的 char 数组”；库函数靠找 \'\\0\' 判断结束。\n工程：char s[8]="hi"; 实际存 h,i,\\0,...；strlen("hi") 数到 \'\\0\' 返回 2，不含结尾符。\n坑：char s[2]="hi"; 放不下结尾的 \'\\0\'（需要 3 字节），越界写，UB。\n记忆：字符串=字符数组+末尾\'\\0\'，长度不含\'\\0\'。'],
  ['c','【C基础·字符串】字符数组 char s[10] 和字符串字面量 "abc" 区别？字符串字面量能改吗？','要点：char s[10]="abc"; 是把字面量拷进可写数组，改 s[0] 合法；char *p="abc"; 让 p 指向只读区的字面量，改 *p 是 UB（通常崩）。\n工程：需要修改就定义数组；只想读而只想用指针省拷贝。嵌入式里字面量在 .rodata/Flash。\n坑：char *p="abc"; p[0]=\'x\'; 在开了写保护(Flash/MPU)时直接硬件错误。\n记忆：数组可改，指向字面量的指针不可改。'],
  ['c','【C基础·字符串】strcpy/strlen/strcmp/strcat 各自干嘛？常见坑？','要点：strcpy 拷贝整串(含\'\\0\')、strlen 求长度(不含\'\\0\')、strcmp 按字典序比较(0=相等)、strcat 把 src 接到 dst 末尾。它们都不检查目标缓冲区大小。\n工程：strcpy(dst,src) 当 dst 比 src 小时越界写，经典溢出漏洞；用前确保 dst 足够大。\n坑：strcmp 返回非 0 不代表“大于”，只代表“不等”；用 if(!strcmp(a,b)) 判相等才对。\n记忆：这四个都不查长度，溢出温床，改用带长度版本。'],
  ['c','【C基础·字符串】strncpy 安全吗？它不一定写 \'\\0\' 结尾的坑？','要点：strncpy(dst,src,n) 最多拷 n 字节，但“若 src 长度≥n 则不会写结尾 \'\\0\'”，导致 dst 不是合法字符串；且不足 n 时会用 \'\\0\' 填空（可能多余拷贝）。\n工程：安全写法：strncpy(dst,src,n-1); dst[n-1]=\'\\0\'; 手动补结尾，杜绝无终止串。\n坑：以为 strncpy 一定产生 \'\\0\' 结尾串——src 满 n 字节时偏偏不补，后续 strlen/strcpy 越界读。\n记忆：strncpy 不一定补\'\\0\'，自己补。'],
  ['c','【C基础·字符串】怎么安全地拷贝/拼接字符串（snprintf / 自写带长度）？','要点：最稳用 snprintf(dst,sizeof(dst),"%s",src)（返回本应写入的长度，且保证\'\\0\'结尾、不越界）；或自写 my_strcpy(dst,dstsize,src) 显式带目标大小。\n工程：嵌入式日志拼接用 snprintf 防溢出；对性能极敏感处用手写带长度的拷贝并校验。\n坑：snprintf 返回值是“本应写多少”不是“实际写多少”，用它判断是否截断要 dstsize<=ret。\n记忆：要安全用 snprintf，目标大小必须传。'],
  ['c','【C基础·字符串】字符串字面量存放在哪个段（只读）？修改它会怎样？','要点：字符串字面量通常存于 .rodata（或 Flash 的只读区），多个相同字面量可能被合并成一个；试图写它是 UB。\n工程：const char *msg="err"; 只读；要改请 char msg[]="err"; 放入可写 RAM。\n坑：两个 char *p="abc"; char *q="abc"; 可能 p==q（指向同一只读副本），改一处影响另一处。\n记忆：字面量在只读段，改它=找崩。'],
  ['c','【C基础·字符串】用指针 char *p="abc" 和数组 char s[]="abc" 区别？','要点：前者 p 指向只读字面量（改=崩），可让 p 指向别处；后者 s 是可写数组（存了一份拷贝），但 s 是地址常量不能 s=p。\n工程：函数返回字符串常量用 static const char*；函数内要改的串用局部数组。\n坑：return "abc"; 返回的是只读字面量地址（可临时用），return s（局部数组）返回的是悬垂地址（错）。\n记忆：指针版指向只读，数组版是拷贝可改。'],
  ['c','【C基础·结构】struct 怎么定义、声明变量、访问成员？typedef struct 简化？','要点：struct Point{int x;int y;}; 定义类型；struct Point p; 声明变量；p.x 访问成员。常配 typedef 起短名：typedef struct{int x;int y;} Point_t;。\n工程：typedef struct{ uint16_t volt; uint8_t soc; } BmsCell_t; 后直接用 BmsCell_t c; 定义电池单体。\n坑：C 里 struct 标签不自动成类型名，必须 struct Point p; 或靠 typedef；C++ 才可直接 Point p;。\n记忆：C 用结构体要带 struct 或 typedef 改名。'],
  ['c','【C基础·结构】结构体内存对齐为什么存在？padding 怎么产生的？','要点：CPU 按“对齐边界”访问内存更快/合法（如 4 字节 int 须从 4 的倍数地址读）；编译器在成员间插入填充字节(padding)满足对齐，结构体总大小向上取整到最宽成员对齐倍数。\n工程：struct{char a;int b;} 在 32 位下 a 占 1 字节后补 3 字节 padding 再放 b，总大小 8 而非 5；跨设备传输要小心 padding。\n坑：以为 sizeof(struct) 等于各成员之和——padding 会悄悄变大；memcpy 结构体到通信 buffer 可能因 padding 泄露/错位。\n记忆：对齐→插 padding，sizeof≠成员和。'],
  ['c','【C基础·结构】一个 struct 实际占多少字节？#pragma pack / __attribute__((aligned)) 影响？','要点：sizeof 含 padding；#pragma pack(n) 或 __attribute__((packed)) 可压缩对齐（去掉 padding），但可能带来未对齐访问性能/正确性代价；aligned(N) 可强制整体按 N 对齐。\n工程：协议结构体配 __attribute__((packed)) 让内存布局和线路字节一一对应，省去手工打包；代价是某些架构访问变慢或需特殊处理。\n坑：packed 结构体里取成员地址再强转访问，在严格对齐架构(如 ARM 某些模式)会总线错误；且 packed 非标准、可移植差。\n记忆：pack 省空间但可能慢/崩，协议打包才用。'],
  ['c','【C基础·结构】结构体作为函数参数传值 vs 传指针？','要点：传值会把整个结构体拷贝一份（大结构体开销大）；传指针(const Struct_t*）只拷 4/8 字节，且可避免拷贝、能改原对象（加 const 防改）。\n工程：只读访问一律 const BmsCell_t *c；要回写字段传 BmsCell_t *c 改 *c；大于几十字节的结构体绝不传值。\n坑：传值改了形参，原结构体不变，误以为生效。\n记忆：大结构体传 const 指针，省拷贝又安全。'],
  ['c','【C基础·结构】结构体可以整体赋值和作为返回值吗？','要点：可以。同类型结构体赋值按成员逐一拷贝（浅拷贝）；也可整体作返回值（仍可能整体拷贝，见函数节）。\n工程：Cfg_t a=b; 直接整体复制配置；但含指针/资源的“浅拷贝”只会复制指针，两个结构体指向同一块内存，free 时双击。\n坑：结构体含 char* 或 malloc 的缓冲区，整体赋值=浅拷贝，改一个影响另一个。\n记忆：结构体可整体赋值=浅拷贝，指针成员要警惕。'],
  ['c','【C基础·结构】柔性数组(flexible array member)用法？','要点：C99 允许结构体最后放一个长度为 0/空的数组 char data[]; 叫柔性数组成员；该数组不占结构体大小，配合 malloc(结构体+额外空间) 实现“头部固定+尾部变长”的连续内存块。\n工程：协议帧 struct Pkt{uint16_t len; uint8_t data[];}; 一次 malloc 拿到定长头+变长负载，省两次分配、缓存友好。\n坑：柔性数组只能在最后且只有一个；用 char data[0] 是 GCC 扩展，标准写法是 data[]；sizeof 不含柔性部分。\n记忆：柔性数组放最后，malloc 多要的空间才生效。'],
  ['c','【C基础·结构】嵌套结构体对齐？包含子结构体时的对齐规则？','要点：子结构体作为成员时，按子结构体“自身对齐要求”（通常是其最宽成员对齐）对齐；整体大小仍向上取整到最宽基本成员对齐倍数。\n工程：struct{char a; struct{int x;char y;} b;} 中 b 按 int 的 4 字节对齐，计算 padding 要算子结构。\n坑：嵌套后总大小比“肉眼相加”更大，协议布局打乱；用 packed/手动布局或字段重排优化。\n记忆：子结构按它自己的对齐要求对齐。'],
  ['c','【C基础·结构】怎么计算结构体里某成员的偏移 offsetof 宏？','要点：<stddef.h> 的 offsetof(type, member) 返回成员相对结构体起始的字节偏移，编译期可得。\n工程：解析通信帧时 field = base + offsetof(Frame_t, soc); 或手写 ((size_t)&((type*)0)->member) 等价技巧。\n坑：手写 (type*)0 技巧依赖未定义行为（解空指针），标准做法用 offsetof 宏。\n记忆：取偏移用 offsetof，别手解空指针。'],
  ['c','【C基础·联合】union 是什么？所有成员共享同一段内存？','要点：union 所有成员从同一地址开始，共用同一段内存，任一时刻只有一个成员有意义；sizeof(union) 取最大成员大小。\n工程：union{Uint32_t w; uint8_t b[4];} 可把 32 位字按字节访问，做大小端转换/协议拆包。\n坑：写一个成员再读另一个成员是“类型双关”，按当前规则属于未定义行为（除非经字符类型或 memcpy），别随便跨类型读。\n记忆：union=共用内存，写 A 读 B 是双关要谨慎。'],
  ['c','【C基础·联合】union 怎么用来判断大小端？','要点：union{uint32_t u; uint8_t c[4];} x; x.u=0x01020304; 若 x.c[0]==0x04 则小端(低字节在低地址)，若 x.c[0]==0x01 则大端。\n工程：启动时跑一次判断字节序，决定协议/Flash 存取是否要 swap；比指针强转读更直观。\n坑：用 char* 强转读 u 的首字节也行，但 union 写法更不易踩严格别名。\n记忆：看低地址字节是低权重位还是高权重位，判大小端。'],
  ['c','【C基础·联合】union 做类型双关(type punning)与 strict aliasing 的关系？','要点：C 严格别名规则禁止通过“不兼容类型的左值”访问同一对象；用 union 在成员间 reinterpret 是标准允许的例外（比 *(float*)&i 更安全）。但读未写入的成员结果实现相关。\n工程：跨类型解释位模式优先用 memcpy(&dst,&src,sizeof)，既符合严格别名又可移植；union 双关在多数编译器也接受。\n坑：int i=1; float f=*(float*)&i; 违反严格别名，开 -fstrict-aliasing 优化会被编译器“优化掉”得错值。\n记忆：跨类型位解释用 memcpy 最稳，union 次之。'],
  ['c','【C基础·预处理】#include <> 和 "" 的区别？搜索路径不同？','要点：#include <x.h> 只在“系统/编译器标准包含路径”找；#include "x.h" 先在当前文件目录找，找不到再退回系统路径。\n工程：自己的项目头用 "bms.h"，标准库用 <stdint.h>；包含路径通过 -I 给编译器补充。\n坑：用 <> 包含项目私有头可能找不到（不在标准路径），应优先用 ""。\n记忆：<>系统库，""先找本地。'],
  ['c','【C基础·预处理】对象宏和函数宏？为什么函数宏每个参数和整体要加括号？','要点：#define N 100 是对象宏（纯替换）；#define MAX(a,b) ((a)>(b)?(a):(b)) 是函数宏。参数和整体加括号防止替换后运算顺序被外围表达式破坏。\n工程：MAX(a,b) 若不加括号，2*MAX(1,2) 展开成 2*(1)>(2)?(1):(2) 完全错；正确写法整体再套一层 ()。\n坑：宏括号少了，和 != && 等混用时优先级翻转，是最隐蔽的 bug 之一。\n记忆：函数宏参数和整体都加()，防优先级坑。'],
  ['c','【C基础·预处理】宏里 #（字符串化）和 ##（拼接）运算符？','要点：# 把宏参数变成字符串字面量；## 把两段 token 拼接成一个标识符；二者只能在宏体里用。\n工程：#define STR(x) #x 让 STR(abc) 变 "abc"；#define CONCAT(a,b) a##b 让 CONCAT(led,on) 变 ledon，常用于自动生成函数/寄存器名。\n坑：# 和 ## 只对“宏参数”生效，想拼接后再展开要多层宏技巧。\n记忆：# 变字符串，## 拼标识符，只用于宏。'],
  ['c','【C基础·预处理】条件编译 #if/#ifdef/#ifndef/#else/#endif 用途？','要点：按宏是否定义/真假，在预处理期决定“哪段代码进编译”。常用于跨平台、调试开关、特性开关。\n工程：#ifdef DEBUG ...日志... #endif；#if defined(STM32F4) ... #elif defined(GD32) ... 适配多芯片。\n坑：条件编译嵌套过深可读性差；忘了 #endif 配对会报一堆莫名错误。\n记忆：条件编译=预处理期裁剪代码，跨平台/调试开关。'],
  ['c','【C基础·预处理】头文件守卫 #ifndef X_H / #define X_H / #endif 干嘛？','要点：防止同一头文件被重复包含导致“重复定义/重声明”。第一次包含时 X_H 未定义→定义并编译内容；再次包含时 X_H 已定义→整段跳过。\n工程：每个 .h 顶端写 #ifndef BMS_H / #define BMS_H / ... / #endif，配合文件名唯一宏。\n坑：宏名撞名（如都用 _H）会误伤；用项目前缀全大写宏名避免冲突。\n记忆：头文件守卫防重复包含，宏名要唯一。'],
  ['c','【C基础·预处理】#pragma once 和头文件守卫区别？','要点：#pragma once 让编译器“本文件只处理一次”，效果同守卫但更简洁、不易写错宏名；非标准但主流编译器都支持。\n工程：新项目可直接用 #pragma once 代替守卫；要最大可移植（含老编译器）仍用 #ifndef 守卫。\n坑：同一文件有多个硬链接/拷贝时 #pragma once 可能认不出是“同一文件”；守卫靠宏名更稳。\n记忆：#pragma once 简洁，守卫最可移植。'],
  ['c','【C基础·预处理】常用预定义宏 __FILE__/__LINE__/__func__ ？日志里怎么用？','要点：__FILE__ 当前文件名、__LINE__ 当前行号、__func__ 当前函数名（C99），都是编译器自动填；常用于调试日志定位。\n工程：LOG_ERR("%s:%d %s: fail", __FILE__,__LINE__,__func__); 出问题一眼看到文件行号函数。\n坑：__func__ 是隐式局部变量（不是宏，C99），不能 #if 判断；用 __LINE__ 拼字符串要在宏里用 #。\n记忆：__FILE__/__LINE__/__func__ 三件套做日志定位。'],
  ['c','【C基础·预处理】为什么不能把带副作用的宏参数传入函数宏（如 ++i）？','要点：函数宏是文本替换，参数出现几次就展开几次；MAX(a++,b) 里 a++ 出现两次，a 被自增两次，结果错且难查。\n工程：宏参数用“纯表达式”（无自增/无函数调用副作用）；非要传就先算好值再传：int t=a++; MAX(t,b);。\n坑：把“会改状态的参数”塞进宏，自增/函数调用执行多次，是经典隐蔽 bug。\n记忆：宏参数别带副作用，会被展开多次。'],
  ['c','【C基础·存储】auto/register/static/extern 各是什么存储类说明符？','要点：auto=默认局部(栈，可省略)；register=建议放寄存器(现代编译器忽略，C23 弃用)；static=静态存储期/内部链接；extern=声明外部定义。typedef 严格说也是存储类说明符（但和别的冲突）。\n工程：局部计数用 static；跨文件变量用 extern；想进寄存器交给编译器自己决定，别手写 register。\n坑：一个声明里至多一个存储类说明符（如不能同时 static 和 extern 在一处，二者语义冲突的位置不同）。\n记忆：auto默认、register过时、static留值、extern借外部。'],
  ['c','【C基础·存储】作用域、链接、存储期三者怎么用一张表区分？','要点：作用域=“名字在源码哪段可见”（块/文件）；链接=“能不能跨翻译单元”（external/internal/none）；存储期=“对象活多久”（自动/静态/动态）。三者正交但常一起记。\n工程：普通全局=int文件作用域+external链接+静态存储期；static 全局=文件作用域+internal链接+静态期；局部 auto=块作用域+无链接+自动期；static 局部=块作用域+无链接+静态期。\n坑：把“作用域”和“链接”混为一谈——局部 static 作用域仍只在函数内，只是存储期变长。\n记忆：作用域看可见范围，链接看跨文件，存储期看存活。'],
  ['c','【C基础·内存】C 程序内存通常分哪几段（text/rodata/data/bss/heap/stack）？','要点：text=代码(只读可执行)；rodata=只读数据(常量/字面量)；data=已初始化的全局/static(初值非0)；bss=未初始化/初值0的全局/static(启动清零)；heap=动态分配(malloc)；stack=局部变量/调用帧。\n工程：看固件 map 文件能知道每段占多少 Flash/RAM；大常量放 rodata 省 RAM，大缓冲区放 bss/data 占 RAM。\n坑：把运行期要改的大数组定义成全局→占 RAM；其实可放 static 或动态，但动态在 MCU 上慎用。\n记忆：代码/只读/已初/未初/堆/栈，六段记清。'],
  ['c','【C基础·内存】局部变量放栈，全局/static 放 data/bss，字符串字面量放 rodata？','要点：局部(auto)变量在函数栈帧里，进出作用域生灭；全局与 static 放 data(初值非0)或 bss(0/未初)；字符串字面量在 rodata。\n工程：中断里用的变量若想跨调用保留用 static；临时计算用局部；常量表用 const 进 rodata。\n坑：在中断和主循环共享的变量若只是普通局部，无法共享；要共享得是全局/static 并加 volatile。\n记忆：局部→栈，全局/static→data/bss，字面量→rodata。'],
  ['c','【C基础·内存】栈溢出是什么？怎么发生（大局部数组/深递归）？后果？','要点：栈是固定大小的内存区（链接脚本定），局部变量/调用帧都往里长；用超了就“栈溢出”，覆盖相邻内存(常是堆或其它全局)，导致诡异崩溃/复位。\n工程：函数里 char buf[4096]; 在只有 1KB 栈的 MCU 上必溢；深递归、中断嵌套过深也会。增大栈或改静态/动态分配。\n坑：栈溢出“不一定立即崩”，可能踩坏别的数据，现象随机最难查；可用栈水线(stack watermark)监测。\n记忆：栈有上限，大数组/深递归会溢，现象诡异。'],
  ['c','【C基础·内存】为什么嵌入式固件常禁用堆(malloc)？','要点：堆有四大问题：碎片(长期运行后无连续大块)、分配失败需处理、时延不确定(实时系统要可预测)、实现占 RAM。MCU 资源紧、要长期可靠，所以常禁堆。\n工程：BMS 等安全相关代码用静态缓冲池/内存池预先分配，避免运行时 malloc；实时任务绝不动态分配。\n坑：以为 malloc 失败返回 NULL 就安全——忘了检查到处都是，且碎片累积终会失败。\n记忆：堆=碎片+不确定时延，车规固件多禁用。'],
  ['c','【C基础·内存】动态分配 malloc/free 配对？内存泄漏和 double free？','要点：malloc 申请、free 释放，必须成对；漏 free=内存泄漏(越用越多)；对同一指针 free 两次=double free(破坏堆)；free 后继续用=悬垂。\n工程：遵循“谁分配谁释放/单一所有权”；free(p) 后立刻 p=NULL；用静态分析/Valgrind(PC)查泄漏。\n坑：函数里 malloc 后中途 return 忘了 free→泄漏；把指针传出去又被别处 free→double free。\n记忆：malloc/free 成对，free 后置 NULL。'],
  ['c','【C基础·内存】栈变量地址和全局变量地址大概谁高谁低（栈向下增长）？','要点：典型布局：内核/代码在高地址，栈从高向低增长，堆从低向高增长，全局/静态在中间；栈和堆“相向生长”，相遇即内存耗尽。\n工程：打印 &local 和 &global 能验证：local 地址通常比 global 高很多（栈在顶）。理解布局有助判断越界踩到谁。\n坑：具体布局由链接脚本/OS 决定，不要写死依赖，但“栈向下、堆向上”是通用约定。\n记忆：栈向低、堆向高，中间是全局，相向生长。'],
  ['c','【C基础·位运算】怎么把第 n 位置 1 / 清 0 / 取反 / 读取？','要点：置位 x |= (1u<<n)；清位 x &= ~(1u<<n)；取反 x ^= (1u<<n)；读取 bit = (x>>n)&1；统一用无符号 1u 防符号问题。\n工程：配置寄存器：开启第 3 路时钟 RCC->APB2ENR |= (1u<<3)；关闭就 &= ~(1u<<3)。\n坑：用 1<<n 当 n 接近类型位宽时，有符号 1 左移进符号位是 UB，务必 1u。\n记忆：置位|、清位&~、翻转^、读>>&1，掩码用 1u。'],
  ['c','【C基础·位运算】怎么提取低 4 位、第 n 位、拼字段？寄存器配置典型操作？','要点：取低 4 位 x & 0xF；取第 n 位 (x>>n)&1；拼字段先清该域再或入：x = (x & ~(0x7u<<pos)) | (val<<pos)；读字段 (x>>pos)&0x7。\n工程：CAN 波特率寄存器某 3 位存分频值，改它先 ~(掩码<<pos) 清再 | 新值，不动邻位。\n坑：清域时掩码位数写错(如本应 0x7 写成 0xF)会误清相邻位，硬件行为异常。\n记忆：改位域=清域再或入，掩码位数要对。'],
  ['c','【C基础·位运算】异或 ^ 的妙用（不用临时变量交换、翻转比特、奇偶校验）？','要点：a^=b; b^=a; a^=b; 可交换(仅同类型、不重叠)；x^0xFF 按位翻转；累加异或做奇偶/校验；a^a=0 可用于清零。\n工程：翻转 LED 电平用 reg ^= (1u<<pin)；通信里用异或累加做简单校验和。\n坑：异或交换当 a、b 是同一地址(如 swap(&x,&x))会清零，要判不同；不如直接用临时变量清晰。\n记忆：^ 翻位、清零、校验、交换(慎用同址)。'],
  ['c','【C基础·位运算】左移右移：逻辑右移和算术右移（有符号右移补符号位）区别？','要点：左移 << 都是补 0；右移 >> 对无符号是逻辑右移(补0)，对有符号是算术右移(补符号位)——但后者是实现定义，标准未强制。\n工程：做除法/2 用 >>，但只对无符号保证逻辑正确；有符号负数右移结果随编译器(多数补符号位)。\n坑：对有符号数 a>>1 当 a 为负，结果平台相关；要可移植用无符号或显式除。\n记忆：右移：无符号补0，有符号补符号位(实现相关)。'],
  ['c','【C基础·位运算】移位位数超过类型宽度是 UB？x << 32 当 x 是 32 位时？','要点：移位位数 ≥ 类型宽度（或为负）是未定义行为；32 位 int 做 x<<32 或 x>>32 结果不可预测，有的编译器直接取模有的崩溃。\n工程：移位前先判 n < 位宽；跨位宽移位用更宽的中间类型(如 1ULL<<n 再截断)。\n坑：for(i=0;i<32;i++) 里 1<<i 当 i==32 越界，循环条件应 i<位宽。\n记忆：移位位数必须 < 类型位宽，否则 UB。'],
  ['c','【C基础·陷阱】整数溢出（有符号溢出是 UB）？怎么检测？','要点：无符号溢出会回绕(定义明确)；有符号溢出是未定义行为(结果不可预测，且编译器可能优化掉你的检查)。\n工程：检测用更宽类型：int32_t sum=(int64_t)a+b; if(sum>INT32_MAX) saturate; 或用 __builtin_add_overflow。BMS 电压相加必查溢出。\n坑：if(a>INT_MAX-b) 这种检查本身依赖“未溢出”假设，对有符号 UB 不可靠，优先用更大类型或编译器内建。\n记忆：有符号溢出=UB，用宽类型或内建函数查。'],
  ['c','【C基础·陷阱】有符号与无符号混用比较（a < strlen(s) 当 a 为负）？','要点：有符号与 size_t 比较时，负数被转成巨大正数，比较结果反直觉；常见于 for(int i=...) 与 strlen/sizeof 返回值比。\n工程：循环变量和长度都统一成 size_t；或先判断 i>=0 再比。\n坑：int len=get(); for(int i=len-1;i>=0;i--) 当 len=0，i 变 size_t 类巨大值，死循环。\n记忆：负号一比无符号变大，循环变量用 size_t。'],
  ['c','【C基础·陷阱】数组越界、缓冲区溢出（经典安全漏洞）？','要点：C 不做边界检查，越界读写相邻内存，轻则数据错乱，重则改掉返回地址被利用执行恶意代码（栈溢出攻击）。\n工程：所有数组访问前确认下标范围；用带长度的安全函数(snprintf/strncpy+补\'\\0\')；协议解析严格校验长度字段。\n坑：以为“编译器会帮我检查下标”——不会，越界照编不误，运行时才爆。\n记忆：越界=UB+安全漏洞，访问前必查范围。'],
  ['c','【C基础·陷阱】空指针/野指针解引用？','要点：NULL 或随机地址(未初始化/已 free)解引用是 UB，必然崩溃/硬件异常；是嵌入式最常复位原因之一。\n工程：指针用前判 NULL；free 后置 NULL；全局指针初始化为 NULL 而非野值。\n坑：野指针“有时能用”是因为那块内存还没被覆盖，纯属运气，迟早崩。\n记忆：指针用前判空，free 后置 NULL。'],
  ['c','【C基础·陷阱】返回局部变量地址（悬垂指针）？','要点：函数返回局部变量/局部数组的地址，调用方拿到已失效栈地址，解引用得垃圾；是初学者的高频错误。\n工程：要返回数据用：static 缓冲（注意重入）、malloc（调用方 free）、或出参指针由调用方提供。\n坑：返回后“第一次调用还能读到正确值”，因为栈没被覆盖，第二次就乱，最难复现。\n记忆：别 return 局部地址，用出参/static/malloc。'],
  ['c','【C基础·陷阱】内存泄漏（malloc 不 free）？','要点：分配的内存不再引用又不释放，长期运行越占越多，最终耗尽；长时间运行的 BMS/网关尤其致命。\n工程：明确所有权(谁分配谁释放)；用内存池代替频繁 malloc/free；静态分析工具查泄漏。\n坑：只在“出错分支”忘了 free 就泄漏；错误路径也要释放。\n记忆：分配必配对释放，错误路径别漏。'],
  ['c','【C基础·陷阱】未初始化变量读取？','要点：局部变量不初始化就是栈上垃圾值，读它(尤其用作数组下标/循环条件)直接 UB/诡异行为。\n工程：定义即赋初值：int cnt=0; uint8_t *p=NULL; 好习惯杜绝一半怪 bug。\n坑：全局/static 自动是 0，于是误以为局部也是 0——两者规则完全不同。\n记忆：局部变量用前必初始化。'],
  ['c','【C基础·陷阱】浮点数不能直接 == 比较（精度误差）？','要点：float/double 有二进制表示误差，0.1+0.2 != 0.3，用 == 比较几乎总失败；应判绝对值差小于 eps。\n工程：if(fabs(a-b) < 1e-6) 判近似相等；SOC 比较用误差带而非精确相等。\n坑：循环 while(x!=1.0) 当 x 每次加 0.1 可能永不精确等于 1.0，死循环。\n记忆：浮点别 ==，用 fabs(a-b)<eps。'],
  ['c','【C基础·陷阱】宏展开副作用（MAX(a++,b) 自增两次）？','要点：函数宏参数文本替换多处出现，带自增/函数调用的参数会被执行多次，结果/副作用错。\n工程：宏参数用纯值；或改用 static inline 函数（有类型检查、无多次求值）。\n坑：MAX(arr[i++], 0) 让 i 自增两次，数组索引错位。\n记忆：宏参数无副作用，否则改 inline。'],
  ['c','【C基础·陷阱】自增在表达式中的未定义顺序（i=i++）？','要点：同一表达式里对同一对象多次修改且无序列点(如 i=i++、a[i++]=i++) 是未定义行为，结果随编译器/优化级别变。\n工程：一条语句里只改一个对象一次；自增单独成句：i++; x=arr[i];。\n坑：依赖“先取值还是先加”的直觉写 i=i++，不同编译器结果不同，移植即炸。\n记忆：一句里别让同一变量改两次。'],
  ['c','【C基础·陷阱】函数参数求值顺序未指定？fun(f(),g()) 调用顺序？','要点：C 标准未规定函数实参的求值顺序，f() 和 g() 谁先调用由实现决定；若它们修改同一全局变量，结果不可预测。\n工程：别在实参里写有副作用且相互依赖的调用；先各算好再传：int a=f(); int b=g(); fun(a,b);。\n坑：printf("%d %d", i++, i++) 打印什么完全不确定。\n记忆：实参求值顺序未定，别依赖。'],
  ['c','【C基础·stdlib】stdio：printf/scanf 家族、嵌入式重定向 stdout 到串口？','要点：printf 格式化输出、scanf 输入；嵌入式没有终端，需重写 _write/write 系统调用把 stdout 重定向到串口(UART)，才能用 printf 调试。\n工程：半主机(semihosting)或重定义 _write 把字符发到 UART；量产固件一般关掉 printf 以省体积和耗时。\n坑：裸机直接调用 printf 可能卡死（没实现底层 _write）；且 printf 体积大、阻塞，实时任务禁用。\n记忆：printf 要重定向底层，裸机先接 UART。'],
  ['c','【C基础·stdlib】string.h：memcpy/memset/memcmp/memmove 区别？','要点：memcpy 拷贝 n 字节(源目的不可重叠，重叠用 memmove)；memset 按字节填值(清 0 用 0)；memcmp 按字节比较；三者都按字节不论类型。\n工程：buf 清零用 memset(buf,0,sizeof(buf))；结构体拷贝用 memcpy(&dst,&src,sizeof)；同一块内存移动用 memmove 防重叠错。\n坑：memset(p,0,sizeof(p)) 当 p 是指针时只清了指针本身不是它指向的缓冲（应写 sizeof(*p) 或具体大小）。\n记忆：重叠用 memmove；memset 按字节；指针别传 sizeof(p)。'],
  ['c','【C基础·stdlib】stdlib.h 常用：malloc/free/atoi/rand/qsort/exit？','要点：动态分配/释放、字符串转整数 atoi(不查错，慎用 strtol)、伪随机 rand、快速排序 qsort、终止 exit。\n工程：atoi 出错静默返回 0 或截断，解析外部输入用 strtol(&end,10) 并检查 end；排序用 qsort 配比较函数(注意严格别名)。\n坑：atoi("abc") 返回 0 和 atoi("0") 分不清；rand() 范围与质量有限，加密不可用。\n记忆：转整数用 strtol 查错，别用 atoi。'],
  ['c','【C基础·stdlib】ctype.h：isdigit/isalpha 等（参数为 unsigned char 或 EOF）？','要点：字符分类宏 isdigit/isalpha/isspace 等，参数必须是 unsigned char 或 EOF；传有符号 char(负值)是 UB。\n工程：读字节判断 if(isdigit((unsigned char)c)) 才安全；直接 if(isdigit(c)) 当 c 为负(扩展为符号)会越界访问内部表。\n坑：char 可能是有符号，EOF 是 -1，负数进 ctype 宏会数组越界。\n记忆：ctype 参数先转 unsigned char。'],

  ['c','【C基础·可移植】字节序（大小端）对跨设备/网络/Flash 存储的影响？','要点：多字节数据在内存的存放顺序因 CPU 而异（小端低字节在低地址，如 x86/ARM；大端反之，如部分网络/老架构）。跨设备通信、写 Flash、网络协议都需约定字节序并做 swap。\n工程：CAN/串口协议常规定“大端”，MCU 是小端就要 swap16/swap32 转换；Flash 存的结构体读出要在同端机器解析。\n坑：在同一台小端机内部直接 memcpy 没问题，一旦跨机/跨协议不 swap 就高低字节颠倒。\n记忆：跨设备/网络先约定端序，必要时 swap。'],
  ['c','【C基础·typedef】typedef 与 #define 定义类型别名的区别？','要点：typedef 是真“类型别名”（编译器认知的类型），有作用域；#define 是文本替换，可能在某些上下文展开出错（如 #define PTR int* 后 PTR a,b; 只有 a 是指针）。\n工程：类型别名一律用 typedef（或 C11 using），如 typedef volatile uint32_t* Reg_t;；指针别名尤其别用宏。\n坑：#define U32 int 在 U32* p 处正确，但 #define PINT int* 在 PINT a,b 里 b 变成 int 而非 int*。\n记忆：类型别名用 typedef，别用宏(尤其指针)。'],
  ['c','【C基础·typedef】用 typedef 简化函数指针和复杂指针声明？','要点：复杂声明先 typedef 拆层，可读性暴涨；如 typedef void (*Isr_t)(void); 把“指向无参无返回的函数指针”命名为 Isr_t，之后 Isr_t vec[32]; 清晰。\n工程：中断向量表、回调表、状态机跳转全用 typedef 后的函数指针类型，避免裸声明括号地狱。\n坑：不 typedef 直接写 void (*vec[32])(void); 可读性差易错；改 typedef 最稳。\n记忆：复杂指针先 typedef，声明才清爽。'],
  ['c','【C基础·声明】复杂声明怎么读（右左法则）？int (*(*f)(int))[10]; 是什么？','要点：右左法则：从名字 f 出发，先右看再左看，遇 ) 跳外层：f 是“指向函数的指针”(参 int，返回“指向含10个int的数组的指针”)。逐层拆最稳。\n工程：实际中不手写这种怪兽，先用 typedef 拆：typedef int (*Arr10_t)[10]; typedef Arr10_t (*F_t)(int); F_t f; 立刻清楚。\n坑：死记声明语法不如用 typedef 分层；硬读容易括号错位。\n记忆：复杂声明用 typedef 分层，或右左法则逐层。'],

/* ===================== 语音：TTS ===================== */
const synth=window.speechSynthesis;
function speak(text){
  if(!ttsOn||!synth) return;
  synth.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/[`*]/g,''));
  u.lang='zh-CN'; u.rate=1; u.pitch=1;
  (synth.getVoices().find(v=>/zh|Chinese/i.test(v.lang))||null) && (u.voice=synth.getVoices().find(v=>/zh|Chinese/i.test(v.lang)));
  synth.speak(u);
}

}else{
  $('#voiceHint').textContent='⚠️ 当前浏览器不支持语音识别，可手动输入后点「智能评分」。';
  $('#recBtn').style.display='none';
}
function toggleRec(){
  if(recOn){ rec.stop(); return; }
  rec=new SR(); rec.lang='zh-CN'; rec.interimResults=true; rec.continuous=false;
  const ta=$('#myAns');
  rec.onresult=(e)=>{
    let txt=''; for(let i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript;
    ta.value=txt; $('#recState').innerHTML='<span class="rec-dot"></span>识别中…';
  };
  rec.onerror=(e)=>{ $('#recState').textContent='识别出错：'+e.error; setRecOff(); };
  rec.onend=()=>{ setRecOff(); $('#recState').textContent='✓ 已识别，可点「智能评分」'; };
  rec.start(); setRecOn();
}
function setRecOn(){ recOn=true; $('#recBtn').classList.add('rec'); $('#recBtn').textContent='■ 停止'; }
function setRecOff(){ recOn=false; $('#recBtn').classList.remove('rec'); $('#recBtn').textContent='🎤 语音作答'; }

/* ===================== 智能评分 ===================== */
function bigrams(s){ s=s.replace(/\s/g,''); const g=[]; for(let i=0;i<s.length-1;i++) g.push(s.substr(i,2)); return g; }
function dice(a,b){ if(!a||!b) return 0; const A=bigrams(a),B=bigrams(b); if(!A.length||!B.length) return 0;
  const sb=new Set(B); let hit=0; A.forEach(x=>{if(sb.has(x))hit++;}); return (2*hit)/(A.length+B.length); }
function keypoints(ref){
  // 按句/子句拆分，过滤太短的
  const parts=ref.split(/[。；;\n]/).map(s=>s.trim()).filter(s=>s.length>=4);
  const out=[]; parts.forEach(p=>{ if(p.length>14 && p.includes('，')) p.split('，').forEach(x=>x.trim().length>=4&&out.push(x)); else out.push(p); });
  return out.filter(s=>s.length>=4);
}
function grade(){
  const i=order[curIdx]; const ref=QA[i][2]; const user=$('#myAns').value.trim();
  const box=$('#gradeBox'); box.style.display='block';
  if(!user){ $('#gradeFill').style.width='0%'; $('#gradeMsg').innerHTML='<span class="miss">先作答（语音或打字）再评分。</span>'; return; }
  const pts=keypoints(ref); let covered=[],missed=[];
  pts.forEach(p=>{ (dice(user,p)>=0.32||user.includes(p.slice(0,4)))?covered.push(p):missed.push(p); });
  const score=Math.round(covered.length/Math.max(pts.length,1)*100);
  $('#gradeFill').style.width=score+'%';
  let msg='<b>智能评分：'+score+' 分</b>（覆盖 '+covered.length+'/'+pts.length+' 个要点）';
  if(covered.length) msg+='<br><span class="ok">✓ 已涵盖：'+covered.slice(0,3).map(escapeHtml).join('； ')+(covered.length>3?'…':'')+'</span>';
  if(missed.length) msg+='<br><span class="miss">✗ 建议补充：'+missed.slice(0,3).map(escapeHtml).join('； ')+(missed.length>3?'…':'')+'</span>';
  if(score>=80) msg+='<br><span class="ok">很扎实，可以点「😎 熟练」。</span>';
  else if(score>=45) msg+='<br><span class="miss">方向对但不够完整，看参考答案补全。</span>';
  else msg+='<br><span class="miss">关键点没答到，建议先看参考答案再复述。</span>';
  $('#gradeMsg').innerHTML=msg;
  speak('评分 '+score+' 分。'+(missed.length?('建议补充：'+missed[0]):'回答很完整'));
}

/* ===================== 面试模式 ===================== */
function buildChips(){
  const wrap=$('#catChips'); wrap.innerHTML='';
  const mk=(k,label)=>{const c=document.createElement('span');c.className='chip'+(curFilter===k?' active':'');c.textContent=label;c.onclick=()=>{curFilter=k;buildChips();};return c;};
  wrap.appendChild(mk('all','全部'));
  wrap.appendChild(mk('proto','外设协议'));
  wrap.appendChild(mk('project','项目深挖'));
  const groups=[['技术基础',['c','mcu','cortex','rtos','safety','mcal','build','tools','make','compiler','cmake','emake','os','realtime','si']],
                ['通信/外设',['comms','p_can','p_lin','p_spi','p_i2c','p_uart','p_sent','p_flexray','p_eth','p_pwm','p_icu','p_adc','p_gpio','p_dsi3','p_psi5']],
                ['汽车/工程',['bms','bmsadv','diag','wdt','power','storage','autosar','test','cert','local','collab']]];
  groups.forEach(([g,arr])=>{const sep=document.createElement('span');sep.className='muted small';sep.textContent='· '+g;sep.style.marginLeft='4px';wrap.appendChild(sep);arr.forEach(k=>wrap.appendChild(mk(k,CATS[k])));});
}
function startQuiz(weakOnly){
  curList=filterList();
  if(weakOnly){
    const weak=curList.filter(i=>{const r=prog[qkey(i)]&&prog[qkey(i)].rate; return r===0||r===1;});
    if(weak.length===0){ alert('当前筛选下没有「不会/模糊」的题，先正常练几轮吧。'); return; }
    curList=weak;
  }
  if(curList.length===0){alert('该分类暂无题目');return;}
  order=curList.slice();
  curIdx=0; answered=ok=mid=bad=0;
  $('#quizCard').style.display='block'; $('#doneCard').style.display='none';
  $('#cfgHint').textContent='本轮 '+curList.length+' 题 ｜ 方向：'+(weakOnly?'弱项优先 · ':'')+catName(curFilter);
  renderQuiz();
}
function catName(f){return f==='all'?'全部':f==='proto'?'外设协议':f==='project'?'项目深挖':CATS[f];}
function renderQuiz(){
  const i=order[curIdx]; const [cat,q,a]=QA[i];
  $('#qCat').textContent=CATS[cat]||cat;
  $('#qText').textContent=q;
  $('#ansText').textContent=a;
  $('#myAns').value='';
  $('#gradeBox').style.display='none'; $('#recState').textContent='';
  $('#ansBox').classList.remove('show');
  $('#rateBox').style.display='none';
  $('#showAnsBtn').style.display='inline-block';
  $('#favStar').textContent=fav[qkey(i)]?'★':'☆';
  $('#favStar').classList.toggle('on',!!fav[qkey(i)]);
  $('#prevBtn').disabled=curIdx===0;
  $('#nextBtn').disabled=curIdx===order.length-1;
  // 追问
  const fu=$('#fuChips'); fu.innerHTML='';
  const list=FOLLOWUPS[cat];
  if(list){ list.forEach(([q2,a2])=>{ const c=document.createElement('span'); c.className='fu-chip'; c.textContent='❓ '+q2;
    const ans=document.createElement('div'); ans.className='fu-a'; ans.textContent='💡 '+a2;
    c.onclick=()=>{ ans.style.display=ans.style.display==='block'?'none':'block'; if(ans.style.display==='block') speak(a2); };
    fu.appendChild(c); fu.appendChild(ans); });
    $('#fuBox').style.display='block';
  } else $('#fuBox').style.display='none';
  if(ttsOn) speak(q);
  $('#progBar').style.width=(answered/order.length*100)+'%';
  $('#progTxt').textContent='已答 '+answered+' / '+order.length+' ｜ 熟练 '+ok+' · 模糊 '+mid+' · 不会 '+bad;
}
$('#startBtn').onclick=()=>startQuiz(false);
$('#weakBtn').onclick=()=>startQuiz(true);
$('#shuffleBtn').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}curIdx=0;answered=ok=mid=bad=0;$('#quizCard').style.display='block';$('#doneCard').style.display='none';renderQuiz();};
$('#speakQBtn').onclick=()=>speak($('#qText').textContent);
$('#showAnsBtn').onclick=()=>{
  $('#ansBox').classList.add('show'); $('#rateBox').style.display='flex';
  $('#showAnsBtn').style.display='none';
  if(ttsOn) speak('参考答案：'+QA[order[curIdx]][2]);
  const i=order[curIdx]; const k=qkey(i); if(!prog[k]){prog[k]={seen:true};saveProg();}
};
$('#gradeBtn').onclick=grade;
$('#rateBox').querySelectorAll('.btn').forEach(b=>b.onclick=()=>{
  const i=order[curIdx]; const k=qkey(i); const r=+b.dataset.r;
  const prev=prog[k]&&prog[k].rate;
  if(prev===0)bad--; else if(prev===1)mid--; else if(prev===2)ok--;
  if(r===0)bad++; else if(r===1)mid++; else ok++;
  prog[k]={seen:true,rate:r}; saveProg();
  answered=Math.min(answered+1,order.length);
  if(answered>=order.length){finishQuiz();}
  else if(curIdx<order.length-1){curIdx++;renderQuiz();}
  else renderQuiz();
});
$('#prevBtn').onclick=()=>{if(curIdx>0){curIdx--;renderQuiz();}};
$('#nextBtn').onclick=()=>{if(curIdx<order.length-1){curIdx++;renderQuiz();}};
$('#favStar').onclick=()=>{
  const i=order[curIdx]; const k=qkey(i);
  if(fav[k]){delete fav[k];$('#favStar').textContent='☆';$('#favStar').classList.remove('on');}
  else{fav[k]=1;$('#favStar').textContent='★';$('#favStar').classList.add('on');}
  saveFav();
};
function finishQuiz(){
  $('#quizCard').style.display='none'; $('#doneCard').style.display='block';
  $('#doneTotal').textContent=answered; $('#doneOk').textContent=ok; $('#doneMid').textContent=mid; $('#doneBad').textContent=bad;
  $('#progBar').style.width='100%';
  if(ttsOn) speak('本轮完成，熟练 '+ok+' 题，模糊 '+mid+' 题，不会 '+bad+' 题。');
}
$('#againBtn').onclick=()=>startQuiz(false);
$('#weakAgainBtn').onclick=()=>startQuiz(true);

/* ===================== 知识学习 ===================== */
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderInline(s){
  return escapeHtml(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
}
function mdToHtml(md){
  const lines=md.split('\n'); let html='', i=0;
  while(i<lines.length){
    let line=lines[i];
    if(line.startsWith('### ')){html+='<h3>'+renderInline(line.slice(4))+'</h3>';i++;continue;}
    if(line.startsWith('## ')){html+='<h2>'+renderInline(line.slice(3))+'</h2>';i++;continue;}
    if(line.startsWith('# ')){html+='<h1>'+renderInline(line.slice(2))+'</h1>';i++;continue;}
    if(line.startsWith('> ')){html+='<blockquote>'+renderInline(line.slice(2))+'</blockquote>';i++;continue;}
    if(line.startsWith('|')){const tbl=[];while(i<lines.length&&lines[i].startsWith('|')){tbl.push(lines[i]);i++;}html+=parseTable(tbl);continue;}
    if(/^\s*[-*] /.test(line)){let items=[];while(i<lines.length&&/^\s*[-*] /.test(lines[i])){items.push(lines[i].replace(/^\s*[-*] /,''));i++;}html+='<ul>'+items.map(it=>'<li>'+renderInline(it)+'</li>').join('')+'</ul>';continue;}
    if(line.trim()===''){i++;continue;}
    html+='<p>'+renderInline(line)+'</p>';i++;
  }
  return html;
}
function parseTable(rows){
  if(rows.length<2)return '';
  const split=(r)=>r.split('|').map(c=>c.trim()).filter((c,idx,arr)=>!(idx===0&&c==='')&&!(idx===arr.length-1&&c===''));
  const head=split(rows[0]); let body=rows.slice(2);
  let h='<table><thead><tr>'+head.map(c=>'<th>'+renderInline(c)+'</th>').join('')+'</tr></thead><tbody>';
  body.forEach(r=>{const cells=split(r);h+='<tr>'+cells.map(c=>'<td>'+renderInline(c)+'</td>').join('')+'</tr>';});
  return h+'</tbody></table>';
}
let docCache={};
function getDoc(which){
  if(docCache[which])return docCache[which];
  const id = ({skill:'md-skill',proto:'md-proto',adv:'md-adv',cbase:'md-cbase',autosar:'md-autosar'})[which]||null;
  let md='';
  if(which==='all'){md=[...document.querySelectorAll('script[type=text/markdown]')].map(s=>s.textContent).join('\n\n');}
  else md=document.getElementById(id).textContent;
  docCache[which]=mdToHtml(md); return docCache[which];
}
function buildToc(which){
  const whichs = which==='all'?['skill','proto','adv','cbase','autosar']:[which];
  const toc=$('#toc'); toc.innerHTML='';
  whichs.forEach(w=>{
    const md=document.getElementById(({skill:'md-skill',proto:'md-proto',adv:'md-adv',cbase:'md-cbase',autosar:'md-autosar'})[w]).textContent;
    md.split('\n').forEach(l=>{ if(l.startsWith('## ')){const a=document.createElement('a');a.href='#';a.textContent=l.slice(3);
      a.onclick=(e)=>{e.preventDefault();const h=[...document.querySelectorAll('#docView h2')].find(x=>x.textContent===l.slice(3));if(h)h.scrollIntoView({behavior:'smooth'});};toc.appendChild(a);} });
  });
}
function renderLearn(){
  const which=$('#docSel').value;
  $('#docView').innerHTML=getDoc(which);
  $('#learnCount').textContent='约 '+($('#docView').textContent.length/1000|0)+'k 字';
  buildToc(which);
}
$('#docSel').onchange=renderLearn;
$$('#learn .chip').forEach(c=>c.onclick=()=>{
  $$('#learn .chip').forEach(x=>x.classList.remove('active'));
  c.classList.add('active'); $('#docSel').value=c.dataset.doc; renderLearn();
});
$('#searchBox').oninput=(e)=>{
  const q=e.target.value.trim().toLowerCase(); const view=$('#docView');
  if(!q){view.innerHTML=getDoc($('#docSel').value);buildToc($('#docSel').value);return;}
  const which=$('#docSel').value;
  const mds = which==='all'?['skill','proto','adv','cbase','autosar']:[which];
  let blocks=[];
  mds.forEach(w=>{ const md=document.getElementById(({skill:'md-skill',proto:'md-proto',adv:'md-adv',cbase:'md-cbase',autosar:'md-autosar'})[w]).textContent;
    md.split(/\n\n+/).forEach(b=>{ if(b.toLowerCase().includes(q)) blocks.push(b); }); });
  if(blocks.length===0){view.innerHTML='<p class="muted">未找到匹配内容，换个关键词试试。</p>';$('#toc').innerHTML='';return;}
  const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  view.innerHTML=blocks.map(b=>'<div style="margin-bottom:18px">'+mdBlock(escapeHtml(b).replace(re,'<mark>$1</mark>'))+'</div>').join('');
  $('#toc').innerHTML='<span class="muted small">搜索结果 '+blocks.length+' 条</span>';
  view.scrollTop=0;
};
function mdBlock(s){
  const lines=s.split('\n');let html='',i=0;
  while(i<lines.length){
    const line=lines[i];
    if(line.startsWith('### ')){html+='<h3>'+line.slice(4)+'</h3>';i++;continue;}
    if(line.startsWith('## ')){html+='<h2>'+line.slice(3)+'</h2>';i++;continue;}
    if(line.startsWith('# ')){html+='<h1>'+line.slice(2)+'</h1>';i++;continue;}
    if(line.startsWith('|')){const t=[];while(i<lines.length&&lines[i].startsWith('|')){t.push(lines[i]);i++;}html+=parseTable(t);continue;}
    if(/^\s*[-*] /.test(line)){let items=[];while(i<lines.length&&/^\s*[-*] /.test(lines[i])){items.push(lines[i].replace(/^\s*[-*] /,''));i++;}html+='<ul>'+items.map(it=>'<li>'+it+'</li>').join('')+'</ul>';continue;}
    if(line.trim()===''){i++;continue;}
    html+='<p>'+line+'</p>';i++;
  }
  return html;
}

/* ===================== 收藏 ===================== */
function renderFav(){
  const list=$('#favList'); list.innerHTML='';
  const keys=Object.keys(fav);
  $('#favCount').textContent=keys.length+' 题';
  if(keys.length===0){list.innerHTML='<p class="muted">还没有收藏。在「模拟面试」里点题目右上角的 ☆ 即可收藏。</p>';return;}
  keys.forEach(k=>{
    const [idx,q]=k.split('|'); const item=QA[+idx]; if(!item)return;
    const div=document.createElement('div');div.className='fav-row';
    div.innerHTML='<div style="flex:1"><div class="q">'+escapeHtml(item[1])+'</div><div class="a">'+escapeHtml(item[2])+'</div></div><button class="btn ghost" style="align-self:center">移除</button>';
    div.querySelector('button').onclick=()=>{delete fav[k];saveFav();renderFav();};
    list.appendChild(div);
  });
}

/* ===================== Tab 切换 ===================== */
$$('.tab').forEach(t=>t.onclick=()=>{
  $$('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  const tab=t.dataset.tab;
  ['interview','learn','fav'].forEach(s=>$('#'+s).classList.toggle('hide',s!==tab));
  if(tab==='learn')renderLearn();
  if(tab==='fav')renderFav();
});

/* ===================== 初始化 ===================== */
buildChips(); updateTtsBtn();
if(synth){ synth.onvoiceschanged=()=>{}; }
